.media.mit.edu/projects/connecting-through-comics-co-creating-a-collage-based-digital-system-for-expressing-complex-emotions-with-and-for-trauma-impacted-youth/overview/"},{"label":"原文开放HTML · 作者稿","url":"https://arxiv.org/html/2412.09834v1"},{"label":"MIT存档 · 正式发表版入口","url":"https://dspace.mit.edu/entities/publication/8494114c-c382-4f94-81f0-2d88a52182be"}],"papers":["AP02"],"trends":["能力导向与包容性交互","技能形成与学习支持"],"maker":"MIT Media Lab；PACMHCI／CSCW 2025"},{"id":"AT05","title":"MIT艺术疗愈聊天机器人｜围绕作品进行情绪反思","group":"student_cases","branches":["绘画与视觉表达"],"scope":"目标为经历发展性创伤的青年；本阶段评审者为17名艺术治疗师","status":"聊天机器人研究原型；本阶段不是学生试验","award":"","fact":"探索以艺术活动和反思提问支持青年辨认、处理与表达情绪，并整理治疗师的设计建议。","flow":"艺术表达 → 围绕作品提问 → 创作者解释感受 → 调整后续反思。","ai":"作者机构确认聊天机器人原型；本轮读取摘要，未确认具体模型和完整视觉理解流程。","ai_confirmed":false,"design":"重点借鉴提问节奏：让学生解释作品，允许不回答，并在需要时衔接真人辅导。","limit":"对象愿景与实际验证对象需分开；不能把17名专业人士的反馈写成青少年疗效或校园落地证据。","links":[{"label":"MIT作者机构摘要与研究介绍","url":"https://www.media.mit.edu/publications/navigating-emotions-through-art-recommendations-for-designing-art-therapy-based-chatbots-for-trauma-impacted-youth-recommendations-for-des/"},{"label":"ACM正式论文原链接","url":"https://doi.org/10.1145/3706599.3719869"}],"papers":["AP03","AP04"],"trends":["人—智能体协作与混合主动权","可解释交互与信任校准"],"maker":"Christine Wu、Ila Krishna Kumar、Rosalind Picard；CHI EA 2025"},{"id":"AT06","title":"Willow｜对话到音乐的AI共创工作站","group":"transfer_cases","branches":["音乐共创"],"scope":"一般抑郁人群；奖项页未明确学生或年龄","status":"获奖概念；用于音乐交互方法迁移","award":"Red Dot Design Concept 2025 · Red Dot: Next Gen Award · Healthcare","fact":"概念将对话中的心理状态转成音乐，再让使用者编辑为个人表达。","flow":"对话 → AI音乐草稿 → 使用者编辑 → 聆听与反思。","ai":"奖项官网明确AI音乐生成与对话分析；模型、部署及临床验证未披露。","ai_confirmed":true,"design":"可借鉴音乐草稿的可修改性：让学生选择节奏和声部，比较“自己参与创作”与只听音乐。","limit":"它不是现成的中小学音乐心理课程。官网CBT与治疗描述是概念主张，未据此认定诊断或疗效。","links":[{"label":"红点奖官网原链接","url":"https://www.red-dot.org/project/willow-83120"}],"papers":["AP05","AP08"],"trends":["人—智能体协作与混合主动权","多感官体验与反馈"],"maker":"Jeon Sunga；韩国"},{"id":"AT07","title":"Soundbeam 6｜动作与隔空 const mhCase=id=>mhData().cases.find(p=>p.id===id);
const mhJournal=id=>[...mhMore().domestic_journals,...mhMore().international_journals,...mhData().journals,...mhData().background_journals].find(p=>p.id===id);
const mhCategories=p=>p.categories.map(id=>mhData().categories.find(c=>c.id===id)?.title||id).join(' · ');
const mhLinks=a=>`<div class="mh-links">${a.map(a=>link(a.url,a.label)).join('')}</div>`;
const mhButtons=(ids,kind)=>ids.length?`<div class="mh-links">${ids.map(id=>{const p=kind==='papers'?mhPaper(id):mhCase(id);return `<button type="button" data-mh-open="${esc(id)}">${esc(id+' '+p.title)}</button>`}).join('')}</div>`:'<p class="mh-note">本轮没有核验到直接匹配的设计学论文，暂不配对。</p>';
const mhField=(t,s)=>`<div class="mh-field"><dt>${esc(t)}</dt><dd>${esc(s)}</dd></div>`;
function mhCitation(p){const j=mhJournal(p.journal_id);return `${p.authors.join('，')}. ${p.title}[J]. ${j.title}, ${p.year}${p.volume?', '+p.volume:''}${p.issue?'('+p.issue+')':''}${p.pages?': '+p.pages:'（页码未核）'}.`;}
function mhPaperCard(p){
 const j=mhJournal(p.journal_id),background=p.id.startsWith('MP'),newEntry=!!p.evidence_level;
 return `<article class="mh-card" id="${p.id}"><div class="mh-kicker">${p.id} · ${esc(p.kind)} ${p.priority?'<span class="mh-priority">优先阅读</span>':''}</div><h3>${link(p.links[0].url,p.title)}</h3><p class="mh-cite">${esc(j.title+(j.column?' · '+j.column:'')+' · '+p.year+' · '+(p.volume?p.volume:'')+(p.issue?'('+p.issue+')':'')+' · '+(p.pages||'页码未核'))}</p><div class="mh-tags">${newEntry?'<span>'+esc(p.evidence_level)+'</span>':''}<span>${esc(p.scope)}</span><span>${background?'跨学科背景，不计设计学清单':p.ai_related?'含明确AI讨论／建模':'AI机制未确认／非AI直接证据'}</span><span>${esc(j.index)}</span></div><dl>${p.education_branch?mhField('教育门类',p.education_branch):''}${mhField('对象与设计方法',p.method)}${p.ai_role?mhField('AI具体角色',p.ai_role):''}${mhField('设计切入 · 本次分析',p.design)}${p.trends?.length?mhField('对应原趋势 · 本次分析',p.trends.join('；')):''}</dl>${mhLinks(p.links)}<details><summary>论文要点、适用边界与完整题录</summary><dl>${mhField('摘要要点',p.finding)}${mhField('适用边界',p.limit)}${mhField('读取范围',p.access)}${p.year_note?mhField('发表时间说明',p.year_note):''}${mhField('相关教育任务',mhCategories(p))}</dl><p class="mh-citation">${esc(mhCitation(p))}${p.doi?'<br>DOI: '+esc(p.doi):''}</p>${mhLinks([j.proof,...(j.extra?[j.extra]:[])])}</details></article>`;
}
function mhCaseCard(p){return `<article class="mh-card" id="${p.id}"><div class="mh-kicker">${p.id} · ${esc(p.relation)}</div><h3>${link(p.links[0].url,p.title)}</h3><p class="mh-award">${esc(p.award)}</p><p class="mh-cite">${esc(p.maker)}</p><div class="mh-tags"><span>${esc(p.ai_level)}</span><span>${esc(p.scope)}</span></div><dl>${mhField('官网描述',p.fact)}${mhField('AI具体作用／证据',p.ai)}${mhField('交互流程 · 本次梳理',p.flow)}${mhField('设计切入 · 本次分析',p.design)}</dl>${mhLinks(p.links)}<details><summary>设计论文配对、成熟度和适用边界</summary><p>${esc(p.status)}</p><p class="mh-boundary">${esc(p.limit)}</p><p class="mh-cite">${esc(mhCategories(p))}。以下论文用于设计机制对照，不是对该作品的独立验证；方法参考不视为学生心理健康实证。</p>${mhButtons(p.papers,'papers')}<details><summary>原跨学科背景配对</summary>${mhButtons(p.background_papers,'papers')}</details></details></article>`;}
function mhMap(){return `<p class="mh-note">以下按教育任务分类；普通学生心理健康教育、特殊儿童发展支持与医疗治疗分别界定。分类是本次研究组织方式。</p><div class="mh-grid">${mhData().categories.map(c=>`<article class="mh-card"><div class="mh-kicker">${c.id}</div><h3>${esc(c.title)}</h3><p>${esc(c.goal)}</p><dl>${mhField('交互设计机会',c.design)}${mhField('评价问题',c.test)}</dl><p class="mh-boundary">${esc(c.evidence_boundary)}</p><h4>设计论文／方法参考</h4>${mhButtons(c.papers,'papers')}<h4>对应获奖作品</h4>${mhButtons(c.cases,'cases')}<details><summary>跨学科背景依据</summary>${mhButtons(c.background_papers,'papers')}</details></article>`).join('')}</div>`;}
function mhDirections(){return `<p class="mh-note">以下为论文与案例支持下的选题推论，趋势名称沿用此前12条框架。设计方法迁移需要重新验证目标学段，不能把获奖概念直接当成普及趋势或疗效证据。</p><div class="mh-grid">${mhData().design_directions.map((d,i)=>`<article class="mh-card"><div class="mh-kicker">选题 ${i+1} · 本次推论</div><h3>${esc(d.title)}</h3><dl>${mhField('问题',d.problem)}${mhField('拟研究的交互流程',d.interaction)}${mhField('对应原趋势',d.trends.join('；'))}</dl><p class="mh-boundary">${esc(d.boundary)}</p><h4>设计论文／方法参考</h4>${mhButtons(d.papers,'papers')}<h4>案例对照</h4>${mhButtons(d.cases,'cases')}<details><summary>跨学科背景依据</summary>${mhButtons(d.background_papers,'papers')}</details></article>`).join('')}</div><h3 class="mh-section-title">与你此前调研企业的连接</h3><p class="mh-note">以下为产品机制的研究对照，不代表这些品牌获得本清单中的奖项，也不代表配对论文验证了它们。</p><div class="mh-grid">${mhData().company_bridges.map(c=>`<article class="mh-card"><h3>${esc(c.title)}</h3><dl>${mhField('已有证据',c.fact)}${mhField('怎样使用设计论文',c.research)}${mhField('待核验',c.boundary)}</dl>${mhLinks(c.links)}</article>`).join('')}</div>`;}
function mhSources(){const a=mhData();return `<p class="mh-note">${esc(a.core_note)}</p><div class="mh-grid">${a.journals.map(j=>`<article class="mh-card"><div class="mh-kicker">${j.id} · 设计学主清单</div><h3>${esc(j.title+' · '+j.column)}</h3><p>${esc(j.index)}</p>${mhLinks([j.proof,...(j.extra?[j.extra]:[])])}</article>`).join('')}</div><h3 class="mh-section-title">其他设计期刊线索 · 未计入完整题录</h3><div class="mh-grid">${a.pending_design_leads.map(e=>`<article class="mh-card"><h3>${esc(e.title)}</h3><p>${esc(e.reason)}</p>${mhLinks(e.links)}</article>`).join('')}</div><h3 class="mh-section-title">不列入主清单的近似结果</h3><div class="mh-grid">${a.excluded.map(e=>`<article class="mh-card"><h3>${esc(e.title)}</h3><p>${esc(e.reason)}</p>${mhLinks(e.links)}</article>`).join('')}</div><details><summary>原跨学科背景期刊的核心资格</summary><div class="mh-grid">${a.background_journals.map(j=>`<article class="mh-card"><h3>${esc(j.title)}</h3><p>${esc(j.index)}；仅作背景。</p>${mhLinks([j.proof,...(j.extra?[j.extra]:[])])}</article>`).join('')}</div></details><h3 class="mh-section-title">继续检索</h3>${mhLinks(a.design_search_links)}${a.queries.map(q=>`<div class="mh-query"><b>${esc(q[0])}</b><p>${esc(q[1])}</p></div>`).join('')}`;}

function mhResearchAudit(){const a=mhMore();const cards=(items,field)=>`<div class="mh-grid">${items.map(e=>`<article class="mh-card"><h3>${esc(e.title)}</h3><p>${esc(e[field])}</p>${mhLinks(e.links)}</article>`).join('')}</div>`;return `<p class="mh-note">${esc(a.result_note)} ${esc(a.access_note)}</p><h3 class="mh-section-title">已检索的期刊与范围</h3>${cards(a.search_audit,'detail')}<h3 class="mh-section-title">主题接近的国内线索 · 非核心期刊清单</h3><p class="mh-note">以下只供追踪题目、作者与原文，不计入8篇其他设计核心；学位论文的专业和刊物资格分别注明。</p>${cards(a.leads_not_core,'reason')}<h3 class="mh-section-title">本轮排除的近似题目</h3>${cards(a.excluded_new,'reason')}<h3 class="mh-section-title">新增期刊资格</h3><div class="mh-grid">${[...a.domestic_journals,...a.international_journals].map(j=>`<article class="mh-card"><h3>${esc(j.title)}</h3><p>${esc(j.index)}</p>${mhLinks([j.proof,...(j.extra?[j.extra]:[])])}</article>`).join('')}</div>`;}

function mhSchoolRoutes(){return `<p class="mh-note">以下为本次选题梳理。国内设计核心提供机制与方法，中学校园国际研究补充用户与任务；二者不能拼接成“已有一项研究证明整套校园方案有效”。</p><div class="mh-grid">${mhMore().school_routes.map(r=>`<article class="mh-card"><div class="mh-kicker">普通学生方向 · 本次分析</div><h3>${esc(r.title)}</h3><dl>${mhField('教育门类',r.branch)}${mhField('设计问题',r.question)}${mhField('可研究的交互',r.opportunity)}</dl><p class="mh-boundary">${esc(r.boundary)}</p><h4>国内设计核心：机制／方法</h4>${mhButtons(r.core,'papers')}<h4>普通中小学相关研究：国际补充</h4>${r.school.length?mhButtons(r.school,'papers'):'<p class="mh-note">暂未核验到直接配对的学生研究。</p>'}</article>`).join('')}</div>`;}

let mhArtGroup='student_cases',mhArtBranch='',mhArtAI=false,mhArtAward=false;
const mhArtData=()=>mhData().art_therapy_update;
const mhArtRecord=id=>[...mhArtData().cases,...mhArtData().papers].find(p=>p.id===id);
const mhArtButtons=ids=>`<div class="mh-links">${ids.map(id=>`<button type="button" data-mh-art-open="${esc(id)}">${esc(id+' '+mhArtRecord(id).title)}</button>`).join('')}</div>`;
function mhArtCaseCard(p){return `<article class="mh-card" id="${p.id}"><div class="mh-kicker">${esc(p.id+' · '+p.status)}</div><h3>${link(p.links[0].url,p.title)}</h3><p class="mh-cite">${esc(p.maker)}</p>${p.award?`<p class="mh-award">${esc(p.award)}</p>`:''}<div class="mh-tags"><span>${esc(p.scope)}</span>${p.branches.map(v=>`<span>${esc(v)}</span>`).join('')}</div><dl>${mhField('具体设计',p.fact)}${mhField('交互流程 · 本次梳理',p.flow)}${mhField('AI作用与核验范围',p.ai)}${mhField('可研究的交互问题 · 本次分析',p.design)}</dl><p class="mh-boundary">${esc(p.limit)}</p>${mhLinks(p.links)}<details><summary>对应原趋势与论文依据</summary><p>${esc(p.trends.join('；'))}。趋势对应为本次分析，不代表行业已普遍采用。</p>${p.papers.length?mhArtButtons(p.papers):'<p class="mh-note">本轮未配对直接研究该产品的论文。</p>'}</details></article>`;}
function mhArtPaperCard(p){return `<article class="mh-card" id="${p.id}"><div class="mh-kicker">${esc(p.id+' · '+p.evidence)}</div><h3>${link(p.links[0].url,p.title)}</h3>${p.title_cn?`<p>${esc('中文释义：'+p.title_cn)}</p>`:''}<p class="mh-cite">${esc(p.authors.join('，')+' · '+p.outlet+' · '+p.year+(p.volume?'，'+p.volume:'')+(p.issue?'('+p.issue+')':'')+(p.pages?'：'+p.pages:'；卷期页码未核'))}</p><dl>${mhField('研究对象与机制',p.method)}${mhField('设计使用方式 · 本次分析',p.design)}${mhField('适用边界',p.limit)}${mhField('读取范围',p.access)}</dl>${p.doi?`<p class="mh-cite">DOI: ${esc(p.doi)}</p>`:''}${mhLinks(p.links)}</article>`;}
function mhArtView(){
 const t=mhArtData(),q=search.value.trim().toLowerCase();
 const tabs=[['student_cases','儿童／青年相关 · 5'],['transfer_cases','音乐与手势方法迁移 · 2'],['papers','设计与交互文献 · 8'],['routes','分类与选题 · 3']];
 let body=`<div class="mh-links"><a href="${esc(t.standalone)}" target="_blank" rel="noopener">单独打开艺术疗愈专题 ↗</a><a href="${esc(t.ris_domestic)}" download>2篇国内设计核心 · 方法参考RIS</a><a href="${esc(t.ris_international)}" download>6篇国际艺术／HCI · 单独RIS</a></div><nav class="mh-nav" aria-label="艺术疗愈专题分区">${tabs.map(([id,label])=>`<button type="button" data-mh-art-group="${id}" aria-pressed="${mhArtGroup===id}">${esc(label)}</button>`).join('')}</nav>`;
 let count='';
 if(mhArtGroup==='routes'){
  body+=`<p class="mh-note">以下为由案例与文献提出的设计研究问题。教育门类、建议学段和趋势对应是本次归纳，不是所有原产品已有的功能或效果。</p><div class="mh-grid">${t.routes.map(r=>`<article class="mh-card"><div class="mh-kicker">${esc(r.branch)}</div><h3>${esc(r.title)}</h3><p>${esc(r.proposed_scope)}</p><dl>${mhField('设计问题',r.question)}${mhField('拟研究的交互',r.interaction)}${mhField('可供性与反馈 · 设计建议',r.affordance)}${mhField('对应原12条趋势',r.trends.join('；'))}${mhField('怎样评价',r.evaluate)}</dl><h4>案例</h4>${mhArtButtons(r.cases)}<h4>论文</h4>${mhArtButtons(r.papers)}</article>`).join('')}</div>`;
  count='艺术表达与心理健康 · 3条设计研究路线';
 }else if(mhArtGroup==='papers'){
  const list=t.papers.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
  body+=`<p class="mh-note">${esc(t.literature_note)}</p><div class="mh-grid">${list.map(mhArtPaperCard).join('')||'<p class="mh-note">没有匹配文献，请清空搜索。</p>'}</div>`;
  count=`艺术表达文献 · ${list.length} / 8篇`;
 }else{
  const all=t.cases.filter(p=>p.group===mhArtGroup),list=all.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!mhArtBranch||p.branches.includes(mhArtBranch))&&(!mhArtAI||p.ai_confirmed)&&(!mhArtAward||!!p.award));
  body+=`<p class="mh-note">${mhArtGroup==='student_cases'?'本区5例含儿童研究、青年实际产品与学生相关原型；原对象、年龄和验证阶段分别列出。青年创伤研究不代替普通校园验证。':'本区2例供音乐共创与手势交互借鉴；原产品没有普通中小学生的直接心理健康教育验证。'}</p><div class="mh-filter"><label>艺术形式<select id="mh-art-branch"><option value="">全部形式</option>${t.branches.map(v=>`<option value="${esc(v)}"${mhArtBranch===v?' selected':''}>${esc(v)}</option>`).join('')}</select></label><label class="mh-checkbox"><input id="mh-art-ai" type="checkbox"${mhArtAI?' checked':''}>仅来源明确描述AI机制（含概念）</label><label class="mh-checkbox"><input id="mh-art-award" type="checkbox"${mhArtAward?' checked':''}>仅核到设计奖官网</label><span role="status">${list.length} / ${all.length}项</span></div><div class="mh-grid">${list.map(mhArtCaseCard).join('')||'<p class="mh-note">没有匹配项；可清空搜索或放宽艺术形式、AI及奖项筛选。</p>'}</div>`;
  count=`艺术表达案例 · ${list.length} / ${all.length}项`;
 }
 body+=`<details><summary>检索范围、证据和未收录项</summary>${t.audit.map(e=>`<div class="mh-query"><b>${esc(e.title)}</b><p>${esc(e.detail)}</p></div>`).join('')}${mhLinks(t.sources)}</details>`;
 return{body,count};
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-mh-art-group]');if(b){mhArtGroup=b.dataset.mhArtGroup;mhArtBranch='';mhArtAI=false;mhArtAward=false;mhRefresh();return;}
 const o=e.target.closest('[data-mh-art-open]');if(o){const p=mhArtRecord(o.dataset.mhArtOpen);if(!p)return;mhPart='art_therapy';mhArtGroup=p.id.startsWith('AP')?'papers':p.group;mhArtBranch='';mhArtAI=false;mhArtAward=false;search.value='';mhRefresh();requestAnimationFrame(()=>document.getElementById(p.id)?.scrollIntoView({behavior:'smooth',block:'start'}));}
});
document.addEventListener('change',e=>{if(e.target.id==='mh-art-branch')mhArtBranch=e.target.value;else if(e.target.id==='mh-art-ai')mhArtAI=e.target.checked;else if(e.target.id==='mh-art-award')mhArtAward=e.target.checked;else return;mhRefresh();});

function mhView(){
 const a=mhData(),u=mhMore();const kinds=[['art_therapy','艺术表达与心理健康 · 新专题'],['other_design_core',`其他设计学核心 · ${u.domestic_methods.length}`],['school_routes','普通学生 · 阅读与选题路线'],['ordinary_hci',`普通中小学 · 国际HCI补充 ${u.international_studies.length}`],['search_audit','本轮检索记录与边界'],['papers',`前轮儿童／青少年（含特殊教育）· ${a.papers.length}`],['design_method_papers',`AI与交互方法 · ${a.design_method_papers.length}`],['cases',`获奖设计 · ${a.cases.length}`],['background_papers',`跨学科背景 · ${a.background_papers.length}`],['map','教育任务分类'],['directions','选题与企业对照'],['sources','核心资格与检索依据']];
 const q=search.value.trim().toLowerCase();let body='',count='';
 if(mhPart==='art_therapy'){const artView=mhArtView();body=artView.body;count=artView.count;}
 else if(['other_design_core','ordinary_hci','papers','design_method_papers','background_papers','cases'].includes(mhPart)){
  const isPaper=mhPart!=='cases',isNew=['other_design_core','ordinary_hci'].includes(mhPart),all=mhPart==='other_design_core'?u.domestic_methods:mhPart==='ordinary_hci'?u.international_studies:a[mhPart];
  const list=all.filter(p=>(!mhCategory||p.categories.includes(mhCategory))&&(!mhOnlyAI||(isPaper?(isNew?p.runtime_ai:p.ai_related):p.ai_level==='明确AI'))&&(!mhScope||(isPaper?p.scope:p.relation)===mhScope)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));
  const scopes=[...new Set(all.map(p=>isPaper?p.scope:p.relation))];
  const scopeNote=mhPart==='other_design_core'?'这里汇集8篇其他设计核心文献，不含《包装工程》与孤独症研究。OD07有AI情感语音原型，OD08讨论智能代理设计责任；其余为设计方法参考。均未核到普通中小学生AI心理健康验证，原刊入口、作者摘要和原文转载分别注明。':mhPart==='ordinary_hci'?'3篇直接研究普通中小学相关场景的国际交互论文，单列补充，不计入国内核心。IK01是真实GPT系统；IK02为Dialogflow意图识别与对话树；IK03是人工控制原型。':mhPart==='papers'?'这6篇研究儿童或青少年的情绪、陪伴及特殊教育支持；没有在摘要中核验到明确的产品端AI机制。':mhPart==='design_method_papers'?'以下6篇提供交互与AI设计方法，分别标明原对象。它们不是中小学生AI心理健康效果研究；其中AIGC绘画原对象为3—6岁儿童，单独作为方法迁移参考。':mhPart==='background_papers'?'这是上一轮的10篇心理学、教育学或医学文献，保留作机制与行业背景，不计入设计学论文主清单。':'保留8个已检索的获奖案例。论文配对是设计机制比较，不等于该产品通过论文验证。';
  body=`<p class="mh-note">${esc(scopeNote)}</p><div class="mh-filter"><label>教育任务<select id="mh-category"><option value="">全部任务</option>${a.categories.map(c=>`<option value="${c.id}"${mhCategory===c.id?' selected':''}>${esc(c.title)}</option>`).join('')}</select></label><label>原对象／相关性<select id="mh-scope"><option value="">全部对象</option>${scopes.map(s=>`<option value="${esc(s)}"${mhScope===s?' selected':''}>${esc(s)}</option>`).join('')}</select></label>${mhPart==='papers'?'':`<label class="mh-checkbox"><input type="checkbox" id="mh-only-ai"${mhOnlyAI?' checked':''}>${isNew?'仅已核实际AI运行机制':isPaper?'仅明确讨论AI／使用AI建模':'仅官网明确描述AI的作品'}</label>`}<span role="status">${list.length} / ${all.length} 项</span></div><div class="mh-grid">${list.map(isPaper?mhPaperCard:mhCaseCard).join('')||'<p class="mh-note">没有匹配结果。可清空搜索或放宽对象、任务筛选。</p>'}</div>`;
  count=`显示${list.length}项 · ${kinds.find(k=>k[0]===mhPart)[1]}`;
 }else if(mhPart==='school_routes'){body=mhSchoolRoutes();count='3条普通学生设计路线 · 证据与推论分别标注';}
 else if(mhPart==='search_audit'){body=mhResearchAudit();count='3种国内设计学核心 · 对象与AI机制分别核验';}
 else if(mhPart==='map'){body=mhMap();count='5类教育任务 · 设计与背景证据分别标注';}
 else if(mhPart==='directions'){body=mhDirections();count='4个研究切口 · 4家原调研企业对照';}
 else{body=mhSources();count='设计栏目与核心资格已核 · 未核完整题录另列';}
 content.innerHTML=`<section class="mh-root"><div class="mh-intro"><p class="mh-kicker">设计学专题检索 · ${esc(a.as_of)} · 原刊可追溯</p><h2>${mhPart==='art_therapy'?'艺术表达与学生心理健康':'普通中小学的心理支持交互设计'}</h2><p>${esc(mhPart==='art_therapy'?mhArtData().intro:a.scope)}</p><p class="mh-note">${esc(mhPart==='art_therapy'?mhArtData().boundary:a.evidence_note)}</p><p>${esc(mhPart==='art_therapy'?mhArtData().literature_note:u.reading_note)}</p><div class="mh-links"><a href="AI学生心理健康教育_国内核心与获奖设计_20261101.html" target="_blank" rel="noopener">打开独立专题页 ↗</a><a href="${esc(u.ris_domestic)}" download>8篇其他设计核心 · 分级参考RIS</a><a href="${esc(u.ris_international)}" download>3篇国际HCI补充 · 单独RIS</a><a href="学生心理健康交互设计_12篇设计学核心与方法参考_20261101.ris" download>前轮12篇《包装工程》题录</a></div></div><nav class="mh-nav" aria-label="心理健康设计专题内容">${kinds.map(k=>`<button type="button" data-mh-part="${k[0]}" aria-pressed="${mhPart===k[0]}">${esc(k[1])}</button>`).join('')}</nav>${body}<p class="mh-footer">${esc(a.access_note)}</p></section>`;
 const counter=document.getElementById('count');if(counter)counter.textContent=count;
}
function mhRefresh(){if(typeof render==='function')render();else mhView();}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-mh-part]');if(b){mhPart=b.dataset.mhPart;mhScope='';mhOnlyAI=false;mhRefresh();return;}
 const o=e.target.closest('[data-mh-open]');if(o){const id=o.dataset.mhOpen;mhPart=mhMore().domestic_methods.some(p=>p.id===id)?'other_design_core':mhMore().international_studies.some(p=>p.id===id)?'ordinary_hci':id.startsWith('MP')?'background_papers':mhData().papers.some(p=>p.id===id)?'papers':mhData().design_method_papers.some(p=>p.id===id)?'design_method_papers':'cases';mhCategory='';mhScope='';mhOnlyAI=false;search.value='';mhRefresh();requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}));}
});
document.addEventListener('change',e=>{if(e.target.id==='mh-category')mhCategory=e.target.value;else if(e.target.id==='mh-scope')mhScope=e.target.value;else if(e.target.id==='mh-only-ai')mhOnlyAI=e.target.checked;else return;mhRefresh();});

search.addEventListener('input',mhView);mhView();</script></body></html>
