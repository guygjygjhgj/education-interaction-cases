</style></head><body><header><a href="智能教育交互_原链接导航.html#mental-health">← 返回完整教育交互导航</a><h1>学生心理健康交互设计</h1><p>中小学研究方向 · 设计学核心论文、AI与交互方法、获奖案例 · 截至2026-11-01</p><label for="mh-query">检索标题、作者、交互机制或案例名称</label><br><input id="mh-query" type="search" placeholder="例如：共情、手势、拟人化、情绪表达" autocomplete="off"><div id="count" role="status"></div></header><main id="content"></main><script id="researchData" type="application/json">{"as_of":"2026-10-27","papers":[{"id":"P01","lang":"中文核心","title":"人类导师与智能导师效能差异研究——基于动态交互的可供性视角","authors":["李姗姗","吴筱萌","张鹏","范逸洲"],"year":2025,"journal":"开放教育研究","volume":"31","issue":"2","pages":"98-107","doi":"10.13966/j.cnki.kfjyyj.2025.02.010","url":"https://openedu.sou.edu.cn/upload/qikanfile/202503280953157143.pdf","index":"CSSCI来源期刊／中文核心，见期刊官网介绍","access":"期刊官网公开全文","type":"交互日志研究，54名学习者，英语写作修改任务","finding":"人类导师与智能导师形成了不同的求助和反馈循环。论文建议增强智能导师的社交与教学法可供性。","design":"把“指出问题”“给一条提示”“检查我的修改”变为可理解、可选择的行动；检查学生是否陷入反复索取成品的循环。","limit":"任务为在线英语写作，不能直接推论到所有学段与学科。","priority":"优先精读","topic":"可供性／智能导师","index_url":"https://openedu.sou.edu.cn/frontsite/baseintro.aspx","doi_url":"https://doi.org/10.13966/j.cnki.kfjyyj.2025.02.010"},{"id":"P02","lang":"中文核心","title":"基于GAI的对话驱动人机协同知识建构模式构建与实践研究","authors":["乐颖","刘永贵","张义兵","高兴启"],"year":2025,"journal":"中国电化教育","issue":"6","pages":"28-36","url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/paper/773655182944d5dcabc4f83916e58727","index":"CSSCI来源期刊／中文核心，见期刊官网介绍","access":"期刊出版平台题录与摘要；全文需数据库权限","type":"系统构建与教学干预，34名学生，约一个半月","finding":"构建GAI·C智能对话学习系统，并从互动、认知活动、认知发展与学习成果等维度考察知识建构。","design":"把每轮对话关联到学生的问题、论据和修改记录；观察AI是否让学生解释理由。","limit":"样本与情境有限；摘要中的积极结果不能当作产品普适有效的证明。","priority":"优先精读","topic":"对话／协同知识建构","index_url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/news/ZDJY_db922688-adf9-430b-94cd-def1f4845b4d","doi_url":""},{"id":"P03","lang":"中文核心","title":"人机协同学习的新理解：人与AI共同调节学习","authors":["郝祥军","顾小清"],"year":2025,"journal":"中国电化教育","issue":"6","pages":"9-17,79","url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/paper/dcfcc3dc33b1f0e474a2e9391a0bd960","index":"CSSCI来源期刊／中文核心，见期刊官网介绍","access":"期刊出版平台题录与摘要","type":"理论框架","finding":"从认知、行为和情感调节解释人与AI共同调节学习的机制。","design":"研究目标设定、进度回看、提示时机与反思入口；让学生可拒绝、修改AI建议。","limit":"提供概念结构，不能直接提供界面方案的因果效果证据。","priority":"优先精读","topic":"自我调节／人机协同","index_url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/news/ZDJY_db922688-adf9-430b-94cd-def1f4845b4d","doi_url":""},{"id":"P04","lang":"中文核心","title":"基于认知负荷水平的学情分析：表征框架与实践路径","authors":["武法提","任伟祎"],"year":2024,"journal":"中国电化教育","issue":"7","pages":"64-73","url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/paper/4e5ef531a5176dd4d59c5e1933536503","index":"CSSCI来源期刊／中文核心，见期刊官网介绍","access":"期刊出版平台题录与摘要","type":"框架与模型研究，300名学生，在线测试与手环生理数据","finding":"将数据采集、负荷识别与分析干预连接起来，并用仪表盘呈现学情及干预建议。","design":"观察教师看到推断后是否知道该做什么；呈现数据依据、采集条件和人工修正入口。","limit":"生理信号和认知负荷之间需要模型与情境解释，不能把一个分数直接当成学生真实心理状态。","priority":"多模态方向精读","topic":"多模态／认知负荷","index_url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/news/ZDJY_db922688-adf9-430b-94cd-def1f4845b4d","doi_url":""},{"id":"P05","lang":"中文核心","title":"多模态学习分析：“多模态”驱动的智能教育研究新趋向","authors":["王一岩","王杨春晓","郑永和"],"year":2021,"journal":"中国电化教育","issue":"3","pages":"88-96","url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/paper/343aa3aab7d0a21b7c4cc2d86fb5de8a","index":"CSSCI来源期刊／中文核心，见期刊官网介绍","access":"期刊出版平台题录与摘要","type":"综述与研究议程","finding":"从感知、表征和计算方法梳理多模态学习分析，强调时序、情境与真实教育场景。","design":"先确定要支持的教学判断，再选择必要数据；观察多种信号是否真的互补。","limit":"研究议程与技术可能性不能直接等同于已验证的教学增益。","priority":"建立术语框架","topic":"多模态学习分析","index_url":"https://zdjy.cbpt.cnki.net/portal/journal/portal/client/news/ZDJY_db922688-adf9-430b-94cd-def1f4845b4d","doi_url":""},{"id":"P06","lang":"中文核心","title":"交互主体性视角下的人机协同教学模式：理论框架与实践形态","authors":["马志强","崔鑫"],"year":2026,"journal":"电化教育研究","volume":"47","issue":"3","pages":"14-21","doi":"10.13811/j.cnki.eer.2026.03.002","url":"https://aver.nwnu.edu.cn/upload/formalarticle/202603/2026031632-%20%E4%BA%A4%E4%BA%92%E4%B8%BB%E4%BD%93%E6%80%A7%E8%A7%86%E8%A7%92%E4%B8%8B%E7%9A%84%E4%BA%BA%E6%9C%BA%E5%8D%8F%E5%90%8C%E6%95%99%E5%AD%A6%E6%A8%A1%E5%BC%8F%EF%BC%9A%20%E7%90%86%E8%AE%BA%E6%A1%86%E6%9E%B6%E4%B8%8E%E5%AE%9E%E8%B7%B5%E5%BD%A2%E6%80%81.pdf","index":"CSSCI来源期刊／教育类核心，见期刊官网标识","access":"原刊公开PDF，DOI与首页已核对","type":"理论研究，师生机关系框架","finding":"围绕师、生、机的对话、协商与共同目标，提出不同的人机协同教学形态。","design":"把角色与权限作为交互问题：谁提出目标、谁决定何时提示、谁解释与纠错。","limit":"“交互主体性”是理论分析视角，不表示AI具有人类意识或应替代教师。","priority":"2026年理论更新","topic":"师生机协同","index_url":"https://aver.nwnu.edu.cn/Index/ArticleChannelList.do?id=111830","doi_url":"https://doi.org/10.13811/j.cnki.eer.2026.03.002"},{"id":"P07","lang":"中文核心","title":"人机协同教学的困境及其归因——以机器人教师“华君”为例","authors":["孔苏","朱丹瑶"],"year":2024,"journal":"电化教育研究","volume":"45","issue":"8","pages":"58-63,70","doi":"10.13811/j.cnki.eer.2024.08.008","url":"https://aver.nwnu.edu.cn/upload/formalarticle/202408/2024080242-%E4%BA%BA%E6%9C%BA%E5%8D%8F%E5%90%8C%E6%95%99%E5%AD%A6%E7%9A%84%E5%9B%B0%E5%A2%83%E5%8F%8A%E5%85%B6%E5%BD%92%E5%9B%A0%20%E2%80%94%E2%80%94%E4%BB%A5%E6%9C%BA%E5%99%A8%E4%BA%BA%E6%95%99%E5%B8%88%E2%80%9C%E5%8D%8E%E5%90%9B%E2%80%9D%E4%B8%BA%E4%BE%8B.pdf","index":"CSSCI来源期刊／教育类核心，见期刊官网标识","access":"原刊公开PDF，DOI与首页已核对","type":"机器人教师个案与理论分析","finding":"讨论机器人进入教学后暴露的角色合法性、被动性与先验性问题。","design":"现场故意追问、打断、给出非预设表达，观察机器人如何澄清意图并转交教师。","limit":"单一个案不能代表全部机器人；论文的概念判断需与真实运行记录结合。","priority":"机器人方向必读","topic":"机器人／交互局限","index_url":"https://aver.nwnu.edu.cn/Index/ArticleChannelList.do?id=111830","doi_url":"https://doi.org/10.13811/j.cnki.eer.2024.08.008"},{"id":"P08","lang":"中文核心","title":"应用类人型机器人提升幼儿同伴交往的问题解决能力：基于教育实验的研究","authors":["刘友棚","洪秀敏"],"year":2025,"journal":"电化教育研究","volume":"46","issue":"2","pages":"57-63,94","url":"https://www.cnaes.edu.cn/post/30989","index":"CSSCI来源期刊／教育类核心，见期刊官网标识","access":"中国教育科学研究院作者成果介绍与内容转载","type":"70名4–5岁幼儿，三组教育干预实验","finding":"对整体同伴问题解决及部分分项有促进；未提升行为结果预测。","design":"研究角色扮演、共同注意、轮流说话与真人同伴迁移；优先考察儿童之间的互动是否改善。","limit":"机器人辅助的结构化干预不能直接等同于开放式陪伴机器人的长期效果。","priority":"学前与社会情感方向","doi":"10.13811/j.cnki.eer.2025.02.008","topic":"机器人／幼儿社会交往","index_url":"https://aver.nwnu.edu.cn/Index/ArticleChannelList.do?id=111830","doi_url":"https://doi.org/10.13811/j.cnki.eer.2025.02.008"},{"id":"P09","lang":"国际期刊","title":"Generative AI without guardrails can harm learning: Evidence from high school mathematics","authors":["Bastani, Hamsa","Bastani, Osbert","Sungu, Alp","Ge, Haosen","Kabakcı, Özge","Mariman, Rei"],"year":2025,"journal":"Proceedings of the National Academy of Sciences","volume":"122","issue":"26","pages":"e2422633122","doi":"10.1073/pnas.2422633122","url":"https://pubmed.ncbi.nlm.nih.gov/40560616/","index":"SCIE期刊；不使用国内“中文核心”称号","access":"PubMed完整摘要；期刊全文入口","type":"高中数学现场实验，近千名学生，比较两种AI辅导设计","finding":"有AI时完成题目的表现改善，撤去AI后的独立表现可能下降；教学保护性提示可缓解负面影响。","design":"把“撤去AI后的独立解题”作为指标；比较直接回答与分级提示。","limit":"结论受数学任务与系统设计约束。2025年另有作者单位勘误，非研究结果勘误。","priority":"优先精读","extra_urls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC12232635/"],"topic":"AI学习效果／分级提示","index_url":"https://pubmed.ncbi.nlm.nih.gov/40560616/","doi_url":"https://doi.org/10.1073/pnas.2422633122"},{"id":"P10","lang":"国际期刊","title":"AI tutoring outperforms in-class active learning: an RCT introducing a novel research-based design in an authentic educational setting","authors":["Kestin, Greg","Miller, Kelly","Klales, Anna","Milbourne, Timothy","Ponti, Gregorio"],"year":2025,"journal":"Scientific Reports","volume":"15","pages":"17458","doi":"10.1038/s41598-025-97652-6","url":"https://www.nature.com/articles/s41598-025-97652-6","index":"SCIE期刊","access":"出版社与PubMed公开题录、摘要，全文为开放获取","type":"本科科学教育随机对照研究","finding":"基于教学原则专门设计的AI导师在该研究条件下取得较好的学习表现。","design":"拆解教学步骤、反馈时机、提示内容与学习者节奏；与P09成对阅读。","limit":"不能据标题宣称AI普遍优于教师；研究并不覆盖所有年龄、复杂综合任务或长期迁移。","priority":"与P09成对精读","extra_urls":["https://pubmed.ncbi.nlm.nih.gov/40537565/"],"topic":"AI导师／教学设计","index_url":"https://www.nature.com/articles/s41598-025-97652-6","doi_url":"https://doi.org/10.1038/s41598-025-97652-6"},{"id" "额外运动或活动复杂性可能占用内容学习所需资源。","design":"比较动作与概念一致、仅装饰性动作和普通交互。","limit":"需要具体任务验证；不能以“好玩”替代学习测量。","priority":"具身方向边界必读","topic":"具身学习／认知负荷","index_url":"https://link.springer.com/article/10.1007/s10648-024-09869-y","doi_url":"https://doi.org/10.1007/s10648-024-09869-y"},{"id":"P25","lang":"国际期刊","title":"Embodiment in Mathematics Teaching and Learning: Evidence From Learners' and Teachers' Gestures","authors":["Alibali, Martha W.","Nathan, Mitchell J."],"year":2012,"journal":"Journal of the Learning Sciences","volume":"21","issue":"2","pages":"247-286","doi":"10.1080/10508406.2011.611446","url":"https://www.tandfonline.com/doi/abs/10.1080/10508406.2011.611446","extra_urls":["https://alibali.psych.wisc.edu/wp-content/uploads/sites/371/2018/02/AlibaliNathan2012.pdf"],"index":"SSCI","access":"出版社摘要＋作者大学公开PDF","type":"具身数学理论与师生手势证据","finding":"讨论指向、表征和隐喻手势如何关联数学认知。","design":"把手势指向与同一对象／图形／概念关联，观察共同注意。","limit":"教学手势研究不能直接证明隔空指令控制提高学习效果。","priority":"手势的教育意义","topic":"手势／具身数学","index_url":"https://www.tandfonline.com/doi/abs/10.1080/10508406.2011.611446","doi_url":"https://doi.org/10.1080/10508406.2011.611446"}],"reports":[{"id":"R01","title":"iF Design Trend Report 2026","org":"iF International Forum Design × The Future:Project","year":2026,"url":"https://ifdesign.com/en/trend-report","kind":"设计趋势研究","access":"已核验官网公开概要；完整报告为付费内容，未获取全文","point":"公开概要提出四组趋势与反趋势，其中Convenience Culture与Skillization直接关联便利和能力培养。","implication":"研究哪些步骤可由AI省力，哪些思考、练习与判断应保留给学生。","limit":"设计趋势判断不是教育效果的因果证据。"},{"id":"R02","title":"OECD Digital Education Outlook 2026 Exploring Effective Uses of Generative AI in Education","org":"OECD","year":2026,"url":"https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html","kind":"教育技术证据综合","access":"官网摘要、公开执行摘要及全文下载入口","point":"区分有工具时的任务表现与真正学习，强调教学原则、学生能动性及专门设计的辅导系统。","implication":"把独立迁移、反思和教学机制纳入评估；不只统计完成速度。","limit":"不同章节证据强度不同，不能当作任意AI装备的背书。","extra_urls":["https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/01/oecd-digital-education-outlook-2026_940e0dd8/062a7394-en.pdf"]},{"id":"R03","title":"2026 EDUCAUSE Horizon Report Teaching and Learning Edition","org":"EDUCAUSE","year":2026,"url":"https://library.educause.edu/resources/2026/5/2026-educause-horizon-report-teaching-and-learning-edition","kind":"高等教育专家前瞻","access":"2026年5月18日发布；官网概要与全文入口","point":"采用STEEP框架，关注AI、预算、入学压力、可持续性，以及过程性和真实情境的学习评价。","implication":"保留设计过程、操作依据与学生解释，让教师能看见学习如何发生。","limit":"高等教育背景，不能直接当作中国基础教育需求调查。"},{"id":"R04","title":"AI competency framework for students","org":"UNESCO","year":2024,"url":"https://www.unesco.org/en/articles/ai-competency-framework-students","kind":"学生AI能力框架","access":"官网公开说明与报告入口","point":"从以人为本、AI伦理、技术应用、系统设计等维度组织学生能力。","implication":"把数据采集、模型判断与纠错做成学生可以参与的学习活动。","limit":"能力框架指导课程目标，不证明具体设备能实现目标。"},{"id":"R05","title":"AI competency framework for teachers","org":"UNESCO","year":2024,"url":"https://www.unesco.org/en/articles/ai-competency-framework-teachers","kind":"教师AI能力框架","access":"官网公开说明与报告入口","point":"为教师理解和应用AI、教学整合与专业发展提供能力结构。","implication":"教师应能选择、理解、监督和修改AI建议；培训与日常支持也是产品体验。","limit":"需要结合本地教师工作流程和课程要求。"},{"id":"R06","title":"Guidance on AI and children Version 3","org":"UNICEF Innocenti","year":2025,"url":"https://www.unicef.org/innocenti/reports/policy-guidance-ai-children","kind":"儿童AI设计与治理指导","access":"2025年12月第三版；官网全文、检查表与海报入口","point":"因生成式AI发展更新儿童相关指导，强调儿童权利、参与和证据缺口。","implication":"设计适龄解释、可退出采集、照护者支持，以及不同能力儿童的使用方式。","limit":"这是设计与治理指导，不替代教学效果研究。"},{"id":"R07","title":"中国智慧教育白皮书","org":"教育部","year":2025,"url":"https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/2025/2025_zt06/cgfb/202505/t20250507_1189603.html","kind":"国家教育数字化发展文件","access":"教育部官网发布消息与内容概要","point":"总结智慧教育发展，提出集成化、智能化、国际化的战略方向。","implication":"观察设备与账号、资源、课堂任务和学情数据能否连接，教师是否需要重复录入。","limit":"战略方向不能直接推算设备销量或采购规模。"},{"id":"R08","title":"Global Education Monitoring Report 2023 Technology in education A tool on whose terms","org":"UNESCO Global Education Monitoring Report","year":2023,"url":"https://www.unesco.org/gem-report/en/publication/technology","kind":"全球教育技术证据与政策报告","access":"官网概要与报告入口","point":"以教育需求、教师准备、治理与公平性审视技术进入教育。","implication":"把设备采购后的实际使用、师训、维护与弱网情境纳入调研。","limit":"2023年报告适合作为证据判断基线，不当作2026年市场预测。"},{"id":"R09","title":"The Future of Jobs Report 2025","org":"World Economic Forum","year":2025,"url":"https://www.weforum.org/publications/the-future-of-jobs-report-2025/in-full/3-skills-outlook/","kind":"雇主调查与技能需求前瞻","access":"官网公开技能展望章节","point":"分析性思维、创造性思维、韧性及AI与大数据等能力受到雇主重视。","implication":"用于解释项目学习、协作和AI素养选题的外部背景。","limit":"雇主调查不是儿童学习需求证据，也不是学校装备采购预测。"},{"id":"R10","title":"2025年全国教育事业发展统计公报","org":"教育部","year":2026,"url":"https://www.moe.gov.cn/jyb_sjzl/sjzl_fztjgb/202607/t20260706_1442870.html","kind":"2025年度教育统计，2026年7月6日发布","access":"教育部官网公开统计","point":"在园幼儿3225.52万人，义务教育在校生15687.63万人；显示教育服务对象规模与学段差异。","implication":"按学段、公共教育与家庭场景分别判断需求，不将教育行业视为单一增长市场。","limit":"这些是人数和机构统计，不能直接换算市场收入。与2024年比较须保持口径一致。"},{"id":"R11","title":"Accenture Life Trends 2025","org":"Accenture Song","year":2025,"kind":"体验与生活方式趋势","url":"https://www.accenture.com/en/insights/song/accenture-life-trends","extra_urls":["https://www.accenture.com/content/dam/accenture/final/accenture-com/document-3/Accenture-LifeTrends2025-Report.pdf"],"access":"官方公开全文PDF；2024发布的2025趋势版","point":"亲子数字生活、信任、现实世界活动与人际连接。","implication":"为低屏幕依赖、实体探索和同伴协作提供体验趋势背景。","limit":"消费者趋势调查；不是儿童教学效果实验。"},{"id":"R12","title":"TechnoVision 2026","org":"Capgemini","year":2026,"kind":"智能产品与技术融合趋势","url":"https://www.capgemini.com/us-en/insights/research-library/technovision-2026/","access":"官方概要与报告下载入口","point":"Physical Matters、模块适应性、人机协作与AI实际价值。","implication":"研究感知、硬件、智能体和人工控制如何共同完成学习任务。","limit":"跨行业技术前瞻；教育应用方向属于本资料的综合推论。"},{"id":"R13","title":"2026 Creative Trends Forecast","org":"Adobe","year":2026,"kind":"视觉与体验表达趋势","url":"https://business.adobe.com/uk/resources/creative-trends-report.html","extra_urls":["https://business.adobe.com/assets/pdfs/resources/creative-trends-report/creative-trends-report-20 接口开放性待核验。"}],"expo":{"title":"第88届中国教育装备展示会","dates":"2026年10月30日-11月1日","setup":"10月27-29日为布展及报到，非正式公众展示日；11月1日14:00后撤展。","place":"长沙国际会展中心，长沙市长沙县黄兴镇国展路118号","theme":"人工智能引领教育装备高质量发展","url":"https://www.ceeia.cn/news/detail_4189.htm","notice_url":"https://www.ceeia.cn/news/detail_4135.htm","map_url":"https://www.ceiea.com/userfiles/file/88syt.pdf","map_notice":"https://www.cs-china.net/zhanhuiguanzhu/3509.html","registration":"按主办方通知，通过“教育装备网”或“教装展”公众号进行观众实名登记与会议报名；观展参会不收费。","sessions":[["10月30日14:00-17:00","新产品、新技术、新成果推介会","北登录厅","用来确认新品属于样机、试点还是交付产品。"],["10月30日14:00-16:30","科创育人 AI赋能中小学科技创新人才贯通培养研讨会","北登录厅三层3007","适合比较AI教育、科学探究和课程需求。"],["10月31日9:30-11:30","科学教育“做中学”领航行动实践创新专题交流活动","北登录厅三层3007","与实验、实物交互和学习支架关系最密切。"],["10月31日9:30-12:00","AI+教育智变论坛暨AI+教育洞察报告发布会","北登录厅三层3009","与上一活动时间重叠，按重点选择；报告截至10月27日尚属待发布资料。"],["10月30日13:00-17:00；31日9:00-11:30","职业教育产教融合数字化发展大会","长沙国际会议中心一层多功能1厅","适合职教与具身实训方向。"]],"limitations":"主办方指向的完整展位PDF本轮抓取超时；不提供未经交叉核验的全量参展名单。企业参展、产品上市、奖项与学习有效性分别判断。"},"directions":[{"id":"T01","name":"科学实验中的多模态学习支架","user":"中小学学生在小组实验卡住、不会判断下一步时","question":"怎样用器材状态、动作与口头解释判断需要何种提示，同时保留学生的探究？","mechanism":"实物操作＋视觉识别＋分级语音／图示反馈，教师可接管。","theory":"P01／P13／P18／P21／P23","compare":"固定步骤教程、只给答案的AI、教师直接口头提示","measure":"关键操作错误、独立迁移解释、提示次数、恢复路径与教师干预负担","fit":"原型成本中等；适合缩小到一项简单实验；优先用于现场比较","risk":"容易做成操作监考；必须区分步骤规范与真正理解。","targets":"E02、E05、E06、E08及现场科学教育展商"},{"id":"T02","name":"学生自主学习中的分级求助","user":"中小学生独立练习时反复索要答案或不会表达困难","question":"怎样帮助学生说明卡点、选择提示，并在撤去AI后完成新题？","mechanism":"对话＋草稿／图像输入＋分级提示＋反思回看。","theory":"P01／P03／P09／P10／P19","compare":"通用聊天框、拍题直接给答案、纸面提示卡","measure":"无AI后测、解释质量、主动求助类型、过度提示与放弃率","fit":"原型成本较低；容易比较不同反馈机制；与T01互为补充","risk":"更长的对话可能只是更高操作负担，需验证学习增益。","targets":"E01、E02与现场学习终端、AI助学产品"},{"id":"T03","name":"教师可解释的课堂协同","user":"教师在课堂中同时面对学生差异和AI分析报告","question":"怎样让教师迅速理解证据、确认不确定性并选择干预？","mechanism":"证据片段＋可编辑建议＋学生／教师双向反馈＋撤销。","theory":"P06／P20／R05／R07","compare":"只给总分的仪表盘、自动预警、现有手工观察","measure":"判断时间、误判纠正、有效干预比例、跨工具切换与信任校准","fit":"原型成本较低至中等；需要稳定访问教师用户","ris :["小学","初中"],"focus_tags":["AI","多模态"],"quality_education":true}},"analysis_framework":{"title":"从手势交互课到AI教育选题：分析路径","as_of":"2026-10-28","thesis":"AI如何让原本看不见、难表达、反馈滞后的学习过程，变得可以感知、讨论和调整？","scope":"研究对象是具体学习活动中的人、行动、环境与分工。产品、空间、服务、课程流程和协作规则，都可能成为设计结果。","route":[["01","活动与矛盾","谁在什么时刻遇到困难？今天怎样解决？","观察“学生做实验但不知道错在哪”等具体片段，记录当前替代办法。"],["02","可改变的能力","AI新增了什么可感知、可推断、可生成的能力？","把技术拆成感知、理解、推断、生成、行动与适应，确认实际输入输出。"],["03","行动与表达","人能怎样表达意图、操作对象、参与学习？","比较说、指、写、摆、看、做，寻找与学习内容有关的动作。"],["04","交互闭环","系统怎样回应？人怎样知道、纠正和退出？","画出意图—动作—识别—解释—反馈—修正；把失败路径也画出来。"],["05","能动性与分工","谁设目标、选择方法、下结论、控制节奏？","分别列学生、教师、同伴、AI的权力与责任，而非只列系统功能。"],["06","跨场景与包容性","换一个年级、身体条件、噪声或小组人数，还成立吗？","用情境变化寻找新问题，也识别现有方案的边界。"],["07","价值与反证","什么证据说明改善了学习？什么结果会推翻判断？","区分操作顺畅、学习任务完成、独立理解与迁移，不以获奖代替有效性。"],["08","研究机会与验证","哪个关系值得研究？最小证据怎样获得？","先形成可被推翻的问题和验证任务，再决定是否需要产品原型。"]],"assignment":[["作业（1）行业变革10+","比较任务、角色、空间和流程的变化，再讨论可能的新物种。","使用12条跨行业线索；把当前证据、正在验证和未来假设分开。"],["作业（2）设计与交互变革","解释输入、对象、反馈、主动权和时间关系发生了什么变化。","用五种手势角色与多模态任务组合，避免只说“增加语音／摄像头”。"],["作业（3）典型案例3—5","每个案例研究一个主要矛盾，再用共同维度横向比较。","本页给出5个案例的事实、分析、反证与迁移问题。"],["作业（4）用户研究＋设计机遇","提出待验证的机会，方案保持开放。","用现场观察和短任务缩小范围；最终形态可以是提示规则或课堂流程。"]],"capabilities":[["感知","从画面、声音、书写、姿态或物体状态获得信息。","观察到低头，不直接等于不专注；先问系统实际测到了什么。"],["理解与关联","把“这个”、指向、当前对象与任务上下文对应起来。","语音和手势矛盾时怎样澄清，而不是猜完就执行。"],["推断与预测","提出可能的错误原因、下一步或难度判断。","把推断与事实分开呈现，允许学生、教师纠正。"],["生成与模拟","产生解释、问题、反馈或可变化的模拟情境。","生成的解释是否留下学生预测、比较与质疑的空间。"],["决策与行动","推荐、调度、控制实体动作或推进教学流程。","哪些动作可自动执行，哪些要确认、撤销或由教师决定。"],["记忆与适应","在会话、任务或长期使用中调整反馈。","区分记住偏好、调整规则与重新训练模型；它们不是同一件事。"]],"industries":[["教育","从给出统一内容，转向识别过程、协商支架。","学习伙伴、实验协作者、班级学习协调角色。","让AI帮助发现困难，还是直接代替思考？"],["医疗","从单次问诊，转向连续信息与专业判断协作。","居家随访与诊疗之间的连续支持。","把零散观察组织为证据，而不是用一次表现贴标签。"],["康复与体育","从重复动作，转向动作感知与分阶段反馈。","可调整挑战与反馈时机的练习环境。","动作做得像，是否理解、是否能独立迁移？"],["农业","从统一作业，转向识别局部状态再干预。","以环境变化触发的精细照料。","把校园种植当作观察、判断与行动的长期学习过程。"],["制造与维修","从固定程序，转向人机协作处理异常。","可指导、示范、被纠正的作业伙伴。","让错误原因可追踪，保留操作者接管与解释的机会。"],["交通与物流","从人工持续控制，转向自动执行与责任交接。","需要明确交接条件的协作服务。","课堂里什么时候由学生、教师或AI接管节奏？"],["商业与零售","从标准展示，转向情境理解与共同选择。","体验式探索与个性化建议。","个性化是在帮助选择，还是让人失去探索其他路径的机会？"],["建筑与公共空间","从固定设施，转向空间感知与环境调整。","可回应活动变化的共享环境。","分析整间教室的观看、发言与协作关系，不只看一块屏幕。"],["文化与博物馆","从统一讲解，转向对象、地点与个人问题的关联。","能够提问、比较、追溯来源的探究旅程。","把文物、校园或地方史变成能寻找证据的场景。"],["音乐与创作","从工具操作，转向动作表达与共同创作。","理解演奏过程的教练或可协商的创作伙伴。","反馈是帮助形成个人表达，还是逼近单一标准？"],["家庭与照护","从提醒与监控，转向能力支持和协商。","随能力变化调整支持的日常关系。","儿童是否能逐渐减少帮助，承担自己的行动与决定？"],["无障碍沟通","从单一通道，转向不同能力之间的表达转译。","把音频、文字、动作和触觉关联的参与环境。","信息能接收到之后，是否仍能及时表达、加入讨论？"]],"industry_note":"上表是跨行业比较与未来探索的研究线索，不是12项产品已成熟普及的结论。“新物种”在此作为操作性概念，也包括新的角色、服务关系和流程。","gesture_roles":[["控制入口","动作指向操作命令。","挥手翻页、捏合选取。","能否发现入口、避免误触发、知道命令是否完成？"],["知识表达","动作本身表达正在学习的关系。","用双手间距表达比例，用旋转表达空间变换。","动作与概念有何对应？换成按键后，学习任务是否仍相同？"],["过程证据","动作帮助描述操作过程。","观察演奏指法、实验顺序或装配尝试。","采集的是动作，还是足以解释知识理解的证据？"],["共同协作","动作协调同伴的注意、对象和轮次。","指向同一现象、共同排列变量、把对象交给下一人。","系统识别了谁？如何避免一人的动作覆盖全组的意图？"],["反馈通道","用可感知变化回应人的行动。","视觉轨迹、声音、阻力或触觉提示。","使用者能否把反馈和自己的动作关联，失败后怎样恢复？"]],"multimodal":[["指向＋语言","学生指着一个结构问“这里为什么这样？”","系统要确定“这里”所指对象，而不只是把语音转文字。"],["实物操作＋视觉／传感","学生改变电路或实验变量。","系统把物体状态与任务历史关联；检验是否解释原因而非只报对错。"],["书写＋口头解释","同一答案伴随不同推理过程。","保留学生表达步骤的机会，不用最终答案推定所有人的困难相同。"],["身体动作＋声音反馈","学习者在动作中体会节奏、距离或关系。","比较反馈是否帮助形成理解，还是只带来短暂的新鲜感。"],["多说话人＋共享对象","课堂或小组围绕同一对象讨论。","明确发言者、对象归属和轮次，检验转写延迟是否影响参与。"]],"dimensions":[["人机能动性","谁设目标、选方法、下结论？","学生能否拒绝建议、换方法、纠正或关闭AI？"],["动态学习与修正","随着使用，什么真的发生了改变？","区分即时反馈、情境适配、偏好记忆、用户参与训练；查看变化与重置入口。"],["情境自适应","环境变了，交互怎样调整？","噪声、遮挡、双手操作、多人同时说话、不同身体条件下是否有替代通道？"],["主动交互","AI为什么在这个时刻介入？","学生正在尝试、遇到困惑、主动求助三种时刻，提示是否应不同？"],["可解释性","建议依据什么证据？","看见了什么、推断了什么、还有什么不确定，能否分开说明？"],["信任与控制","人能否形成合适的依赖？","故意给出一个错误输入或建议，检查使用者能否发现、纠正和恢复。"],["情感与关系","反馈怎样影响继续尝试的意愿？","鼓励是否具体？错误反馈公开还是私密？不要把表情识别直接当作情绪事实。"],["社会协作","AI怎样影响人与人的关系？","谁被看见、谁等待、谁控制共享对象？是否支持同伴解释而非只与AI单聊？"],["可供性与示标","人怎样知道系统允许自己做什么？","能力入口、可操作范围、识别状态、反馈和撤销路径是否可感知？"]],"cases":[{"id":"A01","ref":"M09","title":"ROLI Airwave：把学习动作变成可讨论的过程","fact":"品牌原文说明，以手部追踪结合自然语音，提供与演奏过程有关的反馈。iF获奖的是Airwave硬件；后续AI Music Coach服务的具体功能与阶段另看品牌说明。","change":"反馈对象从“按对哪个音”扩展到“怎样完成动作”。","mechanism":"手部视觉数据＋演奏输入＋语音意图→过程分析→视听反馈→继续练习。","tension":"需要及时纠正，同时保留完整演奏、尝试与个人表达的空间。","question":"持续提示、段落后总结、学生主动求助，哪种更适合不同练习阶段？","countertest":"去掉提示后是否还能完成新乐句？如果只能跟随灯光，不能据此说形成了独立能力。","transfer":"科学实验、体育动作、书法过程都可研究“过程可见性”，但不能直接套用音乐评价规则。","sources":["https://ifdesign.com/en/winner-ranking/project/roli-airwave/752394","https://roli.com/us/campaign/ai-music-coach","https://roli.com/blog/introducing-ai-music-coach"]},{"id":"A02","ref":"M32","title":"Nous AI Set：学生从使用AI变成训练与质疑AI","fact":"品牌面向中小学的课程明确支持采集数据、训练与部署模型，并提供图形编程与Python。","change":"学生不只是接受识别结果，还可改变训练数据并检验结果。","mechanism":"提出目标→采样与标注→训练→现实条件测试→分析失败→补充数据。","tension":"快速跑通示例与理解模型边界之间存在取舍。","question":"怎样让学生看见“改变数据—改变结果”的关系，而非只会点击训练按钮？","countertest":"换光线、换角度或加入相似对象，要求学生先预测表现，再解释失败。","transfer":"可以研究AI素养与人机共同修正；不必再设计一个外形不同的机器人。","sources":["https://ifdesign.com/en/winner-ranking/project/nous-ai-set/622486","https://matatalab.com/en/node/960"]},{"id":"A03","ref":"M38","title":"Plinx：AI应该在探索的哪个时刻给帮助","fact":"iF学生概念结合耐用元件、虚拟模拟与实时AI指导，评审明确提到课堂练习。具体算法与学习效果尚未充分披露。","change":"指导可能从查说明书变成与眼前操作相关的即时帮助。","mechanism":"识别当前电路／操作→关联任务→给出分级提示→学习者修改→再验证。","tension":"减少无效挫折，同时避免把有价值的试错过程提前终止。","question":"提示应该指出结果、局部原因、下一步检查方向，还是直接给完整接法？","countertest":"比较“立即答案”和“逐级提示”，随后让学习者独立排查一个新故障。","transfer":"可迁移到物理实验、编程调试、数学推理；重点是支架的时机与深度。","sources":["https://ifdesign.com/en/winner-ranking/project/plinx/782462"]},{"id":"A04","ref":"M41","title":"Hera：从接收到信息，推进到能够参与讨论","fact":"iF学生概念面向听损学生的课堂和小组活动，组合可切换模式的麦克风、助听设备连接与AI实时转写。","change":"设计对象从单个学生的听觉补偿，扩展到课堂轮次与共同注意。","mechanism":"课堂声音→音频支持／转写→同步理解与回看→加入讨论。","tension":"看字幕、看老师、看实物之间如何分配注意；能读懂不自动等于来得及发言。","question":"多人交谈时，发言者、转写延迟与轮次提示怎样影响参与？","countertest":"设计一次轮流发言和一次交叉讨论，比较遗漏内容、插话机会和实际贡献。","transfer":"情境性听觉受限、语言差异与多人协作都值得观察；不同人群仍须分别研究。","sources":["https://ifdesign.com/en/winner-ranking/project/hera-inclusive-learning-companion/783496"]},{"id":"A05","ref":"M34","title":"希沃SC13：物理动作、教学流程与AI判断的衔接","fact":"iF说明打开托盘即可启动拍摄与投屏，并可与其他希沃设备协同分析课堂内容和学生反应、提供建议。","change":"实物展示的准备过程被压缩，实体作业能更直接进入全班讨论。","mechanism":"打开托盘→拍摄／投屏→共同观看→系统建议→教师决定下一步。","tension":"自动化应减少准备负担，同时避免替教师和学生过早解释、判断。","question":"哪些步骤适合自动完成？分析结果怎样成为教师可质疑、可拒绝的建议？","countertest":"展示一份非常规但合理的解法，观察系统建议、教师修正和学生解释的空间。","transfer":"可以研究一个动作带来的流程改造，以及“展示”到“共同理解”的转变。","sources":["https://ifdesign.com/en/winner-ranking/project/seewo-sc13-wall-mounted-document-camera/638690"]}],"opportunities":[["让概念成为可操作关系","当动作表达比例、力或空间关系时，学生是否能解释映射，而非只模仿动作？","动作与概念映射、具身学习、迁移任务"],["让AI学会适时沉默","怎样区分暂时尝试、真正受阻和主动求助，决定提示时机？","主动交互、分级支架、求助行为"],["让AI的判断可以被协商","学生和教师如何查看依据、提出反例、修正解释？","可解释性、纠错权、证据表达"],["让多人拥有共同参与权","个性化工具怎样与班级协作兼容，避免一人操作、多人旁观？","轮次、共享对象、协作可供性"],["让真实与虚拟保持连续","屏幕反馈如何回到实物观察、测量和因果解释？","虚实映射、科学探究、过程记录"],["让能力差异成为设计起点","同一学习目标，是否允许不同身体条件和表达通道完成？","包容设计、等效参与、情境性限制"],["让使用者参与修正AI","学习者如何通过标注、比较和反例改变系统，而不是接受它的权威？","AI素养、可训练系统、模型边界"],["让支持可以逐渐撤去","系统帮助能否随能力形成而减少，让学生独立完成？","支架撤除、依赖、独立完成与迁移"]],"grades":[["小学低年级","观察、描述、动作与结果之间的清楚关联。","动作幅度、提示理解、误操作恢复；不以追踪成功推定理解。"],["小学高年级","比较、测量、预测与解释。","能否改变一个变量、保留证据并说出原因。"],["初中","把真实过程与抽象模型连接。","多步骤推理、变量关系、从失败结果定位原因。"],["高中","论证、建模、质疑与不确定性。","模型假设、证据质量、AI错误与接管权；不只增加界面复杂度。"]],"agency":[["学习目标","教师与学生共同明确；AI辅助拆解。"],["预测与解释","保留学生先表达、再比较的机会。"],["提示与反馈","AI可以提出；使用者能调整时机、深度或关闭。"],["评价与结论","关键判断保留人的复核和不同解释。"],["数据与模型","使用者知道改了什么、影响什么，并有纠正与重置路径。"]],"field":[["看一段真实活动","先问“学生具体在做什么”，记录开始、卡住、求助与恢复，而非先听功能介绍。"],["拆开自动化与AI","请演示输入、识别对象和输出；问哪些是固定规则，哪些依赖模型推断。"],["故意改变条件","在允许范围内改变光线、距离、噪声、人数或表达方式，记录失败后的处理。"],["寻找人的主动权","让演示者拒绝一次建议、关闭提示、纠正识别、恢复上一步。"],["观察学习而非跟随","完成一轮后去掉提示，再给一个相关新任务，听使用者解释怎样做。"],["追问班级使用","询问一班学生如何分组、谁能操作、教师怎样介入，以及真实课程使用证据。"],["区分展会与课堂证据","展会用于验证机制和发现问题；学段适配、持续使用与学习结果要回到真实课堂检验。"]],"metrics":[["交互","首次有效操作、识别失败、误触发、恢复时间与提示理解。"],["学习","能否独立解释、排查新错误、完成变式与迁移任务。"],["课堂与关系","谁参与、谁等待、教师负担、反馈打断以及帮助能否逐渐撤去。"]],"boundaries":["把“手势天然直觉、零注意力、适合所有人”改为待检验假设：动作学习、疲劳、遮挡和文化经验都可能改变结果。","可供性是人—环境之间的行动可能性；示标是帮助理解操作的线索，二者不要简单等同。","操作负担与学习思考分别设计：可以减少找按钮的负担，同时保留预测、解释、比较和试错。","即时反馈、根据情境调整、记住用户偏好、重新训练模型分别核验，不把“越用越聪明”当作共同机制。","识别到动作、语音或表情，不直接等于知道学生是否理解、是否专注或处于何种情绪。","获奖是设计对照线索；产品页与概念描述不直接证明课堂效果、量产或本届参展。"],"sources":[["人机交互指南：初次使用、交互中、出错时、长期使用","https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/","研究框架原文，所关联CHI论文是会议论文，不混入原25篇期刊文献。"],["Don Norman：Signifiers, not affordances","https://jnd.org/signifiers-not-affordances/","作者原文；用于区分行动可能性与操作线索。"],["Microsoft Inclusive Design：Persona Spectrum与情境变化","https://inclusive.microsoft.design/articles/inclusive-activity-cards","方法原文；不把情境性能力受限绑定为某一品牌独有概念。"]],"presentation":["研究问题与观察片段","12条跨行业变化线索","AI能力如何改写行动与反馈","手势的五种角色与多模态任务","人机分工与可供性","3—5个案例的机制、矛盾与反证","不同学段的研究机会","展会观察与课堂验证计划"],"concept_enrichment":{"title":"从设计概念建立证据，再推导智能交互机会","thesis":"智能系统怎样理解人的行动，并提供可理解、可纠正、能随能力形成而减少的支持？","framing":"以能力增强为总命题，从注意力、身体、主动权、学习过程与共同参与五个层面展开。手势是研究这些关系的一种入口。","evidence_rule":"报告说明变化背景；研究与方法原文解释设计原则；获奖档案提供可比较的实现；具体机会与未来场景属于本次推论。获奖不等于教学效果已验证。","evidence_sources":[{"id":"S01","title":"iF Design Trend Report 2026｜官方发布概要","year":2026,"url":"https://ifdesign.com/en/if-magazine/newsroom/if-design-trend-report-2026-key-design-trends-and-countertrends-shaping-innovation-ai-sustainability-and-future-cities-insights-for-designers-companies-and-strategists","type":"设计趋势","finding":"Convenience Culture与Skillization并置：便利、即时可用与练习、能力、自我效能之间形成张力。","use":"推导哪些操作应省力、哪些学习努力应保留。","limit":"本次使用公开概要，未声称读取收费报告全文；不是教育效果实验。"},{"id":"S02","title":"OECD Digital Education Outlook 2026","year":2026,"url":"https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html","type":"教育证据综合","finding":"工具辅助下的任务表现与独立学习获得需要区分；教学目的和教师能动性影响AI教育价值。","use":"检验撤去提示后的独立解释、调试与迁移。","limit":"不推论所有AI产品都有效或无效。"},{"id":"S03","title":"UNESCO｜AI competency framework for students","year":2024,"url":"https://www.unesco.org/en/articles/ai-competency-framework-students","type":"能力框架","finding":"以人为本、AI伦理、技术应用、系统设计；从理解、应用走向创造。","use":"把学生定位为能够判断、修正和创造AI系统的人。","limit":"框架不是设备效果证明；2026年网页更新不改写报告出版年份。"},{"id":"S04","title":"UNICEF｜Guidance on AI and children，第三版","year":2025,"url":"https://www.unicef.org/innocenti/reports/policy-guidance-ai-children","type":"儿童权利与设计指导","finding":"儿童相关AI需要考虑发展、参与、包容及适合其理解方式的支持。","use":"把儿童拒绝、纠错、参与和人际支持纳入交互。","limit":"不能据此推断情绪识别准确，或用拟人化取代真实支持。"},{"id":"S05","title":"Capgemini｜TechnoVision 2026","year":2026,"url":"https://www.capgemini.com/us-en/insights/research-library/technovision-2026/","type":"跨行业技术前瞻","finding":"Physical Matters关注实体产品、传感环境、模块适应与自治系统，也强调人的监督和信任。","use":"从屏幕操作扩展到身体、物体、环境和系统协作。","limit":"跨行业前瞻；教育迁移与未来场景是本次设计推演。"},{"id":"S06","title":"Adobe｜Creative Trends 2026","year":2026,"url":"https://blog.adobe.com/en/publish/2025/12/09/four-creative-trends-define-marketing-2026","type":"创意与体验趋势","finding":"强调感官体验、人际连接、游戏性与本土文化表达。","use":"检验反馈是否帮助人与人共同参与，是否与真实情境相关。","limit":"审美与营销趋势不证明多感官叠加能提高学习效果。"},{"id":"S07","title":"World Economic Forum｜The Future of Jobs Report 2025","year":2025,"url":"https://www.weforum.org/publications/the-future-of-jobs-report-2025/","type":"雇主调查与技能前瞻","finding":"AI相关技术与人的分析、创造、协作能力共同影响未来任务及技能结构。","use":"分析行业中的任务和角色变化，而不只统计AI新产品。","limit":"雇主预期不是儿童需求或行业普及率统计。"},{"id":"S08","title":"Microsoft Research｜Guidelines for Human–AI Interaction","year":2019,"url":"https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/","type":"经过研究检验的人机交互方法","finding":"把AI交互组织为初次使用、交互中、出错时与长期使用，强调能力说明与有效纠错。","use":"设计可发现的能力、控制权、反馈和修正路径。","limit":"基础方法文献；不将2019年论文当作2026年趋势或期刊论文。"},{"id":"S09","title":"NIST｜Four Principles of Explainable AI","year":2021,"url":"https://www.nist.gov/publications/four-principles-explainable-artificial-intelligence","type":"解释性研究原则","finding":"解释应有依据、对使用者有意义、反映实际过程，并交代知识与适用边界。","use":"呈现输入、证据缺口、可改正对象和下一步行动。","limit":"生成一段流畅理由并不证明理由忠实；不随意编造置信度。"},{"id":"S10","title":"Weiser与Brown｜Designing Calm Technology","year":1995,"url":"https://calmtech.com/papers/designing-calm-technology","type":"平静技术原始论述","finding":"技术在注意力的中心与边缘之间适当移动。","use":"分析什么可以低打扰地进行，什么必须引起注意。","limit":"经典概念原文，不是新的AI效果报告。"}],"design_concepts":[{"id":"C01","name":"平静技术与注意力设计","english":"Calm Technology","definition":"把注意力留给当前活动，同时在需要理解或决定时使系统状态显现。","trend":"AI开始在环境中感知和执行，设计要安排“何时出现、何时安静”。","evidence":["S05","S08","S10"],"scene":"教师展示学生作业：打开托盘即可投屏可减少准备；AI若准备给作业下判断，则应让教师看到依据并决定是否公开。","tradeoff":"自动化能省操作，但不能让采集、判断和控制权变得不可察觉。","question":"哪些步骤自动做？哪些状态持续可见？哪些决定必须请求人介入？","measure":"记录操作准备耗时、打断次数、误触发，以及使用者能否说清系统正在做什么。","transfer":"诊疗记录、零售结算、课堂录播、家居与照护。","case_refs":["M34","M35"]},{"id":"C02","name":"具身交互与可操作的知识","english":"Embodied / Tangible Interaction","definition":"让动作、实物与空间关系承担表达和理解，而不只承担发送指令。","trend":"智能感知进入实体环境，动作可成为内容、过程证据或共同操作的媒介。","evidence":["S05","S06"],"scene":"学习比例时，双手距离与量的变化应有明确对应；学习电路时，移动元件后应能追溯状态变化。","tradeoff":"识别出动作与理解概念是两件事；反馈应帮助建立因果关系。","question":"动作与知识之间是什么映射？不用提示，换一个对象还会解释吗？","measure":"比较操作后的解释、预测和变式任务；记录身体疲劳、遮挡和替代操作方式。","transfer":"音乐、科学实验、数学、运动训练、生产装配。","case_refs":["M09","M38"],"extra_sources":[["YogAnimals：Core77 2026 Interaction Notable","https://designawards.core77.com/Interaction/141766/YogAnimals-an-Interactive-Yoga-Installation"],["Opus Studio：UX Design Awards 2026","https://ux-design-awards.com/winners/2026-2-opus-studio-accessible-music-making-for-children"]]},{"id":"C03","name":"能力增强与渐退支架","english":"Augmentation / Scaffolding","definition":"AI提供当前需要的帮助，并为使用者形成独立能力保留空间。","trend":"便利与能力培养并行；教育价值需要观察工具撤去后还能做什么。","evidence":["S01","S02","S03"],"scene":"学生搭电路失败：先允许预测，再提示检查方向；必要时逐步增加帮助，之后独立调试一个新故障。","tradeoff":"过早直接给答案能提高当场完成率，却可能减少观察、比较与推理。","question":"帮助何时开始、到哪一层、何时减少？遇到真正困难与仍在探索怎样区分？","measure":"比较直接答案与逐级提示，记录求助、策略解释、去掉帮助后的表现和迁移。","transfer":"教育、技能培训、医疗专业支持、软件开发与维修。","case_refs":["M32","M38"]},{"id":"C04","name":"混合主动权与可纠错交互","english":"Mixed-Initiative / Correctable Interaction","definition":"人和系统都可以提出下一步，但目标、证据与行动能够被确认、拒绝和修改。","trend":"AI从回答走向建议与行动，设计需要分配决定权和出错后的恢复路径。","evidence":["S03","S08","S09"],"scene":"高中学生用AI解释一段实验数据：可以查看引用的数据段、提出反例、改变模型假设，并保留自己的结论。","tradeoff":"需要流畅协作，也需要防止系统在不确定时替人作关键决定。","question":"谁设目标、下结论、改规则？系统依据不足时会澄清、降级还是继续猜？","measure":"加入一个可发现的识别错误，观察能否定位、纠正、撤销并恢复任务。","transfer":"科研、风险审查、诊疗、自动化作业与课堂评价。","case_refs":["M32","M34"]},{"id":"C05","name":"包容设计与共同参与","english":"Inclusive / Collaborative Interaction","definition":"让不同能力、表达方式和角色的人，有机会理解、贡献并影响共同任务。","trend":"人际连接和儿童参与受到重视，个性化工具还需要适应多人课堂。","evidence":["S03","S04","S06"],"scene":"听损学生的小组讨论：除了实时字幕，还要研究谁在说、字幕延迟和何时能加入；音乐共创中要避免一人拿手机、全组等待。","tradeoff":"接收到信息不等于能参与；同一入口和同一评分尺度也未必适合所有人。","question":"谁控制共享对象、谁等待、谁被系统忽略？能否用不同通道达成同一学习目标？","measure":"记录各成员实际贡献、轮次等待、误归属和替代通道使用，而不只记录是否完成。","transfer":"融合教育、跨语言协作、家庭照护、公共服务与文化体验。","case_refs":["M41"],"extra_sources":[["Opus Studio：共同创作而非单人控制","https://ux-design-awards.com/winners/2026-2-opus-studio-accessible-music-making-for-children"],["Be My AI：AI说明、追问与真人支持","https://support.bemyeyes.com/hc/en-us/articles/18133134809105-How-do-I-use-Be-My-AI"]]}],"design_changes":[["操作入口","从安排按钮与页面，扩展到设计何时可看、可听、可识别。","手势有效范围、录音状态、对象选中与结束提示。"],["表达方式","从单通道输入，扩展到围绕同一任务关联语言、动作与实物。","“把这个变大”需要结合指向对象；信息矛盾时先澄清。"],["反馈内容","从显示结果，扩展到呈现证据、过程和下一步检查。","指出电路哪个状态异常，并允许学生解释原因。"],["主动权","从用户触发响应，扩展到设计建议、确认、执行与接管。","AI可建议复习，教师决定是否打断全班。"],["时间关系","从一次操作，扩展到记忆、适应、校准与支持退出。","区分记住偏好、调整规则和重新训练模型；分别提供纠正入口。"],["社会关系","从单人完成，扩展到共享对象、轮次与公开／私密反馈。","谁能改变全班屏幕？个人错误应何时公开讨论？"]],"industry_evidence":[{"sector":"教育","observed":"OECD区分AI辅助任务表现与真实学习，关注教学目的和人的能动性。","future":"可解释学习过程、能逐渐减少帮助的探究伙伴。","interaction":"什么时候提示，谁来解释，撤去工具后能否独立完成？","source":["OECD 2026","https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html"],"level":"教育证据综合"},{"sector":"医疗","observed":"Dragon Copilot将诊疗对话整理为记录，医生仍可复核与编辑。","future":"环境记录进入既有工作流，专业人员将注意力投入交流和判断。","interaction":"记录状态、关键错误、复核和签署如何可见？","source":["Microsoft 2025官方案例","https://ukstories.microsoft.com/features/how-microsoft-dragon-copilot-is-helping-uk-clinicians-focus-on-care/"],"level":"厂商机制说明，不是临床效果结论"},{"sector":"农业","observed":"See & Spray利用相机识别田间目标，支持局部施用和记录。","future":"从统一执行，走向观察局部差异后干预的照料系统。","interaction":"漏识别与误识别怎样被发现？人怎样设置和纠正目标？","source":["John Deere官方产品","https://www.deere.com/en-us/products-solutions/sprayers-and-applicators"],"level":"已出现的产品机制"},{"sector":"制造","observed":"IFR 2025关注分析式、生成式与物理AI，以及变化环境中的机器人。","future":"由人示范、调教并在异常时接管的作业协作者。","interaction":"示范何时结束？机器人理解了什么？异常由谁接管？","source":["IFR 2025趋势","https://ifr.org/news/top-5-global-robotics-trends-2025/1st-"],"level":"行业协会前瞻"},{"sector":"物流","observed":"DHL已用Stretch处理卸箱，并公布继续扩展的合作计划。","future":"从单次搬运动作，走向人机共同处理异常货物的流程。","interaction":"何时停、怎样交接异常、操作者如何恢复流程？","source":["DHL 2025公告","https://group.dhl.com/en/media-relations/press-releases/2025/dhl-group-signs-mou-with-boston-dynamics-and-accelerates-cross-business-automation-strategy.html"],"level":"部署与合作公告，计划不等于已完成"},{"sector":"零售","observed":"Just Walk Out把相机与重量传感等信息关联，判断顾客拿走的商品。","future":"结算退到活动背景，核对和申诉成为新的体验重点。","interaction":"顾客怎样知道记了什么、何时付款、错误如何修改？","source":["Amazon多模态机制原文","https://www.aboutamazon.com/news/retail/amazon-just-walk-out-improves-accuracy"],"level":"厂商机制说明"},{"sector":"音乐","observed":"ROLI Airwave把手部追踪、演奏与指导关联。","future":"从操作乐器，扩展到能够讨论演奏过程的练习环境。","interaction":"过程反馈何时介入，是否保留完整表达与个人风格？","source":["iF获奖档案","https://ifdesign.com/en/winner-ranking/project/roli-airwave/752394"],"level":"获奖产品与品牌机制"},{"sector":"无障碍服务","observed":"Be My AI支持图像说明、追问、补图，并保留真人志愿者入口。","future":"AI与真人支持可按任务难度切换。","interaction":"怎样发现信息缺口、补充输入，以及知道何时转给人？","source":["Be My Eyes官方帮助","https://support.bemyeyes.com/hc/en-us/articles/18133134809105-How-do-I-use-Be-My-AI"],"level":"已存在的交互流程"},{"sector":"文创与传播","observed":"Adobe 2026强调感官体验、人际连接、游戏性与本土文化。","future":"AI参与创作的同时，人的选择、风格与文化语境更需显现。","interaction":"作者怎样修改和判断生成内容，观众怎样理解来源？","source":["Adobe 2026趋势","https://blog.adobe.com/en/publish/2025/12/09/four-creative-trends-define-marketing-2026"],"level":"体验趋势，不是学习效果证据"},{"sector":"软件开发","observed":"Copilot已从补全代码扩展到建议修改、验证文件及代理任务。","future":"开发者分配任务、检查变更并指导代理重做。","interaction":"任务边界、进度、验证结果和可撤销修改如何呈现？","source":["GitHub官方功能页","https://github.com/features/copilot"],"level":"厂商功能说明"},{"sector":"交通与出行","observed":"TechnoVision 2026讨论软件定义车辆、自治系统与人的监督。","future":"从持续操控扩展到意图表达、状态监督与条件化交接。","interaction":"自动化边界、接管条件和未完成任务如何让人理解？","source":["Capgemini 2026","https://www.capgemini.com/au-en/insights/research-library/technovision-2026-guide-for-ctos-and-cios/"],"level":"报告前瞻；具体场景为推演"},{"sector":"能源与设施","observed":"TechnoVision 2026关注传感实体、数字孪生和能源感知工厂。","future":"环境变化触发预测维护，人员决定是否执行干预。","interaction":"如何区分测量事实、模型预测与操作建议？","source":["Capgemini 2026","https://www.capgemini.com/au-en/insights/research-library/technovision-2026-guide-for-ctos-and-cios/"],"level":"报告前瞻；具体场景为推演"},{"sector":"公共文化与历史教育","observed":"Hi:Stories把地点与原始档案相连；该获奖项目未明确声称AI。","future":"AI可参与史料检索或解释生成，但必须保留来源与人的辨读。","interaction":"如何分清原始记录、策展解释与生成内容？","source":["UX Design Awards 2026 Gold","https://ux-design-awards.com/winners/2026-2-hi-stories-next-door"],"level":"相邻交互案例；AI导入为本次假设"}],"industry_note":"这里给出13个行业的比较入口。观察事实与未来推演分列；某项功能或概念存在，不意味着已经普及，也不证明它取得了宣传中的效果。","case_synthesis":[{"ref":"M09","concept":"具身交互＋能力增强","fact":"iF产品奖，2026年由品牌原文复核；手部追踪与演奏过程相连。","analyse":"人在设定练习与解释反馈中保持主动；比较持续提示、段后总结与主动求助。","unknown":"硬件获奖与后续AI Music Coach服务分开，不把实时反馈当作持续学习模型。","test":"撤去提示，演奏一个新乐句并解释动作策略。"},{"ref":"M32","concept":"可纠错协作＋AI素养","fact":"iF获奖档案；品牌中小学课程明确支持采集数据、训练和部署。","analyse":"学生改变数据、提出反例并检验模型，主动权进入AI制作过程。","unknown":"训练由使用者发起，不等于系统每次使用都自动更新模型。","test":"改变光线或加入相似对象，先预测失败，再补充数据验证。"},{"ref":"M38","concept":"学习支架＋主动交互","fact":"iF学生设计奖2026「优质教育」概念，官方专题可交叉核验。","analyse":"研究AI何时提供哪一级提示，以及是否容许有价值的试错。","unknown":"官网未完整披露如何感知电路和生成指导，交互流程拆解是待验证假设。","test":"比较直接答案与逐级提示，再独立排查一个新电路故障。"},{"ref":"M41","concept":"包容设计＋共同参与","fact":"iF学生设计奖2026「优质教育」概念：模式切换麦克风、助听连接与AI转写。","analyse":"把注意力从能否看见字幕，推进到能否跟上轮次并影响讨论。","unknown":"评审对信心与参与的肯定不等于已经完成课堂效果验证。","test":"比较轮流发言与交叉讨论中的遗漏、等待、实际贡献。"},{"ref":"M34","concept":"平静技术＋人机分工","fact":"iF产品获奖档案：打开托盘触发拍摄与投屏，协同其他设备提供分析建议。","analyse":"准备步骤可自动，关键教学判断仍需可查看、可拒绝和可改正。","unknown":"打开即投屏属于动作触发自动化；AI分析是另一层能力，两者分别验证。","test":"展示一个不同寻常但合理的解法，检查学生解释和教师改判的空间。"}],"case_synthesis_note":"五个主案例保留iF原链接；ROLI、Plinx、Hera等近年出处与学生概念、产品奖分别标明。分析、未知点和测试是本次研究判断。Plinx和Hera的2026年由iF官方中文专题复核。","case_cross_source":["iF 2026优质教育官方专题","https://www.ifdesignasia.com/blog/posts/ifdsa2026-04-10"],"opportunity_sets":[["操作过程怎样成为可讨论的证据？","覆盖实验、编程、书法、音乐与体育。","从动作记录到因果解释的连接。","比较只给结果与提供过程线索，观察独立解释与调试。"],["智能系统怎样选择介入时机？","覆盖个人练习、小组活动、全班讲解。","降低无效操作与保留探索努力之间的取舍。","比较立即提示、延迟提示与主动求助后的迁移和打断。"],["多人如何共同影响一个智能系统？","覆盖不同学段、能力与表达通道。","共享对象、发言轮次与纠错权的分配。","记录谁被识别、谁等待、谁能提出修改，而非只看完成率。"]],"affordance_checks":[["真实行动可能性","学生能否用自己的手型、动作范围或表达方式完成任务？","功能确实支持哪些人、对象与情境。"],["示标与可发现性","如何知道现在可以操作、操作范围在哪？","入口、有效区域、轮次与对象归属。"],["反馈与可理解性","系统看见了什么、是否接受动作、下一步是什么？","等待、识别、执行、完成、失败分别可辨。"],["约束与错误恢复","普通讨论动作怎样避免误触？错误怎样撤销或改用其他通道？","确认、超时、撤销、替代输入与教师接管。"]],"presentation":["总命题与五个设计概念","权威报告支持的趋势及其边界","13个行业的现有变化与未来推演","AI新增了哪些要被设计的关系","3—5个案例的机制、矛盾与证据","手势、多模态与可供性的分析工具","中小学不同学段的研究机会","展会观察与真实课堂的验证计划"]}},"question_one":{"title":"第一题｜AI怎样改变传统行业，催生新场景与新物种？","as_of":"2026-10-28","horizon":"2026—2030：条件性推演，不是确定预测","original_question":"AI带来哪些传统行业变革？产生新场景与新物种？你知道还有哪些？未来会有哪些变化（10+）？","thesis":"AI开始把一些原本由人逐步操作的工具，变成能够参与观察、判断、创造和持续服务的系统。变化的程度，要从真实活动和流程中判断。","reading_note":"本题以行业、场景、形态、未来四个层次展开。五个设计概念用于解释变化；案例负责提供证据。这里的“传统模式”是逐项说明的比较基线，不代表整个行业过去只有一种做法。","count_note":"原题没有把“10+”明确限定为行业数。本页准备15组变化实例，每组都有一条未来判断；8组大众领域、7组细分领域。","chain":["原有活动与限制","AI新增能力","流程与分工改变","新场景","新形态","未来及条件"],"stem":[["传统行业变革","在已有行业内部，观察工作怎样重新组织。","具体指出被改变的环节、角色、交付方式或价值，而非只说效率更高。"],["产生新场景","活动的参与者、时间、地点和可行条件发生变化。","写清谁在什么条件下，能够以什么新方式完成什么事情。"],["产生新物种","产品或服务的能力组合与使用关系出现明显变化。","解释它怎样从单项工具延伸为反馈环境、共创平台、照护系统或任务助手。"],["你知道还有哪些","扩展课堂已经讲过的行业与案例。","兼顾日常生活和细分专业领域，寻找不同机制，而非只换产品名称。"],["未来有哪些变化","根据已有迹象，推导尚未完全实现的下一步。","每组分别列出现有迹象、可能变化和成立条件。"]],"evidence_rule":"原文事实标为“证据”；行业意义、新场景及形态分类是本次比较分析；未来部分逐条标为推演。厂商说明用于核实机制，不作为独立效果证明；概念奖与实际应用分别呈现。","sources":[{"id":"S01","title":"iF Design Trend Report 2026｜官方公开概要","org":"iF International Forum Design","year":2026,"kind":"设计趋势报告","url":"https://ifdesign.com/en/if-magazine/newsroom/if-design-trend-report-2026-key-design-trends-and-countertrends-shaping-innovation-ai-sustainability-and-future-cities-insights-for-designers-companies-and-strategists","finding":"报告同时讨论便利与技能形成、算法趋同与人的判断、自然技术融合与能力增强。","use":"建立“减少负担、保留技能、组织关系”的概念框架。","limit":"使用公开概要；未读取收费全文，也不据此认定具体产品 时产品说明确认。","access":"已核对官方公开页面或其官方检索缓存","checked":"2026-10-28"}],"concepts":[{"id":"C01","name":"能力增强设计","english":"Human augmentation","question":"AI怎样降低参与门槛，同时支持人的技能和判断继续形成？","definition":"把感知、分析或反馈能力嵌入人的任务中，使人能够完成原先缺少支持的活动，并保留自己练习与判断的空间。","trend":"iF 2026把便利与技能形成并置；OECD 2026提醒，有工具时完成得更好与真正学会需要分开判断。由此可把趋势理解为“支持能力形成”，而非只增加答案供应。","industry_change":"专业支持从约定时段延伸到日常活动；教师、教练和专业人员可以更多围绕过程组织帮助。","boundary":"AI提供指导不代表人已经获得能力。教育与练习应查看撤去支持后的表现；专业决策仍需相应判断。","evidence":["S01","S04"],"cases":["Q01","Q05","Q09","Q13"]},{"id":"C02","name":"情境感知与自适应设计","english":"Context-aware and adaptive design","question":"系统能否根据活动条件调整服务，减少用户反复说明和设置？","definition":"把人、物、任务和环境的相关信号组织起来，针对当前情况选择参数或支持方式。平静技术补充说明：必要时仍要把状态带回人的注意中心。","trend":"TechnoVision 2026关注能适应变化的实体产品；零售联合传感、洗护参数调整和照护告警给出具体实现。多种传感器存在，只是前提，是否真正联合推断仍需逐项查证。","industry_change":"服务从用户先输入、系统后响应，部分转向活动发生时同步感知和辅助。","boundary":"感知到信号不等于理解全部意图。应说明识别覆盖、异常处理和人可以修改的内容。","evidence":["S02","S09","S13","S16"],"cases":["Q02","Q04","Q06","Q11","Q14"]},{"id":"C03","name":"生成式共创","english":"Generative co-creation","question":"AI怎样参与探索，人又在哪里提出标准、筛选和修订？","definition":"人表达目标、约束或偏好，系统生成可比较的候选，人再通过评价和修改继续探索。共创对象可以是图像、配方或修复方案。","trend":"Adobe 2026研究观察到创意任务在构思、后期和选择等环节重新分配；iF 2026同时关注算法趋同与人的文化判断。未来价值可能更多体现在问题定义和方案取舍。","industry_change":"从熟悉方案中手工迭代，扩展到更大范围候选探索；人的工作包括确定标准、检验实物和说明采用理由。","boundary":"生成候选不等于保证原创性、嗅觉质量或历史真实性。每一领域仍有独立验证方法。","evidence":["S06","S01","S24","S27"],"cases":["Q08","Q10","Q12"]},{"id":"C04","name":"具身交互","english":"Embodied interaction","question":"人的身体、实体对象和实际行动怎样进入智能系统的反馈过程？","definition":"以实际活动中的身体技能、物体操作和社会实践理解交互。AI可以观察这些过程并关联反馈；具身交互的范围比“挥手控制设备”更广。","trend":"Dourish提供理论基础；TechnoVision 2026关注数字与实体融合。手部追踪支持音乐练习、实物与仿真结合的电路套件，显示反馈对象开始包括行动过程。","industry_change":"知识和服务不再只经由文字表格表达，也可围绕演奏、运动、接线或实体修复开展。","boundary":"动作追踪、动作理解、教学判断是不同环节；手势输入不天然低负担，也不自动适合所有人。","evidence":["S08","S02","S21","S11"],"cases":["Q01","Q05","Q09","Q12"]},{"id":"C05","name":"服务化与系统设计","english":"Servitization and systemic design","question":"AI怎样连接产品使用前后，以及不同参与者之间原本分散的环节？","definition":"把单项产品放回持续活动中，连起分析、执行、反馈、维护与资源流。服务化关注持续交付；系统设计关注参与者、基础条件与长期影响。","trend":"WEF 2025把AI放在相连的价值链中讨论；iF 2025的定制美容案例、后厨废弃记录及回收设施方案提供不同尺度的连接方式。","industry_change":"从售出设备或完成一次交易，延伸到持续指导、按需调配、远程照护和材料流管理。","boundary":"形成数据记录只是一步。需要人员、供应链、维护和使用者配合，才能形成实际服务；循环收益还需要生命周期证据。","evidence":["S03","S07","S19","S20","S33"],"cases":["Q03","Q06","Q07","Q11","Q13","Q14","Q15"]}],"cases":[{"id":"Q01","group":"大众","sector":"中小学教育","title":"当练习不必等到下次批改，教学服务会怎样改变？","concepts":["C01","C04"],"status":"证据综合＋学生获奖概念","anchor":"OECD 2026／Plinx（iF学生设计奖2026，SDG04）","evidence":["S04","S11","S12"],"fact":"OECD讨论有教学目的的AI支持；Plinx概念把电路元件、仿真与AI指导组合，面向课堂和自学。","before":"以集中讲解、课后完成、下一次批改为比较基线：错误原因和尝试过程不一定及时进入教师视野。","capability":"生成分步提示、关联当前任务并提供反馈；Plinx声称实时指导，但其传感和模型实现未充分披露。","change":"本次判断：服务可从“交付内容、检查结果”延伸到“在尝试中提供支持”。教师据此组织复盘，学生承担接线、预测与解释。","scene":"新场景：学生在教室或家中进行小步电路探索，遇到困难时先获得线索，再把未解决的问题带回师生讨论。","form":"新形态：实体实验材料＋数字仿真＋指导服务组成的学习环境；Plinx展示这一概念方向。","judgement":"场景拓展较明确；是否构成成熟新形态，还需实现与独立学习证据。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"有教学目的的生成式AI研究与实体学习概念同时出现。","next":"推演：支持可能从回答单题转向帮助回顾尝试过程，并随学习者掌握程度逐渐减少。","conditions":"需要课程对齐、教师使用时间和儿童数据安排；用撤去AI后的解释与迁移检验能力，而非只看当场完成率。"},"limit":"Plinx不是已验证的中学教学产品；本页未限定其官方年龄，也未把研究机构所在大学当作使用学段。"},{"id":"Q02","group":"大众","sector":"购物零售","title":"结算进入购物过程后，商店的服务重点移到哪里？","concepts":["C02","C05"],"status":"已有应用机制","anchor":"Amazon Just Walk Out多模态更新（2024）","evidence":["S03","S13"],"fact":"官方说明相机与重量等信息联合处理，用于判断商品取放并完成免排队结算流程。","before":"以顾客拿商品后集中到收银点核对为比较基线，结算和购物活动在空间与时间上分开。","capability":"联合感知商品取放、动作关联和数量；这里的多模态是官方明确描述的模型机制。","change":"本次判断：识别与核对工作部分进入门店环境。服务人员的任务可更多围绕商品服务、特殊情况和账目纠正组织。","scene":"新场景：在停留时间有限的门店，顾客把挑选和离店作为连续活动，交易核对可以在后续凭据中进行。","form":"新形态：货架、传感、交易与运营后台共同组成结算环境，智能能力分布在空间中。","judgement":"已有环境型服务形态；它改变结算流程，不足以证明整个零售业已被重构。","levels":["流程改进","场景拓展","形态创新"],"future":{"signal":"系统已从顺序处理动作发展到联合处理复杂情境信号。","next":"推演：更多小型场所可能把交易处理嵌入日常活动，异常核对和人工帮助成为服务质量的关键。","conditions":"需要足够的识别可靠性、部署经济性、清楚的交易记录及纠错通道；不同店型须独立验证。"},"limit":"不把“免收银排队”扩写为无人运营，也不使用2024门店数描述2026规模。"},{"id":"Q03","group":"大众","sector":"旅游与住宿","title":"从填写筛选项到讨论出行要求，旅行服务会怎样延伸？","concepts":["C02","C05"],"status":"产品试点公告＋近年趋势","anchor":"Booking AI Trip Planner／Amadeus Travel Trends 2026","evidence":["S05","S14","S15"],"fact":"Booking公告描述对话调整旅行推荐并连接住宿预订；Amadeus 2026讨论旅行者组合AI和其他信息来源。","before":"以分开搜索攻略、目的地和住宿为比较基线：旅客要自行把预算、同伴需要、地点和时间拼合。","capability":"语言理解、条件整理、候选方案生成和检索连接；发布机制仍包含由人查看并选择预订。","change":"本次判断：旅行咨询从固定筛选项扩展为逐步澄清需求的过程，平台需要连接推荐理由与真实可订服务。","scene":"新场景：家庭共同规划时，可以不断加入步行距离、儿童活动或休息需求，再比较取舍。此为基于现有对话机制的情境推演。","form":"新形态：行程协商助手已出现；跨平台代办与行中恢复仍需更多能力和授权，不能等同于当前已实现。","judgement":"已有规划场景拓展；完整执行型旅行代理是条件性未来。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"对话推荐开始连接真实商品入口，旅行者也在混用AI与其他来源。","next":"推演：服务可能从行前找方案延伸到行中因天气、延误或同伴状态而协助调整。","conditions":"需实时库存与交通信息、平台协作和明确的人为确认；错误推荐后的改订责任也须落实。"},"limit":"2023公告为美国英语beta，不据此推定全球可用、自动付款或自动改签。"},{"id":"Q04","group":"大众","sector":"家居与家务","title":"当洗护能够按衣物条件调整，用户还需要承担哪些判断？","concepts":["C02","C05"],"status":"量产产品机制说明","anchor":"Samsung Bespoke AI Laundry（2025机制）","evidence":["S02","S16"],"fact":"官方说明智能洗护根据负载、面料和污渍等信号调整周期，并结合自动投放和联网控制。","before":"以人分拣衣物、选择程序、估计用量并安排洗烘为比较基线，用户需把材料知识转成参数。","capability":"识别或估计衣物相关条件并调节执行参数；自动投放、结构整合和模型推断应分别看待。","change":"本次判断：用户从持续设置参数，部分转向提供衣物和特殊要求、处理例外；服务也延伸到耗材补充和维护信息。","scene":"新场景：普通日常衣物可以减少反复设置，用户把注意力留给有特殊要求的织物和异常情况。","form":"新形态：由家电、传感、参数调节和维护服务组成的家务系统；洗烘合并带来的便利同时包含结构设计贡献。","judgement":"成熟产品中的流程改进与系统整合，不把每一代智能家电都命名为新物种。","levels":["流程改进","场景拓展"],"future":{"signal":"设备已能依据输入调整周期，并与家庭服务平台连接。","next":"推演：家务服务可能从单台设备的程序优化，扩展到任务顺序、耗材与维护的协同安排。","conditions":"需要不同织物条件下可靠运行、断网可用和清楚的特殊衣物规则；跨品牌协同仍需接口和用户选择。"},"limit":"不声称设备理解全部家庭意图；2025功能受型号与负载范围限制。"},{"id":"Q05","group":"大众","sector":"运动健身","title":"评估与训练连起来后，健身服务怎样从卖课程转向持续调整？","concepts":["C01","C04","C05"],"status":"已有产品与服务机制","anchor":"Technogym Checkup（2024推出）","evidence":["S17","S02"],"fact":"企业资料描述评估站测量相关身体与认知参数，并形成个性化训练方案。","before":"以一次评估后长期执行固定训练单为比较基线，重新评估与日常训练可能彼此分离。","capability":"把测量结果关联到训练建议；可观察的参数是输入，不等于全面理解人的身体与状态。","change":"本次判断：服务价值可从提供设备或课程，延伸到评估、训练、回顾的连续支持；教练帮助解释并处理难以量化的情况。","scene":"新场景：普通训练者在持续训练中定期比较自己的变化，围绕目标而非只围绕设备选择课程。","form":"新形态：评估节点＋训练设备＋记录与教练服务形成的训练网络。","judgement":"属于服务流程整合；对不同人群的有效性仍需独立证据。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"评估参数已与个性化训练推荐建立产品连接。","next":"推演：训练计划可能更细致地响应阶段变化，把教练的时间用于目标讨论和例外处理。","conditions":"需要可靠测量、合适的调整边界和专业人员参与；不能把商业评估指标当医学诊断。"},"limit":"本案例没有证据证明系统能够识别所有动作或自主持续训练自身模型。"},{"id":"Q06","group":"大众","sector":"美容护肤","title":"从买一瓶成品到分析后调配，美容服务怎样被重新组织？","concepts":["C02","C05"],"status":"服务设计获奖档案","anchor":"CUSTOM ME Bespoke Essence（iF；上市2024）","evidence":["S18","S19","S03"],"fact":"获奖说明把光学分析、问卷、报告与现场精华调配组织成一套服务。","before":"以顾客从标准品中选择为比较基线，个人描述、店员建议和生产配方之间存在距离。","capability":"把外观信息和生活方式输入用于个性化分析，再连接配方与调配。","change":"本次判断：门店从陈列销售场所延伸为分析、咨询与小批量交付节点；服务对象从产品类别细分到个人需求。","scene":"新场景：消费者在一次到店过程中完成说明、分析、讨论和领取定制产品；实际调配由门店流程支撑。","form":"新形态：检测设备、问卷、顾问与调配设施共同组成按需美容服务。","judgement":"服务化形态清楚；个性化程度和效果不能仅凭“AI定制”名称确认。","levels":["流程改进","场景拓展","形态创新"],"future":{"signal":"分析与现场交付已在同一服务中连接。","next":"推演：一次性定制可能延伸为在季节、生活习惯变化后重新评估的长期服务。","conditions":"需检验重复测量一致性、配方适用性、生产合规和持续使用价值；按需生产的环境收益须另评估。"},"limit":"奖项档案的2024是上市年份，获奖年份未独立核定；不把分析结果当皮肤病诊断。"},{"id":"Q07","group":"大众","sector":"餐饮与后厨","title":"当剩余食物成为日常证据，备餐决策会怎样改变？","concepts":["C02","C05"],"status":"已有应用机制＋企业报告","anchor":"Winnow｜2025/26公开报告说明","evidence":["S20","S03"],"fact":"系统称重并拍摄废弃食物，将记录转为厨房团队可使用的日常信息。","before":"以人员凭经验备餐、事后估计浪费为比较基线：采购、制作和废弃信息容易分散。","capability":"识别废弃食物并关联重量与时间，帮助发现高频浪费环节；后续决定由厨房团队实施。","change":"本次判断：废弃处理成为生产流程的反馈入口。厨师可以依据记录调整份量、菜单和制作节奏，服务商持续协助改进。","scene":"新场景：后厨在正常处理剩余食物的活动中获得记录，不必另外组织完整的人工盘点研究。","form":"新形态：垃圾桶附近的感知节点＋厨房信息＋人员改进服务形成运营反馈系统。","judgement":"主要是流程与服务系统创新；单个识别设备并不独立完成减废。","levels":["流程改进","场景拓展","形态创新"],"future":{"signal":"食物废弃已能转为可讨论的记录，并进入厨师日常工作。","next":"推演：系统可能进一步把废弃原因与采购、预订和当日需求连接，支持少生产多余食物。","conditions":"需统一记录口径、处理复合菜品和缺失记录，并验证团队实际采用了什么改变。"},"limit":"企业节约汇总不等于独立因果证明；本页不使用其宣传百分比推算其他餐厅收益。"},{"id":"Q08","group":"大众","sector":"影视与内容创作","title":"生成候选变快以后，创作者的价值会移到哪些环节？","concepts":["C03","C01"],"status":"研究观察","anchor":"Adobe｜How AI Is Redistributing Creative Work（2026）","evidence":["S06","S01"],"fact":"研究观察AI进入构思和后期，选择、方向确定、客户沟通和来源责任仍是重要工作。","before":"以构思、样稿、制作和交付依次推进为比较基线，每轮候选往往需要投入专业制作时间。","capability":"生成草案、变体和部分后期素材，使更多候选可以被提前比较。","change":"本次判断：部分劳动从首轮制作重新分配到提出标准、筛选方向、修改细节和解释来源。不同经验水平的人受到的影响并不一致。","scene":"新场景：小团队在提案早期比较多个可见方案，客户更早参与方向选择；这是任务层面的扩展。","form":"新形态：围绕约束表达、生成、编辑和来源记录组织的共创工作环境。","judgement":"可以确认工作环节在变化；“人人成为专业创作者”仍缺乏依据。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"生成已进入创作流程，但实际采用在不同任务中明显不同。","next":"推演：工具可能更强调风格约束、团队评价和可追溯编辑，创作者的方向判断成为更可见的交付部分。","conditions":"需要满足客户、授权与质量要求，并保留真实拍摄、协作和专业训练的价值。"},"limit":"Adobe样本不能直接代表全球创意行业，不从研究推导所有创作岗位的增减。"},{"id":"Q09","group":"细分","sector":"乐器演奏与音乐训练","title":"系统能够观察手的动作之后，日常练琴会出现什么新支持？","concepts":["C01","C04","C05"],"status":"产品奖＋beta软件服务","anchor":"ROLI Airwave（iF产品奖2026）／AI Music Coach beta","evidence":["S21","S22","S23","S35","S01"],"fact":"Airwave为手部追踪硬件；2026公开软件把它与语音和练习指导结合，当前页面标beta。","before":"以个人看谱、听结果和定期上课为比较基线，课间练习的手部过程不一定有人即时观察。","capability":"追踪手部动作，关联演奏和语音请求，提供过程反馈；动作信号与音乐表达质量仍需区别。","change":"本次判断：乐器旁形成持续练习支持，教师的价值可以更多放在风格、表达和长期发展，而重复练习增加反馈机会。","scene":"新场景：学习者在家中练习某一小节时获得过程线索，并通过语音调整练习方式。","form":"新形态：乐器＋观察装置＋课程与对话服务共同形成练习环境。","judgement":"可讨论的实体与服务混合形态；获奖硬件与后续软件能力分别核验。","levels":["场景拓展","形态创新"],"future":{"signal":"追踪动作的硬件已连接到对话式练习服务。","next":"推演：音乐支持可能更关注个人动作习惯与完整演奏过程，并与教师复盘相连。","conditions":"需要验证遮挡、不同手型和演奏风格下的反馈，并比较是否提高独立演奏与表达能力。"},"limit":"不把beta写成全面成熟服务；不推论它能取代教师，亦不把所有空中动作都当控制指令。"},{"id":"Q10","group":"细分","sector":"香氛与调香","title":"AI提出陌生配方后，调香师的创作过程怎样变化？","concepts":["C03","C05"],"status":"已有系统＋2025行业回顾","anchor":"Symrise／IBM Philyra","evidence":["S24","S25","S01"],"fact":"Philyra从历史配方和材料特征生成组合，调香师评价反馈，并加入材料可持续性维度。","before":"以调香师围绕熟悉原料与经验组合反复试验为比较基线，探索范围受时间和材料成本约束。","capability":"从配方关系中寻找候选，并在材料约束下提出组合；闻香、实物测试和取舍仍由人参与。","change":"本次判断：AI扩大候选探索，调香师组织试闻、判断风格并修正方向。创意与材料约束可以在更早阶段同时比较。","scene":"新场景：遇到原料替换或可持续要求时，人机共同寻找仍保留目标风格的组合。","form":"新形态：配方知识、约束探索和实物评价连接的专业共创平台。","judgement":"体现持续演进的专业工具形态；系统始于较早年份，2025回顾用于判断近年发展。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"生成候选之后，系统继续增加材料与环境相关约束。","next":"推演：共创可能从“给出新配方”走向帮助比较气味目标、材料来源和替代方案的取舍。","conditions":"需高质量材料数据、真实配制与试闻，并由调香师验证；不假定公式相近就气味相同。"},"limit":"AI配方工具不等于能记录或复现任何气味的电子鼻；厂商回顾不代表行业普及率。"},{"id":"Q11","group":"细分","sector":"宠物与水族照护","title":"照护从按时投喂转向观察对象状态，会改变什么关系？","concepts":["C02","C05"],"status":"红点2024设计概念","anchor":"AI Intelligent Recognition of Fish Feeder","evidence":["S26","S02"],"fact":"获奖概念提出识别鱼类、观察活动、制定喂食计划，并保留用户调整入口。","before":"以主人按时间和经验设定投喂为比较基线，离家期间难以及时了解不同对象的状态。","capability":"概念设想把图像与活动信息关联到喂食建议；具体模型、物种覆盖与性能没有公开验证。","change":"本次判断：如果实现，设备的价值会从“替人执行定时动作”延伸到“帮助主人观察并安排照护”。","scene":"新场景：短时离家的主人远程查看水族活动，并根据记录调整照护；这是概念指向的场景。","form":"新形态：摄像、投喂与远程建议组合的对象照护系统，仍处设计概念层。","judgement":"提供形态与场景方向，不能算已验证的行业变革结果。","levels":["场景方向","形态方向"],"future":{"signal":"近年设计奖已把对象识别与照护计划作为同一系统来构想。","next":"推演：照护可能增加对行为变化的持续观察，并把异常线索交给主人或专业服务判断。","conditions":"需物种与个体差异数据、可靠的喂食边界和专业验证；健康告警不可仅凭外观想当然。"},"limit":"不把获奖概念说成在售产品，也不把行为识别写成已准确理解动物情绪。"},{"id":"Q12","group":"细分","sector":"艺术品保护与修复","title":"数字修复能够进入实物以后，修复师需要怎样重新组织工作？","concepts":["C03","C04","C05"],"status":"2025期刊研究演示","anchor":"MIT／Nature｜digitally-constructed mask","evidence":["S27","S28","S01"],"fact":"研究把数字修复方案打印成可移除薄膜，由人对齐附着，并保留可查阅的数字变更档案。","before":"以修复师识别缺损后逐处调色补绘为比较基线，密集缺损需要大量细致操作。","capability":"AI辅助产生数字候选，计算工具将缺损和色彩映射为修复膜；对齐、材料处理和艺术史判断仍有人参与。","change":"本次判断：流程从重复补绘延伸到审核候选、制作可逆材料和记录变更，修复依据与可撤回性成为交付的一部分。","scene":"新场景：部分长期因修复资源不足而搁置的画作，可能先进行可逆方案评估，再决定是否展示。","form":"新形态：数字推断＋可移除修复材料＋变更记录形成计算辅助修复流程。","judgement":"研究已做实体演示；是否适用于其他作品和材料，尚需保护实践验证。","levels":["流程改进","场景方向","形态创新"],"future":{"signal":"数字候选已能通过可逆材料作用于画作，而不只停留在屏幕。","next":"推演：修复可能更多采用可比较方案、可追溯记录和可撤回干预，让不同专家共同审议。","conditions":"需艺术史证据、材料长期稳定性与修复伦理判断；生成图像只能是待审方案。"},"limit":"不把推断内容称为确定的原始面貌；Nature全文访问受限，机制细节取自MIT官方说明。"},{"id":"Q13","group":"细分","sector":"手语与无障碍信息服务","title":"公共信息有了动态手语版本，服务覆盖会怎样扩展？","concepts":["C01","C05"],"status":"已记录应用的无障碍项目","anchor":"Signapse｜Zero Project 2026项目资料","evidence":["S29","S02"],"fact":"项目资料记录把文字信息生成手语视频，用于交通等公共信息场景，并有聋人参与开发。","before":"以文字屏幕或有限时段的人工口译为比较基线，部分公共信息更新难以同步提供手语版本。","capability":"把文字内容转换成手语表达视频；该证据支持输出侧生成，不证明任意手语输入的双向理解。","change":"本次判断：无障碍服务可以从事后附加内容扩展为信息发布流程的一部分，语言社群参与服务开发与质量判断。","scene":"新场景：乘客在信息不断变化的车站查看动态手语内容，获取与出行相关的更新。","form":"新形态：可连接公共信息流的手语生成服务，嵌入既有显示与传播设施。","judgement":"属于服务通道与组织方式创新，不意味着全部交流情境都能自动处理。","levels":["流程改进","场景拓展","形态创新"],"future":{"signal":"手语输出已连接到实际公共信息服务。","next":"推演：更多公共服务可能把不同表达通道同步纳入内容生产，减少无障碍信息的发布延迟。","conditions":"需不同手语语言的验证、社群参与和关键消息审核；敏感专业交流仍需合适的人类支持。"},"limit":"手语不只是手部动作；本案例不作为“手势控制设备”的证据。"},{"id":"Q14","group":"细分","sector":"养蜂与授粉服务","title":"跨距离照护能够连接观察与行动后，养蜂服务会怎样改变？","concepts":["C02","C05"],"status":"已有机制＋2026发展说明","anchor":"Beewise BeeHome／2025影响报告公开说明","evidence":["S30","S31","S02"],"fact":"BeeHome通过图像观察、告警和机器人机构支持远程照护；2026说明提出机器人到蜂箱工作的探索。","before":"以养蜂人定期前往分散蜂箱巡查为比较基线，信息获得与采取行动都受距离和时间制约。","capability":"从图像发现需要关注的线索，并通过远程机构支持干预；不同照护动作的自动程度需要分别核对。","change":"本次判断：工作可以从按固定周期走访，部分转向依据状态安排关注和行动；服务把蜂群、养蜂人和授粉需求连接。","scene":"新场景：养蜂人跨地点查看蜂框并安排照护，优先处理需要人工经验判断的蜂群。","form":"新形态：蜂箱、感知、远程机构与专业服务形成持续照护系统；移动照护机器人仍是探索方向。","judgement":"已有环境与服务整合；不能把未来移动形态写成成熟部署。","levels":["流程改进","场景拓展","形态创新"],"future":{"signal":"企业已从“监测问题”进一步讨论“能够到现场处理问题”。","next":"推演：照护能力可能从集中在特定智能蜂箱，扩展到支持更多既有蜂箱的分布式服务。","conditions":"需长期田间验证、成本与维护安排，以及对蜂群生态影响的专业评估。"},"limit":"不采用厂商自报存活率作普遍效果结论；生物照护不等于只优化单一产量指标。"},{"id":"Q15","group":"细分","sector":"再生资源回收","title":"当废物流能够被识别和记录，回收会怎样从分拣走向材料服务？","concepts":["C02","C05"],"status":"已有分选系统＋获奖概念对照","anchor":"AMP Jet／Eco Fusion.AI（红点2024概念）","evidence":["S32","S33","S34","S10"],"fact":"AMP连接材料识别、轨迹控制和分选记录；Eco Fusion.AI提出废塑料转打印耗材的桌面概念。","before":"以混合物料人工或固定规则分拣为比较基线，材料的组成、品质和去向容易缺乏连续记录。","capability":"AMP用AI识别可见特征并配合气流执行分选，记录材料流；Eco概念的AI介入细节未充分说明。","change":"本次判断：回收服务可从处理垃圾，延伸到给再生原料提供分类和过程信息；下游材料需求影响怎样分选。","scene":"新场景：回收设施按目标原料调整分选，并把品质线索提供给下游。桌面再生是另一个尚待验证的尺度。","form":"新形态：识别、分选、材料记录与设施运营组成的回收系统；小规模再生工作站作为概念对照。","judgement":"工厂级流程与系统变化有机制依据；小规模循环制造仍是形态方向。","levels":["流程改进","场景拓展","形态方向"],"future":{"signal":"分选组件已扩展为设施方案，设计概念同时探索更小尺度的材料循环。","next":"推演：回收可能逐步从“收走并分开”走向按再生用途交付有记录的原料。","conditions":"需检测污染和材料品质、连接下游市场，并比较能耗、运输及全生命周期成本；还须兼顾减量与再用。"},"limit":"机器识别和材料回收不自动等于可持续；Eco概念没有公开的真实材料与环境绩效验证。"}],"forms":[{"name":"实体工具增加过程反馈","what":"工具开始把人的实际动作或物体状态作为反馈依据，服务围绕一次次实践继续。","cases":["Q01","Q05","Q09"],"evidence":"ROLI为产品与beta服务；Plinx为学生概念。证据成熟度不同。","judgement":"可称为“带反馈的实践环境”这一分析类别；单个传感器加入产品，还不足以确认新物种。"},{"name":"环境成为持续服务载体","what":"智能能力分布在空间、容器和基础设施中，把观察与后续服务连接起来。","cases":["Q02","Q07","Q11","Q14"],"evidence":"门店结算、后厨反馈与BeeHome已有机制；水族照护案例仍为概念。","judgement":"变化在于活动与服务的组织方式：从某次按键操作扩展为活动中的持续支持。"},{"name":"软件参与协商与任务推进","what":"系统不只显示功能入口，也整理条件、比较方案和连接下一步服务。","cases":["Q03","Q06","Q13"],"evidence":"行程对话、定制美容和手语发布分别实现了部分环节；跨平台自主执行不能由这些案例直接推出。","judgement":"当前可确认“参与规划与连接”的助手形态；完整执行型代理仍取决于接口、授权和恢复能力。"},{"name":"专业平台支持反复共创","what":"把目标、候选、专业评估和修改相连，人的标准与领域验证成为重要部分。","cases":["Q08","Q10","Q12"],"evidence":"创意研究、调香系统与修复研究展示不同阶段；数字候选都需要各自领域的审查。","judgement":"平台创新可表现为新的协作过程，而非一定要出现一种新的硬件外观。"}],"directions":[{"title":"支持从约定时段延伸到日常活动","cases":["Q01","Q05","Q09","Q11"],"signal":"过程反馈和持续记录开始进入练习与照护。","next":"推演：更多支持可能发生在实际活动当时，专业人员将时间用于困难和例外。","condition":"需要独立效果、设备可达性和专业服务连接；不能只增加记录。"},{"title":"服务从单次交付延伸到持续回顾","cases":["Q04","Q06","Q07","Q14"],"signal":"分析、执行和记录之间已出现产品或服务连接。","next":"推演：服务可能围绕人的变化及环境变化反复调整。","condition":"长期维护、使用者实际采纳和清楚的价值交换决定是否成立。"},{"title":"产品从单项功能扩展到多方协作","cases":["Q02","Q03","Q13","Q15"],"signal":"门店、预订、公共信息和材料流需要多个环节配合。","next":"推演：更多任务可能由跨设备和跨机构的系统共同完成。","condition":"实时数据、接口、参与者分工和失败后的责任必须落实。"},{"title":"专业价值更需要通过判断和验证显现","cases":["Q08","Q10","Q12"],"signal":"候选方案增加，专业筛选与领域验证仍不可缺少。","next":"推演：评价标准、来源记录、实物测试和个人风格可能成为更重要的服务内容。","condition":"人的训练和可验证证据需要持续投入，不能只以生成速度衡量价值。"}],"takeaways":["行业变革：相同任务中的观察、判断、执行和交付开始重新分配；具体改变因行业而异。","新场景：支持进入日常练习、短时离家、分散照护等过去难以持续服务的条件。","新物种：值得关注的是能力组合和使用关系的变化，可能表现为环境、平台、材料流程或服务系统。","未来：由15组现有迹象分别推演，可靠性、领域验证和实际服务组织决定变化能走多远。"],"boundaries":["本页只回答第一题。界面细节、能动性与信任的深入机制可在第二、三题继续分析。","行业分析不是市场普及率统计，也不把任何一个获奖作品当作行业整体已转型的证明。","五个概念为既有设计视角及本次综合用法；不声称它们由AI首次创造。","每组未来均为2026—2030条件性推演。新闻发布年份、报告年份、产品上市年份和获奖年份分别记录。","新增研究和书目只作为本题依据，不改动原导航25篇核心／索引期刊论文的数量。"]},"campus_ai_20261031":{"as_of":"2026-10-31","title":"AI＋教育：从课堂到全校园","thesis":"当前可见的变化，是AI逐步连接教学过程、身体与实体活动，以及校园服务流程。对交互设计而言，关键是学生和教师能否理解、行动、检验与修正。","scope":"以你提供的全校园场景图为框架，聚焦小学到高中。图中供应商宣传仅作问题清单，不作为有效性证据。","evidence_rule":"报告和政策支撑趋势；官方产品页支撑功能存在；奖项页支撑获奖及设计描述。本次分析与待验证方向另列，未把厂商的成效宣传视为独立验证。","image_note":"原图涵盖教学、体育、心理、阅读、食堂、宿舍、校门、校车、安全与学校管理；合并相近模块为12类。未确认图片供应商品牌及二维码内容。","sources":[{"id":"AT01","title":"《“人工智能+教育”行动计划》","org":"教育部等五部门／国家数据局原文","date":"2026-04-02印发；04-10发布","kind":"中国政策","url":"https://www.nda.gov.cn/sjj/zwgk/tzgg/0410/20260410162428109058250_pc.html","finding":"提出中小学AI通识、课后与研学实践、智能学伴、教师协同备课、体育美育劳动教育、智能辅具及教育治理。","implication":"可以沿课堂、校园日常和支持服务寻找产品；观察它怎样嵌入教师与学生的真实活动。","limit":"政策描述建设方向，不是某项产品有效、某所学校已完成建设的证明。"},{"id":"AT02","title":"OECD Digital Education Outlook 2026","org":"OECD","date":"2026-01-19","kind":"教育研究与政策报告","url":"https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html","finding":"区分任务表现与实际学习；教育专用GenAI需要明确教学原则、学习科学依据、教师参与和效果评估。","implication":"研究提示时机、学生思考过程和撤去AI后的独立完成能力，不能只看完成速度。","limit":"报告综合多国、多教育阶段证据；不能将其中单个实验或使用率直接套用到中国中小学。"},{"id":"AT03","title":"The 2026 AI Index Report · Education","org":"Stanford HAI","date":"2026版","kind":"年度趋势报告","url":"https://hai.stanford.edu/ai-index/2026-ai-index-report/education","finding":"教育章节关注AI使用、学校政策、AI素养和人才培养；K–12 AI教育的数据仍有限，部分指标以计算机科学教育作为代理。","implication":"选题需要同时观察使用需求、教师规则与学生对AI的判断能力。","limit":"章节混合中小学与高等教育数据。本页不将大学生数据或美国比例当作中国中小学生比例。"},{"id":"AT04","title":"Skills for an AI World","org":"UNICEF Innocenti","date":"2026-09","kind":"儿童参与式研究报告","url":"https://www.unicef.org/innocenti/reports/skills-ai-world","finding":"咨询非洲五国97名9—17岁儿童；儿童强调核验信息、隐私、依赖与批判判断，也表达了学习和创作需求。","implication":"小学到高中应有不同的解释和操作支持；学生参与设计可以检验成年人对儿童需求的假设。","limit":"这是特定样本的定性咨询，不是全球普及率调查，也不能代表中国学生。"},{"id":"AT05","title":"Guidance on AI and Children · Version 3.0","org":"UNICEF Innocenti","date":"2025-12","kind":"儿童AI政策与设计指南","url":"https://www.unicef.org/innocenti/reports/policy-guidance-ai-children","finding":"要求儿童安全、隐私、公平、透明、问责与有意义的儿童参与；提醒学习分析可能形成错误或污名化判断。","implication":"设计“看到了哪些数据、如何修正、谁能看到、何时转交成人”等可理解的交互。","limit":"这是一套儿童权利与治理要求；不构成对任何具体情绪识别、诊断或监控算法的有效性认证。"},{"id":"AT06","title":"AI competency framework for students","org":"UNESCO","date":"2024发布；页面更新2026-01-16","kind":"学生AI能力框架","url":"https://www.unesco.org/en/articles/ai-competency-framework-students","finding":"以人为本、AI伦理、AI技术与应用、AI系统设计四个维度，按理解、应用、创造逐步发展。","implication":"教育产品可以让学生采集数据、比较结果、修改模型和讨论影响；AI素养也包含判断与责任。","limit":"三个进阶层级不是小学、初中、高中的官方一一对应；本页学段安排是调研比较。"}],"trends":[{"id":"ET01","title":"教师智能体进入完整工作流程","change":"教师与AI共同组织备课、课堂活动、反馈、家校沟通和复盘；交互对象从一次回答延伸到任务步骤与长期记忆。","evidence":["AT01","AT02"],"cases":["EC03","EC02","EC04"],"design":"要设计上下文、步骤预览、数据出处、记忆更新和撤回；重点验证教师是否更容易采取下一步行动。","test":"用一份真实教案走完“修改目标→生成活动→收集反馈→调整下一课”，记录转录、复制和人工修正次数。","confidence":"政策支持＋多个厂商2026功能证据；不同系统的自动执行能力仍需实机核查。"},{"id":"ET02","title":"学习过程反馈成为产品核心","change":"AI反馈进入朗读、写作、实验与练习，逐渐连接到具体错误、修改与再次尝试。","evidence":["AT02","AT03"],"cases":["EC04","EC05","EC13"],"design":"设计分层提示、可解释反馈与重新尝试；评价完成作品时，同时检查学生能否独立解释和迁移。","test":"先有AI提示完成，再撤去AI完成一个相似新任务，比较独立完成与错误类型。","confidence":"教育证据综合支持“教学设计决定作用”；产品存在不等于已证明真实学习增益。"},{"id":"ET03","title":"多模态反馈连接身体、声音与实体材料","change":"人体与手部姿态、语音、肌电和实验传感数据，连接到屏幕、声音、机械动作或字幕反馈。","evidence":["AT01","AT05"],"cases":["EC08","EC10","EC11","EC12"],"design":"明确识别区、激活方式、当前状态、反馈与替代操作。多模态首先解决活动中实际的表达和参与障碍。","test":"在遮挡、噪声、多人和不同身高条件下，测试用户能否发现失败原因并继续。","confidence":"有具体可核查机制与获奖作品；多种输入输出不自动证明已经采用多模态融合大模型。"},{"id":"ET04","title":"校园日常成为探究与AI素养的学习空间","change":"走廊、阅读区、食堂、温室与空气数据可以成为提问、实验、合作和判断算法的入口。","evidence":["AT01","AT04","AT06"],"cases":["EC14","EC23","EC17","EC24","EC07"],"design":"把身边问题接到可观察、可操作、可讨论的活动；按学段提供不同表达方式和探索深度。","test":"看学生能否提出自己的问题、比较证据和解释下一步，而不只完成打卡。","confidence":"政策与儿童能力框架支持；案例同时包含AI产品和用于比较的非AI教育设计。"},{"id":"ET05","title":"个性化服务需要学生参与和可修正记录","change":"学生数据正进入成长报告、阅读练习和支持服务；学生、教师和家长对数据的理解与修正成为设计内容。","evidence":["AT04","AT05"],"cases":["EC25","EC13","EC15","EC19"],"design":"让学生看见“记录了什么、为什么给这个建议、谁能看到、怎样更正”；情绪支持保留成人联系。","test":"引入一条错误记录或误译，追踪更正后报告、提醒和共享内容是否同步更新。","confidence":"权威指南明确要求透明、参与与权利保护；不能把画像宣传当作心理诊断或完整能力测量。"},{"id":"ET06","title":"校园AI连接业务数据与人工处置","change":"AI问答、视觉或语音识别开始连接接送、校车、食堂与求助流程，形成从事件到责任人的服务链。","evidence":["AT01","AT02","AT05"],"cases":["EC20","EC21","EC22","EC18"],"design":"把信息来源、时间、置信与待核状态表达清楚，提供可达的人工复核与断网处理。","test":"模拟误报、旧数据和临时变更，看相关人员能否发现、修正并完成交接。","confidence":"已有商业功能与部分应用记录；本页不将其解释为AI已能自主作出放人、处分或诊断决定。"}],"scenes":[{"id":"SC01","title":"教学楼：课堂、教务与教研","photo":"智能排课、云上课堂、AI作业批改、循证教研、听评课","stages":["小学","初中","高中"],"trend":"教师AI进入授课入口与反馈工作流，可围绕同一份教学内容连续使用。","ai_role":"识别板书与作业、生成资源、解释课堂记录；排课与点名的规则功能需单独判断。","design":"本次分析：将反馈放在原任务附近，支持选择证据、编辑结果、调整后续教学。","candidates":"课堂中选中一份学生作品，显示“原作—识别—建议—教师调整—学生再试”的过程。","cases":["EC01","EC02","EC03","EC04"],"field":"希沃W3001：请演示一节课中真实数据如何进入AI分析，结论能否返回原课堂片段。","boundary":"本轮没有将普通排课、点名、课表查询自动归为AI，也未证明AI可直接代替教师评分。"},{"id":"SC02","title":"功能教室：科学、信息科技与工程","photo":"综合实践、新劳动教育、项目化学习；图中功能教室","stages":["小学","初中","高中"],"trend":"AI提示与传感、实体搭建结合，学生可以通过试验学习模型与现实的差别。","ai_role":"实验问答、模型识别和工程判断；传感器采集本身与AI解释分别核查。","design":"本次分析：围绕预测、操作、观察和修正组织提示，避免把动手活动压缩成照着答案接线。","candidates":"小组实验台或电路套件，实体操作旁出现可选择的提示，保留同伴讨论和实验记录。","cases":["EC05","EC06","EC07","EC08","EC24"],"field":"给设备一个错误接线、漏测变量或训练样本不足的情境，观察如何定位问题。","boundary":"初高中工程任务与小学入门活动分开；不能把教学仿生手写成脑机读心产品。"},{"id":"SC03","title":"综合评价：成长档案与五育活动","photo":"点评、奖卡、五育卡、综合素质报告、成长手册","stages":["小学","初中","高中"],"trend":"评价工具将课堂与课外活动连接到可编辑的过程反馈。","ai_role":"语音转评价、生成评语和活动建议；奖章与兑换可由常规规则实现。","design":"本次分析：评价落到具体情境，让学生能补充证据，教师能修正模型建议。","candidates":"有来源的成长记录卡：一次活动、学生解释、同伴反馈与教师确认共同构成记录。","cases":["EC25","EC04","EC19"],"field":"把含否定词或引用他人话语的评价输入系统，检查误发奖章、撤回和报告同步。","boundary":"参与次数、积分和情绪标签不自动代表品德、能力或心理状态。"},{"id":"SC04","title":"操场与体美活动：运动、姿态、音乐","photo":"跑圈、跳绳、仰卧起坐、球类、体质监测","stages":["小学","初中","高中"],"trend":"视觉与身体数据让即时反馈进入自主练习和小组体验。","ai_role":"姿态估计、动作计数及音乐手部追踪；计数与动作教学要分别看。","design":"本次分析：让学生清楚站位、激活、有效动作与暂停方式，提供适合身体差异的反馈。","candidates":"可自主练习的运动角，或配合实体乐器的手势学习；动作反馈可以选择私下显示。","cases":["EC09","EC10","EC11"],"field":"一视E2001等同类展位：用不同身高、同伴遮挡、动作边界测试，而非只看工作人员演示。","boundary":"YogAnimals的学校应用是迁移分析；ROLI未限定学段。姿态识别不等于所有空中动作都可控制系统。"},{"id":"SC05","title":"心理支持：表达、调节与成人联系","photo":"AI情绪测评、AI心理健康测评","stages":["小学四年级及以上","初中","高中"],"trend":"有边界的自我表达、技能练习与人工支持，成为AI校园服务的一类实际形态。","ai_role":"受约束的生成式对话；将AI回应、预写量表和专业诊断的职责分清。","design":"本次分析：学生应看得懂记录与通知规则，也能不通过对话直接找到成人。","candidates":"自愿的情绪记录与呼吸练习界面，持续显示“找老师／结束／记录权限”等可执行入口。","cases":["EC15"],"field":"查看演示账号中保密范围、转人工与退出过程，不要求收集真实学生敏感数据。","boundary":"Alongside明确不是诊疗；图中“AI情绪测评”不能仅凭名称就认定具备心理诊断效度。"},{"id":"SC06","title":"图书馆与走廊：阅读、提问与融合参与","photo":"图书借阅；由校园日常空间延伸的学习","stages":["小学","初中","高中"],"trend":"阅读区可以支持朗读反馈，走廊实体终端把偶发好奇接到后续探索。","ai_role":"语音转写、阅读练习和启发式问答；借还书与RFID仍可以不使用AI。","design":"本次分析：兼顾短时使用、多人接话、听障参与与问题接续，显示系统是否正在接收输入。","candidates":"不打断环境的提问终端、可回听的朗读位，以及小组讨论中的个人字幕辅助。","cases":["EC13","EC14","EC12"],"field":"测试嘈杂空间、排队、多人同时说话、半途离开以及下次如何继续。","boundary":"本轮未核实图中的借阅模块使用了AI推荐；Hera是获奖概念而非已部署图书馆设备。"},{"id":"SC07","title":"食堂与劳动：食品安全、食育和可持续","photo":"每日食谱、智慧食堂；新劳动教育","stages":["小学","初中","高中"],"trend":"AI管理后厨有实际应用，面向学生的食育还需要完整活动与服务设计。","ai_role":"视觉异常识别与管理提醒；称重、食谱计算、自动结算不是AI的充分证据。","design":"本次分析：分清管理员处置与学生理解食物的两条活动线，避免只有消费记录。","candidates":"管理端呈现可复核预警；学生端可以连接种植、食材来源、准备和分享的学习旅程。","cases":["EC18","EC17"],"field":"请演示误报复核和食材记录来源；同时观察学生实际排队、就餐与劳动参与时间。","boundary":"Time To Eat为非AI服务愿景；当前食堂手册不能证明已提供儿童AI营养处方。"},{"id":"SC08","title":"宿舍与家校：日常习惯、信息与自主安排","photo":"宿舍管理、点评、手机存放柜；家庭日常","stages":["小学","初中","高中"],"trend":"习惯组织与家校信息可连接到日常支持，而非持续增加打卡与通知。","ai_role":"AI可以辅助教师草拟或翻译消息；任务板、存放柜和日程规则本身不必AI化。","design":"本次分析：让儿童理解下一项活动并参与安排，家长与老师只收到完成协作所需的信息。","candidates":"低负担的实体任务组织与可改写通知；寄宿活动的AI建议需要另行验证。","cases":["EC16","EC19"],"field":"观察临时调整作息、忘记归还手机、家长收到误译时怎样恢复流程。","boundary":"本轮没有足够材料证明“AI宿管”改善中小学生习惯；Routio不是已部署寄宿学校系统。"},{"id":"SC09","title":"校门与停车：访客、放学和授权交接","photo":"访客、考勤、放学、安心接、储物柜、智慧停车","stages":["小学","初中","高中"],"trend":"接送数据进入运营问答，关键交接仍需要来源清楚、可确认的权限与状态。","ai_role":"AI汇总查询，配合定位和接送授权；人脸、二维码或车牌不等于完整放学安全。","design":"本次分析：将“到达、已授权、已核验、已交接”分开，支持临时变更和人工接续。","candidates":"家长到达、教师核对、学生交接的连续状态界面，AI回答附上更新时间。","cases":["EC20"],"field":"模拟委托人临时变化、无手机、定位漂移与断网，看能否核查并完成安全交接。","boundary":"不能将AI查询结果当作放人的独立授权；本页未声称失物柜和停车收费都具有AI。"},{"id":"SC10","title":"校车：上下车与道路事件","photo":"智慧校车、停车场","stages":["小学","初中","高中"],"trend":"计算机视觉与车载记录支持事件筛选、提示和复核。","ai_role":"识别疑似违规超车并形成证据；公交定位与线路管理可由常规系统实现。","design":"本次分析：围绕学生上下车、司机注意与后台复核分配信息，不把所有提醒挤给司机。","candidates":"事件回放与证据包、班车状态和家校告知，分别服务责任明确的使用者。","cases":["EC21"],"field":"查一次误判怎样排除，事件是否包含车速、停靠、时间与停车臂状态等上下文。","boundary":"BusPatrol是美国道路场景比较案例，其执法规则与业务授权不能直接移植。"},{"id":"SC11","title":"防欺凌与监控：求助、提示与处置","photo":"语音呼救、一键报警、周界入侵、追逐聚集、历史轨迹","stages":["小学","初中","高中"],"trend":"语音与视觉识别把异常提示送往具体责任人，交互重点包含求助可达与人工核查。","ai_role":"关键词等事件识别与提示；是否欺凌、是否处分仍需结合情境调查。","design":"本次分析：设计学生可使用的求助入口、接收确认、值班响应与错误修正。","candidates":"具有按键等替代操作的求助终端，配合值班端明确的事件与处置状态。","cases":["EC22"],"field":"用嬉闹、方言、低声求助和误按的演示素材测试，记录误报与无法求助时的替代方式。","boundary":"本轮没有把人脸关联、追逐检测或“成长分析”当成有效的品行或心理诊断。"},{"id":"SC12","title":"办公楼、空间与学校大脑：有来源的校园服务","photo":"AI助理、数字孪生、资产、教室使用、巡检、学校／师生画像","stages":["小学","初中","高中"],"trend":"自然语言入口开始连接教学与运营数据；空间数据也能成为学生参与的真实问题。","ai_role":"查询、生成与辅助解释；数字孪生、资产台账和环境传感本身不必依赖AI。","design":"本次分析：分别设计教师操作权限、管理者证据来源与学生对环境的理解和行动。","candidates":"可追溯数据的校园助手；学生可读取与检验的空气、能耗等环境信息界面。","cases":["EC03","EC20","EC23"],"field":"问一个缺数据的问题；再修改源记录，观察答案、报告、权限和历史是否同步更新。","boundary":"学校数据大屏不证明“学校大脑”能自主决策；环境数据不能替代对学生状态的实际了解。"}],"cases":[{"id":"EC01","title":"希沃 AI 授课助手","stages":["小学","初中","高中"],"stage_basis":"面向教师多学科授课；小学到高中按语文、英语、数理任务作比较。","status":"商用教学工具／官方帮助文档","tags":["生成式AI","视觉识别","触控"],"fact":"集成在白板、展台及PPT等授课入口，支持识别板书与试题、图形转交互模型、知识对话及课堂游戏。","ai":"识别与内容转化、教学资源生成；每项功能的可用版本仍需实机核对。","design":"在教师当前内容旁给出可执行动作，保留原板书与识别结果的对应关系，便于当场改正。","limit":"帮助文档是功能证据；2D转3D的演示不证明所有图形均可转化，也不是隔空手势。","test":"给一张含潦草公式和几何草图的真实板书，观察如何选择对象、纠正识别并恢复原图。","links":[{"label":"官方功能与教学情境","url":"https://help.seewo.com/easiscreenpercep/CUTu5MxHYm"},{"label":"长沙展原始公告／W3001","url":"https://www.seewo.com/article/detail/2990"}],"award":"","library_refs":["K01"],"checked":"2026-10-31"},{"id":"EC02","title":"希沃课堂智能反馈 · AI助手","stages":["小学","初中","高中"],"stage_basis":"教师教研端；学段取决于采集课例，不给学生设定个人能力标签。","status":"商用系统／2026-08帮助更新","tags":["生成式AI","多模态通道"],"fact":"教师可引用课堂报告数据提问、追溯过程数据，比较多节课，并生成反思或教学设计等文档。","ai":"官方称采用多个大模型智能体拆解需求与查询报告；支持附件分析及图文视频等输出。","design":"把结论连回具体课堂证据，让教师决定分析范围、纠正解释，再选择下一步行动。","limit":"多种输出不等于已证明跨模态融合准确；课堂行为统计不等于理解程度或情绪诊断。","test":"追问一条结论来自哪段课堂；更换统计时间与课例，检查报告能否相应更新。","links":[{"label":"AI助手操作手册（2026-08-27）","url":"https://help.seewo.com/edulyse/B7sO5Dlx2i"},{"label":"本届展会与学情闭环","url":"https://www.seewo.com/article/detail/2990"}],"award":"","library_refs":["K01","M35"],"checked":"2026-10-31"},{"id":"EC03","title":"讯飞星光超级智能体","stages":["小学","初中","高中"],"stage_basis":"官网明确面向K12一线教师；学生不作为行政操作的默认执行者。","status":"商用教师AI工作台／官方产品页","tags":["生成式AI"],"fact":"覆盖备课、学情研判、教研、家校与行政工作，支持教师记忆、H5教学应用创编和自定义技能工作流。","ai":"生成式内容、记忆与技能组合；通知统计等部分仍是常规业务功能。","design":"关注记忆的查看与更新、步骤预览、结果编辑和操作记录；让教师知道系统准备执行什么。","limit":"官网工作流说明不证明它能无条件自动调课、改成绩或发通知；这些权限需逐项演示。","test":"请工作人员做一次“生成活动→预览→修改→发布”，再撤销或更正，记录人工介入点。","links":[{"label":"K12产品与工作流原文","url":"https://edu.iflytek.com/solution/school/sparklight"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC04","title":"MagicSchool · Class Writing Feedback","stages":["小学","初中","高中"],"stage_basis":"平台面向K–12教师；具体班级工具与访问范围由学校配置。","status":"商用平台／2026-06产品更新","tags":["生成式AI"],"fact":"写作反馈接入量规、课堂作业平台和OneDrive，并提供优势、待发展部分与后续练习建议。","ai":"依据学生文本和教师评价要求生成反馈；学校可配置自定义学生AI工具。","design":"把反馈设计成学生能执行的修改任务，帮助教师审核、编辑并安排跟进练习。","limit":"流程集成与反馈生成不等于评分可靠；中国语文、课程和账号环境须另行验证。","test":"同一篇作文更换量规，看建议是否变化；让学生解释为什么修改，再比较独立重写。","links":[{"label":"2026-06写作反馈与学校配置更新","url":"https://www.magicschool.ai/blog-posts/whats-new-june-2026"},{"label":"使用、学生监督与隐私说明","url":"https://www.magicschool.ai/faq"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC05","title":"讯飞 AI科学实验室","stages":["小学","初中","高中"],"stage_basis":"官网对接国家中小学平台；小学科学与初高中理化任务需分别询问课程覆盖。","status":"商用课程、传感设备与软件方案","tags":["生成式AI","实物交互","传感与规则"],"fact":"传感器采集真实实验数据，AI学伴通过启发式问答引导变量思考，教师可看全班进展和实验轨迹。","ai":"AI备课与问答指导；数据采集和图表本身不必依靠AI。","design":"让学生先预测、动手测量、比较数据，再获得提示，保留实验过程中的判断权。","limit":"官网功能与价值描述没有给出独立对照实验；也不能默认它能识别所有错误接线或危险动作。","test":"故意漏测一个变量，观察AI是指出缺失、给出实验提示，还是直接编造结论。","links":[{"label":"实验课程、设备与AI学伴原文","url":"https://edu.iflytek.com/solution/school/ai-science-education"}],"award":"","library_refs":["K04"],"checked":"2026-10-31"},{"id":"EC06","title":"Plinx · AI辅助电路学习套件","stages":["初中","高中"],"stage_basis":"官网定位初学者，未指定年级；本页映射信息科技、物理与创客活动。","status":"获奖设计概念／量产与在校部署待核","tags":["AI机制待核","实物交互"],"fact":"将耐用电路元件、虚拟仿真与实时AI指导结合，支持从认识元件到搭建电路。","ai":"官方明确AI辅助指导；识别方法、反馈延迟与复杂电路覆盖未公开。","design":"比较实体元件、仿真与提示是否一一对应，接线失败时能否定位下一步可做的动作。","limit":"设计获奖不证明量产、课堂可用性或接线防护已通过测试。","test":"请演示反接、漏接及另一位同学接手后的提示，核查屏幕说明与实体状态是否一致。","links":[{"label":"iF官方作品档案","url":"https://ifdesign.com/en/winner-ranking/project/plinx/782462"}],"award":"iF DESIGN STUDENT AWARD · 04 优质教育","library_refs":["M38"],"checked":"2026-10-31"},{"id":"EC07","title":"MatataStudio Nous AI Set","stages":["小学","初中","高中"],"stage_basis":"厂家课程面向儿童编程与AI学习；小学图形化、初高中文本编程为研究映射。","status":"商用AI教育套件／课程公开","tags":["视觉识别","语音与语言","实物交互"],"fact":"提供图形化及文本编程，结合扩展件与AI模型开展项目；学生可连接实体设备观察程序结果。","ai":"视觉、语音等模型与可编程装置配合；具体模型取决于课程与扩展配置。","design":"使数据、模型判断和机器人动作形成可观察关系，支持学生重新采样与验证。","limit":"不是所有基础积木或预设动作都涉及AI；配置、联网与相机权限需现场核对。","test":"使用相似但不同的物体测试分类，观察是否展示错误样本和重新训练入口。","links":[{"label":"厂家课程及编程平台说明","url":"https://matatalab.com/en/node/960"},{"label":"iF官方设计档案","url":"https://ifdesign.com/en/winner-ranking/project/nous-ai-set/622486"}],"award":"","library_refs":["M32"],"checked":"2026-10-31"},{"id":"EC08","title":"NeuroMaker HAND and BioSensor Kit","stages":["初中","高中"],"stage_basis":"厂家课程列中学与高中标准对齐；高阶项目需教师指导。","status":"获奖实体教育产品／公开课程","tags":["生物信号","实物交互"],"fact":"红点档案明确结合AI、EMG传感器与个性化编程，让学生设计与测试教学假肢方案。","ai":"
