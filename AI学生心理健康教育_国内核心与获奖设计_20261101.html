功能应按当前软件版本分别演示。","design":"比较按键动作与空中动作如何分工，手离开键盘时用户是否知道参数和控制状态。","limit":"不是面向中小学的专用教学系统；不能把发布宣传中的所有功能都视为当前已经交付。","test":"遮挡一只手、移出识别区后再回来，观察是否误触发、能否暂停及恢复。","links":[{"label":"ROLI官方硬件与手势演示","url":"https://roli.com/us/product/airwave-create"},{"label":"官方Learn／Create机制说明","url":"https://support.roli.com/en/support/solutions/articles/36000584588-what-is-the-difference-between-learn-and-create-editions-"},{"label":"iF产品设计档案","url":"https://ifdesign.com/en/winner-ranking/project/roli-airwave/752394"}],"award":"iF DESIGN AWARD · 产品设计","library_refs":["M09"],"checked":"2026-10-31"},{"id":"EC12","title":"Hera · 听障学生学习辅助系统","stages":["小学","初中","高中"],"stage_basis":"官网面向有听力损失的学生与课堂／小组情境；未给年级，本页作跨学段融合教育比较。","status":"获奖设计概念／兼容与部署待核","tags":["语音与语言","多模态通道","实物交互"],"fact":"可切换模式的麦克风、助听器连接中枢与AI实时转写结合，支持听觉和文字理解及回看。","ai":"明确使用AI语音转写；多人声源分离与各种助听设备兼容未获公开验证。","design":"研究个人听讲与小组讨论切换、漏听回看，以及学生自己发起求助的入口。","limit":"获奖概念不等于量产辅具，不据此声称临床疗效或全面解决听障课堂问题。","test":"请演示两位同学接话、同时说话与专业词识别，观察谁能纠正字幕。","links":[{"label":"iF官方作品与评语","url":"https://ifdesign.com/en/winner-ranking/project/hera-inclusive-learning-companion/783496"}],"award":"iF DESIGN STUDENT AWARD · 04 优质教育","library_refs":["M41"],"checked":"2026-10-31"},{"id":"EC13","title":"Microsoft Reading Coach / Reading Progress","stages":["小学","初中","高中"],"stage_basis":"面向需要朗读流利度练习的学习者与教师；高中可作语言学习支持，不代表所有高中生都需要基础练习。","status":"现有产品／官方功能与可见性说明","tags":["生成式AI","语音与语言","多模态通道"],"fact":"Reading Coach提供AI故事与针对性词语练习；Reading Progress把朗读录音、错误标记和教师复核接入作业。","ai":"故事生成、语音错误估计和个性化练习；两种产品的账号与数据流程不同。","design":"显示哪个词需要练、提供重听与重读；把老师看得到哪些记录说明给学生。","limit":"AI发音估计可能误判；当前语言、口音、地区与学校账号支持需验证。","test":"读一个专有名词和口音明显的句子，看能否重听、纠正标记、限制数据分享。","links":[{"label":"Reading Coach官方入门","url":"https://support.microsoft.com/en-au/education/learning-accelerators/getting-started-with-reading-coach"},{"label":"Reading Progress与教师复核","url":"https://support.microsoft.com/en-us/education/learning-accelerators/getting-started-with-reading-progress-in-teams"},{"label":"学生数据可见性原文","url":"https://support.microsoft.com/en-us/education/learning-accelerators/learner-transparency-in-reading-coach-what-educators-can-see"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC14","title":"讯飞奇思妙问好奇窗","stages":["小学","初中","高中"],"stage_basis":"官网定位校园日常学习与文化空间；小学到高中按提问深度、排队与共同使用任务比较。","status":"商用校园AI终端／官方产品页","tags":["生成式AI","实物交互"],"fact":"把教育大模型问答、启发式追问、活动和校本知识放进校园终端，官网明确描述“走廊里的AI学伴”。","ai":"对话、追问与知识库内容；输入通道和是否支持手势需实机确认。","design":"把短暂停留变成可继续探究的问题，兼顾身高、围观、排队、离开和下次接续。","limit":"未见独立学习效果研究；问题排名与成长洞察不能直接等同好奇心或能力测量。","test":"让一名学生先问“为什么”，再请同伴插话；测试嘈杂走廊、半途离开与匿名提问。","links":[{"label":"官方产品、走廊情境与启发式追问","url":"https://edu.iflytek.com/solution/school/curiosity-window"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC15","title":"Alongside · 学校情绪与自我调节支持","stages":["小学","初中","高中"],"stage_basis":"FAQ明确4—12年级；本页小学仅四年级及以上。其他页面主要面向初高中。","status":"现有学校自助支持平台／非诊疗","tags":["生成式AI","语音与语言"],"fact":"通过受约束的技能对话、日记、习惯记录与练习支持学生；严重问题按固定协议转交支持人员。","ai":"生成式AI用于个性化技能对话；官网明确通用筛查使用预写量表，不用AI作临床诊断。","design":"让学生知道自己在和AI交流、哪些内容会通知学校、怎样退出与找可信任的成人。","limit":"不属于治疗或诊断工具；美国学校接入与支持流程不能直接视为中国可用方案。","test":"不使用真实敏感学生信息，查看演示如何说明保密范围、进入人工支持和删除记录。","links":[{"label":"适用年级与AI／非AI边界","url":"https://www.alongside.care/faq"},{"label":"官方人类支持与AI设计说明","url":"https://www.alongside.care/ai-safety-and-ethics"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC16","title":"Routio · 儿童日常任务组织","stages":["小学"],"stage_basis":"官方针对有ADHD的儿童；本页宿舍与家庭习惯场景属于迁移分析。","status":"获奖学生设计／非临床证明","tags":["实物交互","传感与规则"],"fact":"磁性任务板、积木和球形控制器连接家长与教师应用，可记录、回放任务顺序并显示进度。","ai":"本轮没有核实AI能力，作为低认知负担的实体交互对照。","design":"让“下一步做什么”和“已经完成什么”可见；比较自己安排与被连续催促的体验。","limit":"不能从设计奖推断ADHD干预疗效；也未证实在寄宿小学部署。","test":"将任务顺序打乱或漏做一步，观察儿童能否自行重排、恢复与请求帮助。","links":[{"label":"UX Design Awards官方作品","url":"https://ux-design-awards.com/winners/2024-2-routio-enhancing-organization-for-kids-with-adhd"}],"award":"UX Design Awards 2024 · New Talent Winner","library_refs":["H01"],"checked":"2026-10-31"},{"id":"EC17","title":"Time To Eat · 小学食育服务设计","stages":["小学"],"stage_basis":"奖项页明确面向小学；设计师来自大学不改变产品使用者为小学生。","status":"获奖学校服务愿景／非已部署AI系统","tags":["实物交互","传感与规则"],"fact":"把餐厅、温室、数字平台、社区联系与整体食育结合，构想2030年挪威小学的日常饮食体验。","ai":"官方未描述AI；用于对照学校食堂怎样产生可参与的教育活动。","design":"围绕种植、准备食物、就餐和分享组织服务触点，让学生能做选择并理解食物来源。","limit":"2030是作品愿景时间，获奖为2021；不能写成2026已落地的AI智慧食堂。","test":"调研学生能参与哪些环节，并比较排队结算效率与实际吃饭、交流时间。","links":[{"label":"iF官方作品、年份与使用者","url":"https://ifdesign.com/en/winner-ranking/project/time-to-eat/318427"}],"award":"iF DESIGN TALENT AWARD 2021 · 04 优质教育","library_refs":[],"checked":"2026-10-31"},{"id":"EC18","title":"天翼云 · 校园智慧食堂","stages":["小学","初中","高中"],"stage_basis":"官网面向学校及监管部门；本页只比较中小学食堂业务，不涉及高校消费场景。","status":"商用管理平台／手册更新2026-10-23","tags":["视觉识别","传感与规则"],"fact":"用AI视频识别后厨异常，并组织预警、整改和复核；验收称重、留样、食谱和营养分析接入管理。","ai":"视频异常识别明确涉及AI；称重、台账与食谱计算不能自动归为生成式AI。","design":"设计给食安管理员的证据、处置责任与复核状态；学生端食育是可继续研究的扩展。","limit":"平台功能不证明食物质量或营养效果；手册未证明它具有面向学生的AI营养对话。","test":"演示一条误报警从提示到关闭的全流程，查看复核证据与责任人是否可追踪。","links":[{"label":"官方产品手册（2026-10-23）","url":"https://www.ctyun.cn/document/11096137/11099417"},{"label":"政府公开的学校食堂AI应用实例","url":"https://fgw.huainan.gov.cn/msgcheng/gzdt/551861736.html"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC19","title":"ClassDojo · Sidekick与家校沟通","stages":["小学","初中","高中"],"stage_basis":"教师平台覆盖学校；2026新师生消息功能限13岁以上且学校启用，不能向低龄儿童照搬。","status":"商用家校平台／2026学校功能","tags":["生成式AI","语音与语言"],"fact":"Sidekick协助教师拟教案、材料和消息；学校端提供消息自动翻译，2026增加面向年长学生的界面与受控沟通。","ai":"生成教师草稿与机器翻译；积分、班级动态和消息管理为另外的业务机制。","design":"让教师审阅语气和译文，家长能看原文；将孩子参与、家长通知与公开展示分开。","limit":"积分不能直接解释品德；消息自动翻译不证明所有语言与方言都准确。","test":"用包含活动时间、否定词和接送变更的消息检查翻译，查看错误如何更正和通知。","links":[{"label":"Sidekick官方AI能力","url":"https://ai.classdojo.com/"},{"label":"2026家校与13+功能","url":"https://www.classdojo.com/teachers/"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC20","title":"Pikmykid · Pulse AI与接送管理","stages":["小学","初中","高中"],"stage_basis":"官方明确K–12；已核实小学学区使用接送应用，但不能据此推断该学区已启用Pulse AI。","status":"商用校园运营AI／配套接送应用","tags":["语音与语言","传感与规则"],"fact":"Pulse以问答查询考勤、学生状态与放学记录；接送应用支持家长到达通知和授权接送人。","ai":"自然语言查询与业务数据分析，具体模型类别未公开；定位、授权和放学确认依赖原始记录与规则。","design":"把最后更新时间、信息来源与人工确认放在答案附近，区分“查到安排”与“完成交接”。","limit":"官网没有证明AI可以替学校自主决定放人；数据汇聚也不自动等于学生心理或品行画像。","test":"临时更换接送人，并模拟定位延迟或断网，检查能否进入可核验的人工交接。","links":[{"label":"Pulse AI官方产品与问答示例","url":"https://www.pikmykid.com/solutions/pulse-ai"},{"label":"家长接送与授权说明","url":"https://pikmykid.freshdesk.com/support/solutions/articles/8000114560-pikmykid-parent-app-faq"},{"label":"小学学区实际使用说明","url":"https://www.cccsd.org/departments/information-technology/pikmykid-app"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC21","title":"BusPatrol · AI校车停车臂识别","stages":["小学","初中","高中"],"stage_basis":"面向学校校车乘员与管理者；美国场景，不能照搬其执法规则。","status":"商用交通安全系统／非自动驾驶","tags":["视觉识别","传感与规则"],"fact":"校车停靠且停车臂展开时，视觉系统捕捉疑似违规超车，结合定位与视频形成待审核证据。","ai":"AVA视觉识别筛选事件，连接车载摄像头与遥测；并非AI直接认定所有违法事实。","design":"关注司机提示、后台证据包、复核与家长信息，减少接送环节的信息不一致。","limit":"这是出行安全产品，不是课堂学习工具；不引用厂商准确率作为独立验证。","test":"让工作人员演示疑似事件、人工复核和误报排除，检查记录是否保留发生时的上下文。","links":[{"label":"官方AI机制与交互式校车演示","url":"https://buspatrol.com/technology/"},{"label":"工作流程原文","url":"https://buspatrol.com/stop-arm-overview/"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC22","title":"itc · 校园AI防欺凌求助系统","stages":["小学","初中","高中"],"stage_basis":"校园公共求助与值班管理；不同年龄的求助表达、语言和可及性须分别测试。","status":"商用语音报警、对讲与管理系统","tags":["语音与语言","多模态通道","实物交互"],"fact":"系统通过求助关键词、报警按键与对讲，将预警推送到控制中心及移动端，供人员查看和处置。","ai":"语音关键词识别等异常提示；一键报警和对讲本身不必使用AI。","design":"设计醒目的求助动作、已接收反馈、替代输入和处置状态，让学生知道求助是否到达。","limit":"关键词或冲突动作不能直接证明欺凌意图；厂商没有在该页给出独立误报、漏报研究。","test":"用演示音频比较普通嬉闹、方言求助、低声呼救和误按，检查人工核查与撤销路径。","links":[{"label":"官方系统组成与触发方式","url":"https://www.itc-audio.cn/news-knowledge-fangbaning.html"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC23","title":"Airthings × UCLA Lab School · 环境探究","stages":["小学"],"stage_basis":"UCLA Lab School是学前至六年级的实验小学，不是以大学生为使用者的项目。","status":"2026学校应用案例／传感探究","tags":["传感与规则","实物交互"],"fact":"学生读取空气质量数据，提出问题、制作海报、测试人员离开教室等假设，并向同伴解释。","ai":"本案例证据是传感器、数据看板与学习活动，未描述必须依赖AI。","design":"让环境指标成为学生可理解和可行动的信息；若加入AI，应帮助解释数据而保留检验过程。","limit":"厂家案例不证明因果学习效果；不能将CO₂读数直接当作注意力或智力分数。","test":"让学生比较通风前后趋势，记录能否提出自己的解释、检查变量和决定行动。","links":[{"label":"2026学校项目原文","url":"https://www.airthings.com/business/resources/ucla-teaching-environmental-awareness"},{"label":"学校官方年级／年龄说明","url":"https://www.labschool.ucla.edu/about/at-a-glance"}],"award":"","library_refs":[],"checked":"2026-10-31"},{"id":"EC24","title":"Most Likely Machine · 算法素养沙盒","stages":["小学","初中"],"stage_basis":"设计方明确pre-teens；可比较小学高年级与初中，未指定中国年级。","status":"教育交互原型／课堂与自主探索","tags":["触控","传感与规则"],"fact":"学生以投票、排序等方式构造数据和算法结果，反复改变选择，讨论偏见、公平与影响。","ai":"这是学习算法的交互体验；官网不足以证明该工具本身采用机器学习或大模型。","design":"用可逆试验让学生理解分类规则是怎样被构建的，并与同学比较不同结果。","limit":"不能把模拟偏见的活动当作对真实学生进行风险分类的依据；产品原型并非普及情况证据。","test":"改变一条规则，要求学生预测受影响的人，再用结果检验原先假设。","links":[{"label":"设计团队的机制、任务与使用者","url":"https://www.artefactgroup.com/resources/most-likely-machine/"},{"label":"可探索的设计原型","url":"https://mostlikelymachine.artefactgroup.com/"},{"label":"iF官方设计档案","url":"https://ifdesign.com/en/winner-ranking/project/most-likely-machine/581897"}],"award":"","library_refs":["M24"],"checked":"2026-10-31"},{"id":"EC25","title":"讯飞育星图 · 五育综合评价","stages":["小学","初中","高中"],"stage_basis":"官网明确面向中小学；按不同学段活动与评价语汇比较。","status":"商用评价平台／官方学校案例","tags":["生成式AI","语音与语言","实物交互"],"fact":"教师语音点评可解析并匹配奖章，学生数据用于生成可编辑评语和成长报告，联通线下激励设施。","ai":"语音理解、评语与活动生成；芯片卡、积分兑换与报告汇总需分别识别机制。","design":"使评价与具体行为和情境关联，给教师改写、学生补充和家长理解的入口。","limit":"积分数量和模型评语不能直接代表完整素养；长期画像需检查数据缺失与修正方式。","test":"给一次容易歧义的语音评价，观察匹配奖章、发布前确认及学生异议处理。","links":[{"label":"官方产品、语音评价与成长报告","url":"https://edu.iflytek.com/solution/school/quality-oriented-educalion"}],"award":"","library_refs":[],"checked":"2026-10-31"}],"mechanisms":["生成式AI","视觉识别","语音与语言","隔空／姿态","生物信号","多模态通道","实物交互","传感与规则","触控","AI机制待核"],"mechanism_note":"多模态通道表示多个输入或反馈通道；不自动等于多模态融合模型。隔空／姿态、触控、生物信号分别标记。传感与规则也包括用于对照的非AI案例。","priorities":[{"title":"校园日常探究终端","scenes":["SC06","SC12"],"cases":["EC14","EC23"],"question":"学生能否从一次短暂停留产生自己的问题，并在离开后继续探索？","reason":"实体终端、空间、同伴和追问形成完整的交互问题，贴近日常校园教育。"},{"title":"实物实验中的AI引导","scenes":["SC02"],"cases":["EC05","EC06","EC08"],"question":"怎样在学生卡住时提供足够的提示，同时保留动手试错和解释的机会？","reason":"有明确任务、反馈与失败状态，可跨小学科学、初中物理到高中工程比较。"},{"title":"体育与音乐中的身体反馈","scenes":["SC04"],"cases":["EC09","EC10","EC11"],"question":"不同身体条件的学生能否看懂识别状态、修正动作并自主完成练习？","reason":"直接连接课程中的手势、多模态与可供性，适合展厅开展具体交互测试。"}],"stages":[["小学","用可见的对象、动作与状态帮助理解；先验证读写能力、身高与同伴使用。","EC14","EC05","EC23","EC16"],["初中","支持比较、实验控制与小组协作，逐步解释数据与模型限制。","EC06","EC07","EC24","EC09"],["高中","可比较开放工程项目、证据解释、伦理判断与更自主的任务管理。","EC08","EC04","EC03","EC11"]],"field_sequence":["选择一个真实任务，先让初次使用者尝试。","记录进入、输入、识别、反馈、修正和退出。","加入一个边界情况：噪声、遮挡、错误样本、旧数据或临时变更。","问清模型做了什么、规则做了什么、哪些结果由人确认。","要求给出适用年级、版本配置、部署学校与可查看的原始证据。"],"boundaries":["案例用于研究比较，不表示它们都参展。已确认本届参展的企业，也不能据此断言每款产品或每个模块到场。","“官方定位”和“本次学段映射”分别记录；小学四年级以上、13+等限制在对应产品内保留。","设计概念、实际装置、商用产品与厂家学校案例分别标注；获奖不代表临床、教育成效或量产认证。","本页不把AI情绪标签、学习画像或安防预警作为心理诊断、品行判断或处分依据。","iF部分详情页本轮直接访问返回403，已核对奖项官网搜索索引中的作品说明，保留原链接；功能仍需现场或进一步资料核验。"]},"six_directions_20261031":{"as_of":"2026-10-31","title":"六方向：核心文献与企业产品","scope":"小学到高中；第六类按你确认的声、光、力、磁等学科现象可视化检索。","thesis":"沿产品中的具体活动找文献：心理表达与真人支持、音乐反馈与创作、身体练习、作业提示、课堂协作、现象操纵与解释。","selection":"精选24篇期刊论文：中文核心与国际SSCI／SCIE分列。含22条本轮新整理文献及原库P06、P09的2条复用；不把会议、学位论文、预印本或公司文章计入。","evidence_rule":"论文能支持的范围取决于研究对象、版本、方法与测量。企业产品大多作为机制对照；明确标记的历史直接研究，也不自动覆盖今天的新版本。","source_note":"基于原刊全文／摘要、作者机构题录、PubMed及Crossref元数据核对；未读到的付费全文不声称已读。网页访问受限与AI能力待核在对应记录内保留。","papers":[{"id":"SL01","group":"SD01","doi":"10.5498/wjp.123904","title":"Feasibility of human-in-the-loop multimodal generative artificial intelligence chatbot for school-based adolescent mental health support","title_cn":"校园人类参与式多模态GenAI心理支持的可行性","journal":"World Journal of Psychiatry","authors":["Fan, Xi-Wang","Lin, Ting-Yu","Wang, Ming-Hao","Wu, Li-Cheng","Chen, Xin-Xi","Chen, Jun-Yao","Wu, Yi-Zhen","Zheng, Yu","Li, Tang","Du, Hao","Wang, Yao-Xuan","Wang, Yu-Jie","Zhang, Jing-Wen","Huang, Li-Wei","Fan, Tian-Ze","Liu, Bing","Liu, Jie","Sun, Pei","Zhao, Hui","Ma, Guo-Lin","Cheng, Qiang","Li, Shi-Jun"],"year":2026,"year_label":"2026","volume":"16","issue":"10","pages":"","scope":"直接中小学","method":"中国某初中62名学生，2周、非随机等待名单对照试点；研究系统Duoduo。","finding":"支持在工作人员监督下实施的可行性；论文明确主要目的不是检验治疗疗效。","design":"看低门槛表达、输入与反馈通道、授权人员查看、提示转交和线下跟进如何衔接。","limit":"单校、小样本、非随机、短期；有系统开发企业参与。不能外推四家品牌或无人值守使用的效果。","url":"https://www.wjgnet.com/2220-3206/full/v16/i10/123904.htm","extra_links":[],"checked":"2026-10-31","reuse_id":"","access":"原刊开放全文、方法和利益冲突声明可读","index":"SSCI／SCIE国际期刊"},{"id":"SL02","group":"SD01","doi":"10.1097/CIN.0000000000001349","title":"Examining the Efficacy of Large Language Models for Mitigating Depression and Anxiety Among Chinese Students: A Randomized Controlled Trial","title_cn":"WarmGPT缓解中国中学生抑郁与焦虑：随机试验","journal":"CIN: Computers, Informatics, Nursing","authors":["Ye, Xindong","Shan, Xiaofen","Tu, Yunfang","Zhang, Yuanyuan"],"year":2025,"year_label":"2025","volume":"43","issue":"9","pages":"","scope":"直接中小学","method":"40名中国中学生，2周随机试验；WarmGPT对话与心理教育视频比较。","finding":"作者报告干预组短期情绪量表结果优于视频组，提供受控心理对话的初步证据。","design":"可以研究对话任务、学生理解、使用负担和与教师支持的配合。","limit":"样本很小，长期和跨校效果未由该研究确认；不是朗心、抱抱兔或其他品牌的独立验证。","url":"https://pubmed.ncbi.nlm.nih.gov/40704906/","extra_links":[],"checked":"2026-10-31","reuse_id":"","access":"PubMed摘要与原刊入口；本页不声称读到付费全文","index":"SSCI／SCIE国际期刊"},{"id":"SL03","group":"SD01","doi":"10.1001/jamapediatrics.2026.3904","title":"Affective Generative Artificial Intelligence Use and Youth Mental Health","title_cn":"青少年情感性GenAI使用与心理健康的关联","journal":"JAMA Pediatrics","authors":["Bonnesen, Kamilla","Krygsman, Amanda","Hobson, Sarah","Korczak, Daphne","Vaillancourt, Tracy"],"year":2026,"year_label":"2026","volume":"","issue":"","pages":"","scope":"直接中小学","method":"加拿大4—12年级39,761名学生的横断面调查，2026在线发表。","finding":"寻求AI情感支持与更多情绪问题相关，说明“经常聊天”不能直接当作健康改善指标。","design":"把支持质量、真人联系与求助可达性放入评价，不以对话时长和黏性作为唯一成功指标。","limit":"相关性研究不能说明AI造成情绪问题，也不 、怎样协作、老师怎样协调？","change":"把空间硬件、课堂连接与AI功能分开，重点研究教师编排与师生协作。","priority":["SL17","SL18","SL19"],"firms":["SF21","SF22","SF23"],"focus":["广播、分组、共同编辑与回到全班的流程。","教师、学生与AI的发言和控制权限。","设备切换、断连与注意力成本。"],"gap":"极域已核到智慧教室与管理产品；不能仅凭多屏或智能命名确认其AI模型。理论与传统设备研究用于交互对照。","query_cn":"(智慧教室 OR 多屏互动 OR 人机协同教学) AND (中小学 OR 课堂互动 OR 协作学习) AND (交互 OR 教学编排 OR 人工智能)","query_en":"(\"smart classroom\" OR \"classroom orchestration\" OR \"multi-display\") AND (\"K-12\" OR \"school classroom\") AND (interaction OR collaboration OR AI)","test":"做一次个人作答→小组展示→全班讲评，并模拟设备断连，记录教师操作与等待。"},{"id":"SD06","title":"学科现象可视化：声、光、力、磁","question":"怎样让学生操作不可见的关系，并解释现象、图像和现实之间的对应？","change":"按你已确认的范围研究物理现象；重点是可操纵变量、动态表征和具身实验。","priority":["SL21","SL22","SL23"],"firms":["SF24","SF25","SF26","SF27"],"focus":["控制变量、预测、观察和解释的完整过程。","颜色、矢量、波形和空间映射是否可理解。","虚拟与真实实验的联系、模型边界与误解。"],"gap":"本类保留非AI仿真与传感产品作为直接参考。若加入AI，需要另验证它对提问、变量选择和解释的增益。","query_cn":"(交互仿真 OR 可视化 OR 增强现实 OR 具身交互) AND (声学 OR 光学 OR 力学 OR 电磁学 OR 科学教育) AND (中小学 OR 高中 OR 概念理解)","query_en":"(simulation* OR \"augmented reality\" OR \"embodied interaction\") AND (physics OR electromagnetism OR optics OR sound) AND (\"secondary education\" OR \"middle school\" OR \"high school\")","test":"让学生先预测，再改变一个变量、观察并解释；最后换成现实实验或另一种表征。"}],"index_sources":[{"title":"体育学CSSCI来源期刊目录（2025—2026）","kind":"高校公开目录","url":"https://tyjxb.czu.cn/2025/1011/c4609a163535/page.htm","note":"列有上海体育大学学报；与原刊平台题录共同核查。"},{"title":"中文：电化教育研究","kind":"CSSCI／中文核心","url":"https://aver.nwnu.edu.cn/Index/ArticleChannelList.do?id=111830","note":"按期刊官方标识；原刊论文与作者机构公开PDF可对应核查。"},{"title":"中文：上海体育大学学报","kind":"CSSCI／北大核心","url":"https://styb.cbpt.cnki.net/portal/journal/portal/client/paper/60e4d479b944e23cf94d8afa5df866e9","note":"原刊平台与期刊介绍核查。研究作者来自大学，不代表研究使用者为大学生。"},{"title":"国际：Web of Science Master Journal List","kind":"SSCI／SCIE检索入口","url":"https://mjl.clarivate.com/home","note":"用期刊英文全名或ISSN查收录；国际期刊与国内中文核心口径分列，不以影响因子或知网可检索代替收录。"},{"title":"World Journal of Psychiatry官方收录","kind":"SCIE","url":"https://www.wj 严重披露不继续生成式对话；退出和数据修改的具体界面仍需演示。","task":"用“考试前紧张”走完一次技能练习，记录最终是否得到可执行的小任务，而非只收到安慰。","limit":"自助支持不是诊疗服务；官网功能与学校实际服务配置、地区权限应分开。","links":[{"label":"适用年级与AI边界","url":"https://www.alongside.care/faq"},{"label":"官方监督与设计说明","url":"https://www.alongside.care/ai-safety-and-ethics"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF06","name":"Duoduo研究原型","entity":"论文团队；不是已确认的商业公司","group":"SD01","products":[{"name":"Duoduo多模态校园心理支持研究系统","url":"https://www.wjgnet.com/2220-3206/full/v16/i10/123904.htm"}],"stage":"原文为学校青少年场景；不外推小学适用性","mode":"多模态生成式对话＋人工监督","status":"研究原型，非商用品","fact":"研究报告的是有工作人员参与的校园多模态生成式对话系统与实施流程；它不能作为独立量产品牌或采购型号。","loop":["学生参与研究系统对话","多模态代理与结构化提示","系统响应与工作人员复核","人工监督构成研究实施的一部分"],"analysis":"可研究“AI初步回应—工作人员复核”的服务分工，但原型的研究条件、人工投入不能从商用产品对比中抹去。","affordance":"H1状态可见：若把它作为设计参考，应让学生知道当前由AI还是工作人员处理；论文不是成品界面可用性证据。","control":"人工监督是系统条件，不应改写成无人值守心理咨询。","task":"根据论文流程画出AI与工作人员的交接节点，用于对照展厅产品是否公开同样清楚的服务分工。","limit":"未找到独立产品官网、在售SKU或商业部署支持页。保留为研究参照，不能计作“已找到一家公司”。","links":[{"label":"研究系统与实施方法原文","url":"https://www.wjgnet.com/2220-3206/full/v16/i10/123904.htm"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF07","name":"金三惠","entity":"北京金三惠科技有限公司","group":"SD02","products":[{"name":"数字音乐教学系统","url":"https://www.jinsanhui.com/jsp/productPresentation/musicTeachSystem.jsp"},{"name":"智能电钢琴WP-1018S","url":"https://www.jinsanhui.com/jsp/productPresentation/piano_1018S.jsp"}],"stage":"中小学音乐教学；硬件高度与课程需具体匹配","mode":"AI教唱＋演奏与乐谱可视化","status":"官网具体产品","fact":"教学系统公开AI模拟人声教唱、歌唱／乐理／演奏与师生互动；WP-1018S公开88键逐级配重键盘、43.8英寸触屏等配置。","loop":["键盘演奏／在屏幕选择乐谱与教学任务","AI教唱；教学软件处理音乐学习任务","听觉示范、曲谱／键盘对应与练习结果","教师选曲、讲解与组织班级练习"],"analysis":"硬件把屏幕、琴键和声音放在同一操作空间，值得观察视线是否在谱面与手指间过度往返。AI教唱偏向提供可听示范，不能替代对学生演奏过程的具体反馈。","affordance":"自然映射：同一音符在谱面、琴键、声音间应有清楚对应；H6要求初学者能读懂高亮含义。","control":"H7：可验证减速、分句／循环练习与教师接管等操作；未公开的课堂控制能力不直接写成已具备。","task":"选一小节，让学生先听示范再弹奏，观察错误究竟标在哪个音符，以及能否只重练该片段。","limit":"WP-1018S是官网具体型号，不代表最新一代或2026长沙实际展出配置。AI教唱与AI演奏评测是不同能力。","links":[{"label":"教学系统功能原文","url":"https://www.jinsanhui.com/jsp/productPresentation/musicTeachSystem.jsp"},{"label":"WP-1018S完整参数","url":"https://www.jinsanhui.com/jsp/productPresentation/piano_1018S.jsp"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF08","name":"行者AI美育","entity":"成都潜在人工智能科技有限公司","group":"SD02","products":[{"name":"AI音乐创作系统","url":"https://edu.xingzheai.cn/product-center/2"},{"name":"AI音乐评测系统","url":"https://edu.xingzheai.cn/product-center/1"},{"name":"AI音乐一体机","url":"https://edu.xingzheai.cn/solutions/2"}],"stage":"官网贴合K12教材；课堂与校园课余体验均有方案","mode":"音乐生成＋旋律图形输入＋声音评测","status":"官网具体产品","fact":"创作支持歌词引导、风格／情绪标签和旋律线；一体机支持触屏创作、视唱练耳及音乐百科。评测支持键盘和语音输入，反馈准确率、星级与评语。","loop":["输入歌词／标签、绘制旋律线或唱奏","生成歌词、旋律、伴奏；评测节奏与音高","可听作品、可视旋律与评测结果","学生修改创作条件，教师组织评价与分享"],"analysis":"它把创作选择变成可操控对象：修改一段旋律或歌词后立即试听。设计研究应看学生能否解释自己的选择，而非把“一键生成完整歌”当作学习完成。","affordance":"H2自然映射：旋律线高低应与听到的音高对应；建议把可改部分、生成部分和学生贡献显性区分。","control":"H3：已有交互式作词与推荐修改功能；局部重生成、版本对比和撤销是否可用需进一步演示。","task":"用同一句古诗，分别画上行／下行旋律并试听；再让AI只修改一处歌词，比较创作控制是否足够细。","limit":"键盘和语音是多种输入通道，不能仅据此断言模型进行了跨模态联合推理。","links":[{"label":"创作系统","url":"https://edu.xingzheai.cn/product-center/2"},{"label":"评测系统","url":"https://edu.xingzheai.cn/product-center/1"},{"label":"一体机交互方式","url":"https://edu.xingzheai.cn/solutions/2"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF09","name":"ROLI","entity":"ROLI音乐硬件与学习生态","group":"SD02","products":[{"name":"Airwave创作版","url":"https://roli.com/us/product/airwave-create"},{"name":"Airwave学习体验","url":"https://roli.com/us/experience/airwave-learn"},{"name":"AI Music Coach（beta）","url":"https://roli.com/us/campaign/ai-music-coach"}],"stage":"音乐学习交互参照；非某一学段学校专用教材","mode":"隔空手部追踪＋键盘输入＋对话指导","status":"官网硬件；AI教练为beta","fact":"Airwave红外摄像头跟踪每只手27个关节，官网称90帧／秒；创作版用空中动作控制音乐。学习版显示手指与演奏反馈，AI教练beta结合手部追踪、语音交互和教学内容。","loop":["弹键盘、在琴上方移动手／自然语言提问","视觉追踪＋空间映射；beta教练给出练习指导","声音变化、屏幕手部视图与指法／节奏反馈","学生继续尝试、改变动作或提问"],"analysis":"这是比“挥手翻页”更值得研究的手势案例：动作连续改变声音，用户能边听边微调。学习模式还把看不见的指法过程外显出来；创作控制与教学纠错须分开比较。","affordance":"可发现性：空气中没有实体按钮，屏幕手部位置、可识别范围和声音变化就承担示标与反馈。H1要求丢失追踪时有明确状态。","control":"H3：校准、暂停追踪与回到正常弹奏是应验证的控制点；AI教练beta的账号、硬件与平台限制按官方说明。","task":"做相同的抬手动作两次，并在镜头边缘重复，观察参数映射是否连续、是否有追踪丢失提示。","limit":"90fps是摄像追踪参数，不等于系统总响应延迟。AI Music Coach公开为beta，不能描述成所有平台已全面正式开放。","links":[{"label":"创作版硬件及规格","url":"https://roli.com/us/product/airwave-create"},{"label":"学习版交互","url":"https://roli.com/us/experience/airwave-learn"},{"label":"AI教练beta与限制","url":"https://roli.com/us/campaign/ai-music-coach"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF10","name":"MakeMusic Cloud","entity":"MakeMusic；平台原名SmartMusic","group":"SD02","products":[{"name":"MakeMusic Cloud Practice","url":"https://www.makemusic.com/practice/"},{"name":"演奏、练习与容错设置","url":"https://help.makemusic.com/hc/en-us/articles/360026213774-Playing-and-Practicing-Music"}],"stage":"学校器乐／声乐练习；难度与曲目由教师选择","mode":"声音识别评测＋乐谱反馈","status":"官网具体产品","fact":"演奏后对照乐谱获得音高／节奏反馈；官方手册提供伴奏、节拍器、循环、容错等级及色觉友好显示等设置。","loop":["唱奏并由麦克风采集","按乐谱及所设容错标准分析演奏","在谱面定位错误；录音回听与重练","教师／学习者设置练习条件与要求"],"analysis":"它的智能交互价值是把“错了”定位到谱面和时间，而不是只输出总分。容错等级使同一任务能适配不同练习阶段，适合比较过度苛刻反馈与学习动机。","affordance":"H2与可达性：音符级反馈易对应动作，但不能只用红绿区分；官网已有色觉友好显示设置。","control":"官方可设置评测容错、循环与速度等；课堂噪声或麦克风问题仍应与学生真实错误区分。","task":"同一段演奏切换严格／宽松容错，观察标记与建议如何变化，再加入背景噪声检查错误归因。","limit":"声学评测不是生成式AI对话；教师仍应判断表现力、风格和创作意图，不能仅凭音符准确度替代。","links":[{"label":"官方练习功能","url":"https://www.makemusic.com/practice/"},{"label":"2026练习与容错手册","url":"https://help.makemusic.com/hc/en-us/articles/360026213774-Playing-and-Practicing-Music"},{"label":"更名关系原文","url":"https://www.makemusic.com/SmartMusic/"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF11","name":"一视科技","entity":"安徽一视科技有限公司","group":"SD03","products":[{"name":"全学龄AI教学屏X1 · X1","url":"http://www.yishikj.cn/qxl-aijxpx1"},{"name":"普教全场景AI智慧操场 · 整体方案，非单一型号","url":"http://www.yishikj.cn/ai_zhcc"}],"stage":"官网全学龄；本次取小学、初中、高中场景；普教中小学；覆盖小学至高中体育场景","mode":"视觉识别＋运动反馈","status":"官网具体产品","fact":"官网图示为高清显示屏与AI摄像头集成，覆盖体育互动教学、测评与数据应用；界面图可见跳绳计数、仰卧起坐违规提示、立定跳远分阶段动作分析；基于摄像头与运动视觉算法改造操场及体育空间；服务科学化训练、个性化教学、规模化测试和数据记录","loop":["举手进入测试／跳绳、仰卧起坐、跳远","摄像头识别动作、计数和测评","实时成绩、违规提示、分阶段动作图","教师组织教学；异常成绩复核待演示"],"analysis":"X1不是仅把计数放上大屏：官网图示把动作分段、违规提示与成绩放在同一任务中，学生有机会知道“哪里没做到”。举手在此是启动测试动作，不等于通用隔空遥控。","affordance":"可供性与H1：学生需要看见摄像范围、本人是否被跟踪、是否已开始计时；多人模式还需要稳定的身份与位置对应。","control":"H9纠错：应能区分动作不达标与遮挡／漏识别；建议提供成绩复核而非让学生无理由重做。","task":"让两名学生交换站位并故意遮挡一次；观察计数、身份与违规提示是否能解释及恢复。","limit":"X1页主要为图片；举手和违规反馈已对照官网原图。屏幕英寸、接口与防护等级未公开。","links":[{"label":"公司介绍","url":"http://www.yishikj.cn/about"},{"label":"产品首页","url":"http://www.yishikj.cn/"}],"tier":"核心27","cp":["CP16","CP17"],"named":true,"checked":"2026-11-01"},{"id":"SF12","name":"科大讯飞智慧教育","entity":"科大讯飞教育业务；与一视为不同企业","group":"SD03","products":[{"name":"智慧体育：AI测练机、跑步杆与平台","url":"https://edu.iflytek.com/solution/school/physical-education"},{"name":"AI科学实验室","url":"https://edu.iflytek.com/solution/school/ai-science-education"},{"name":"星光超级智能体","url":"https://edu.iflytek.com/solution/school/sparklight"}],"stage":"官网含小学、初中、高中应用；产品按学校配置","mode":"视觉运动测评；语音／数据驱动教学","status":"官网具体方案与设备","fact":"智慧体育方案将AI测练机、跑步杆、手环与数据平台组合，覆盖教学、练习和测评；科学实验室与课堂智能体另有独立产品页。","loop":["学生运动／使用传感器或提出学习问题","按体育、实验、授课模块分别识别与分析","成绩／运动记录、实验数据或教学内容","教师选任务、查看过程并组织训练"],"analysis":"应把个人动作反馈与班级教学数据分开分析：学生需要当下知道怎么调整，教师需要看到谁在哪个环节需要帮助。学校级大屏并不自动产生可执行的学生反馈。","affordance":"H1与空间可供性：运动设备要标清测试区、识别状态和动作起止，实验设备要让真实操作和曲线变化对应。","control":"H9：复核误识别、补测和更换设备的流程应实测；当前方案页不等于所有组合都标配。","task":"用同一项跳绳任务对比一视和讯飞，固定人数、时长、遮挡条件与结果复核步骤。","limit":"跨产品线共同品牌不代表数据一定打通；不要把视觉计数、实验采集和大模型问答写成单一模型。","links":[{"label":"官方产品、机制与跨学段案例","url":"https://edu.iflytek.com/solution/school/physical-education"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF13","name":"HomeCourt","entity":"HomeCourt篮球／体育训练应用","group":"SD03","products":[{"name":"HomeCourt","url":"https://www.homecourt.ai/"},{"name":"HomeCourt PE Curriculum","url":"https://www.homecourt.ai/hcpe"}],"stage":"官网提供体育教师课程；可用于中小学课堂和课外训练","mode":"手机摄像头视觉识别＋运动游戏","statu "核心27","cp":["CP28","CP31"],"named":true,"checked":"2026-11-01"},{"id":"SF17","name":"ASSISTments","entity":"ASSISTments非营利教育组织","group":"SD04","products":[{"name":"ASSISTments作业与形成性评价","url":"https://www.assistments.org/"},{"name":"AI Methods & Approaches","url":"https://www.assistments.org/ai-methods-and-approaches"}],"stage":"学校数学作业与课堂形成性评价；具体年级依课程","mode":"即时提示＋教师数据解读AI","status":"官网具体产品；AI功能逐项部署","fact":"学生作业中获得即时反馈与提示，教师查看作业数据；官方AI说明包括汇总班级误区、建议下一步教学，并强调教师决定行动。","loop":["教师布置课程内练习／学生作答","系统反馈；AI辅助解释班级学习数据","提示、错误信息与教师数据视图","教师决定讲评、再教或分组"],"analysis":"重点是把反馈放在学生卡住的那一步，并把整班信息变成教师可以采取的行动。历史系统研究与2026新AI功能的效果证据应分别看。","affordance":"H6与渐进提示：学生应能看见当前提示针对哪一步，并主动选择是否继续查看，避免一次性暴露答案。","control":"官方原则是AI提供洞察、教师驱动行动；具体报告和学生AI功能的可用范围要按学校版本核对。","task":"先用一道常见误概念题收集错误，再查看教师端是否能定位共性原因并发起下一次教学动作。","limit":"不是所有历史ASSISTments提示都由生成式AI实时生成；新功能正在逐项引入。","links":[{"label":"具体产品","url":"https://www.assistments.org/"},{"label":"官方AI功能与边界","url":"https://www.assistments.org/ai-methods-and-approaches"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF18","name":"Khan Academy／Khanmigo","entity":"Khan Academy非营利教育组织","group":"SD04","products":[{"name":"Khanmigo教师助手／学生辅导","url":"https://www.khanmigo.ai/"}],"stage":"中小学课程比较；学生端账户／地区／学校接入条件另按官方FAQ","mode":"生成式对话＋任务引导","status":"官网具体产品","fact":"官网区分教师助手、学校应用和写作工具；学生辅导强调用提问与提示引导思考，教师端支持备课与教学任务。","loop":["学生陈述问题或教师输入备课任务","结合学习任务生成引导与内容","追问、提示、草稿或学习总结","学生继续推理；教师审核采用"],"analysis":"它适合对照赶考AI费曼：一个关注帮助学生往下想，一个关注学生能否把已学内容说清。两者都应检验学生的思路是否真的成为AI下一步回应的依据。","affordance":"H2：对话应显示“当前讨论哪一步”，避免上下文漂移后仍给出流畅但无关的答案。","control":"H3：应可要求换一种解释、减少提示或回到题目；学校监督和权限应看当前方案。","task":"同一道题先说错误思路，再换一种合理但非标准的解法，观察回应能否随过程变化。","limit":"教师免费工具与学生访问权限不同；不能把通用问答演示当成已验证的全学段个性化辅导效果。","links":[{"label":"官方产品、适用对象与FAQ","url":"https://www.khanmigo.ai/"},{"label":"2026使用与证据讨论","url":"https://blog.khanacademy.org/learning-in-the-open-what-ai-is-and-isnt-changing/"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF19","name":"Carnegie Learning", :false,"checked":"2026-11-01"},{"id":"SF21","name":"极域／Mythware","entity":"南京极域信息科技有限公司","group":"SD05","products":[{"name":"极域CLASSHUB · 产品系列名CLASSHUB；官网未给出统一数字SKU","url":"https://www.mythware.net/#/classhub"},{"name":"极域互动反馈系统／互动反馈器 · 官网未给出数字型号","url":"https://www.mythware.net/#/feedback"},{"name":"极域智能语音训练系统 · 官网产品名；未公开统一版本号","url":"https://www.mythware.net/#/product-system"}],"stage":"中小学常态教室、实验课、分组协作教室；中小学课堂即时反馈；按题型与握持尺度适配；官网针对新高考；含中高考口语题型","mode":"多屏协作＋实体反馈＋语音评测","status":"官网具体产品","fact":"连接电脑、手机、平板等终端，调用学生端、分组屏与摄像机画面；支持2／3／4画面布局、远程课堂、录播直播及批量集控；支持选择、判断、算术等无线作答、举手、分组竞赛与持续学情统计；弧面握持、实体按键；配U盘大小接收器；个人、双人对话、小组等听说训练；覆盖朗读、复述、看图说话、角色扮演；音频智能语句切分、口语训练录音与多维评测","loop":["终端投屏／按键作答／录制口语","信号路由与统计；智能语音评测","多画面、答题分布、口语评测与录音","教师选择展示对象、分组、回听与讲评"],"analysis":"CLASSHUB主要改变内容在谁的屏幕上出现；反馈器降低全班作答门槛；智能语音训练才有明确的语音评测算法。三者解决的问题不同，不能合称一个AI教室功能。","affordance":"实体可供性与映射：反馈器的按键对应选项，投屏主机需要让内容源与目标屏清楚对应；学生应知道提交是否成功。","control":"H1／H3：建议明确当前广播范围、停止共享与取消误选；语音评分应保留录音供教师复核，官网已列回听／分享功能。","task":"临时把一组学生作品投到主屏，再收回；同时用一道多选／判断题观察反馈器提交状态。","limit":"AI功能以厂商公开说明为限；交互改进项是本次分析，未作实机可用性结论。","links":[{"label":"中文官网","url":"https://www.mythware.net/"},{"label":"英文官网","url":"https://www.mythware.com/"}],"tier":"核心27","cp":["CP33","CP34","CP35"],"named":true,"checked":"2026-11-01"},{"id":"SF22","name":"希沃／seewo","entity":"广州视睿电子科技有限公司","group":"SD05","products":[{"name":"AI授课助手","url":"https://help.seewo.com/easiscreenpercep/CUTu5MxHYm"},{"name":"课堂智能反馈AI助手","url":"https://help.seewo.com/edulyse/B7sO5Dlx2i"}],"stage":"多学科中小学授课与教师课后反思","mode":"视觉识别／内容转化＋课堂数据智能体","status":"官方操作手册","fact":"授课助手进入白板、展台、PPT等入口，可识别图形／公式并生成交互模型；课堂反馈AI助手在报告中查询数据、分析附件和生成文档。","loop":["教师圈选板书／试题或向报告提问","识别转化；多个智能体查询课堂数据","标准模型、练习／互动内容与分析回答","教师修改任务、选择采用及回溯数据"],"analysis":"核心价值是减少离开当前教学情境的操作：在板书旁处理对象，在课堂报告里追问证据。前者是授课中的短任务，后者是课后反思，界面节奏应不同。","affordance":"H1与对象对应：识别前后的图形需可比较；报告结论应能指向哪段数据，而不只给一段流畅文字。","control":"H3／H9：核查保留原板书、重选对象、纠正识别和撤销转化；未在手册明确的操作应实机验证。","task":"给一张含潦草公式的板书，让老师只选其中一题并改正识别；再追问报告一条结论的来源。","limit":"图形转模型有具体适用范围；“智能体”描述来自厂商手册，不等于已独立证明推理或教学效果。","links":[{"label":"官方AI授课助手手册","url":"https://help.seewo.com/easiscreenpercep/CUTu5MxHYm"},{"label":"2026课堂反馈AI助手手册","url":"https://help.seewo.com/edulyse/B7sO5Dlx2i"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF23","name":"SMART Technologies","entity":"SMART；Lumio与SMART Board生态","group":"SD05","products":[{"name":"Lumio＋AI Assist","url":"https://www.smarttech.com/en-gb/lumio/why-lumio/how-lumio-works"}],"stage":"中小学课堂协作；浏览器终端与互动屏均可参与","mode":"AI生成教学活动＋跨屏协作","status":"官网具体产品与支持页","fact":"导入PDF／幻灯片，AI Assist生成测验或课程；学生通过浏览器参与协作白板、提问、测验等活动，教师可切换统一节奏与学生自定节奏。","loop":["教师导入内容／提示；学生书写作答","AI生成活动，平台组织同步协作","共享作品、测验和活动看板","教师切换节奏、选活动与再分配"],"analysis":"值得看的是从静态课件变成“全班可操作对象”的转换，而不只是生成更多课件。教师控制节奏与学生参与权需要清楚可见。","affordance":"H1与协作可供性：学生需要知道正在编辑个人副本、小组区域还是全班共享页，避免误改同伴内容。","control":"官网支持教师／学生节奏切换；AI生成内容仍需教师确认，协作对象权限和恢复方式需体验。","task":"将一页旧PPT改为小组任务，测试教师统一讲解后转为各组独立操作需要几步。","limit":"Lumio是软件平台，不等同每一款SMART Board硬件；触控协作也不证明存在隔空手势。","links":[{"label":"官方课堂协作与AI Assist","url":"https://www.smarttech.com/en-gb/lumio/why-lumio/how-lumio-works"},{"label":"官方支持与兼容范围","url":"https://support.smarttech.com/docs/software/lumio/en/about/about-lumio.cshtml"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF24","name":"NOBOOK","entity":"中小学仿真实验平台；翼鸥官网产品生态列示","group":"SD06","products":[{"name":"NOBOOK中小学虚拟实验","url":"https://www.nobook.com/index.html"},{"name":"ClassIn虚拟实验工具入口","url":"https://www.eeo.cn/cn/classin"}],"stage":"官网定位中小学科学及理化生；按模块对照小学至高中","mode":"直接操作＋学科仿真；AI功能未逐项核清","status":"官网平台；模块需演示","fact":"平台定位中小学仿真实验，ClassIn工具列表包含NOBOOK虚拟实验；当前公开入口不足以确认每个实验的AI指导能力。","loop":["操作虚拟器材／改变条件","按仿真模型计算","动画、量值或图形变化","学生预测、重置并改变变量"],"analysis":"此类产品的设计重点是“能做实验”而非观看动画：学生是否能改变变量、看到因果关系，并用不同条件反证自己的解释。AI讲解属于另一层，不能取代直接操作。","affordance":"可供性与映射：可拖动、可连接、可调参数应有清楚提示；建议让无效连接暴露原因而非无反应。","control":"H3：重置和回到上一步是重要实验控制；是否能保存对照条件需要按具体模块确认。","task":"要求演示一个声／光／力／磁实验，学生先预测再改一个变量，观察是否支持并排比较结果。","limit":"不把研究团队所在高校当作用户学段；不把仿真本身自动归为AI。","links":[{"label":"NOBOOK官方入口","url":"https://www.nobook.com/index.html"},{"label":"翼鸥生态中的具体入口","url":"https://www.eeo.cn/cn/classin"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF25","name":"PhET Interactive Simulations","entity":"科罗拉多大学博尔德分校的公益教育项目；非公司","group":"SD06","products":[{"name":"Wave Interference／声与波","url":"https://phet.colorado.edu/en/simulations/wave-interference"},{"name":"Bending Light／光折射","url":"https://phet.colorado.edu/en/simulations/bending-light"},{"name":"Magnets and Electromagnets／磁场","url":"https://phet.colorado.edu/en/simulations/magnets-and-electromagnets"}],"stage":"按课程选择小学、初中、高中模块；本次不研究大学课程","mode":"可调变量＋物理仿真；非AI","status":"非AI交互对照","fact":"可直接操作波源、介质、光线、磁体及线圈等对象，把波、折射与磁场等不可见过程转为可探索的视觉变化。","loop":["拖动对象／调节变量","物理模型即时计算","波形、光路、场线与测量显示","学生重置、比较并解释"],"analysis":"即使没有AI，它仍是智能交互选题的重要对照：当变量与结果映射足够直接，学习者可以主动试错。如果加入AI，应帮助提出可验证问题，而非替学生解释所有现象。","affordance":"直接操控与H1：操作对象和反馈同屏；读数、场线等表征应可按任务开启，避免全部信息同时挤入。","control":"重置／再试是实验控制的一部分；可用具体仿真检查键盘与辅助功能，不笼统推断全部模块一致。","task":"先遮住解释，让学生猜磁体移动后场线怎样变化，再操作检验，并描述哪项图形支持其判断。","limit":"PhET不是商业AI品牌；“大学开发”不意味着所列产品是大学课堂专用。","links":[{"label":"声／波：Wave Interference","url":"https://phet.colorado.edu/en/simulations/wave-interference"},{"label":"光：Bending Light","url":"https://phet.colorado.edu/en/simulations/bending-light"},{"label":"力：Forces and Motion Basics","url":"https://phet.colorado.edu/en/simulations/forces-and-motion-basics"},{"label":"磁：Magnets and Electromagnets","url":"https://phet.colorado.edu/en/simulations/magnets-and-electromagnets"},{"label":"电场：Charges and Fields","url":"https://phet.colorado.edu/en/simulations/charges-and-fields"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF26","name":"PASCO","entity":"PASCO科学教育设备与软件","group":"SD06","products":[{"name":"MatchGraph＋运动传感器","url":"https://www.pasco.com/downloads/matchgraph"},{"name":"Graph Matching实验","url":"https://www.pasco.com/resources/lab-experiments/1037"}],"stage":"中学物理／高中运动图像教学；低龄需教师调整任务","mode":"身体／物体运动采集＋实时图像","status":"非AI交互对照","fact":"学生利用运动传感器把自己的运动转成图像，再尝试匹配目标曲线，分析位置—时间或速度—时间关系。","loop":["学生前进／后退或移动物体","传感器测量运动","实时曲线与目标曲线对照","学生调整运动并重试"],"analysis":"身体直接成为输入装置，曲线成为动作的另一种表达。它比单独讲解抽象坐标更容易形成动作—图像—解释之间的对应，适合研究具身交互。","affordance":"自然映射：让传感器朝向、测量零点和图中正方向清楚一致；否则学生可能把坐标约定误认为自己做错了。","control":"H9：连接、测量范围和信号中断应与“曲线没匹配上”区分，避免只给低分。","task":"请学生用身体走出一条分段位置曲线，再让同伴仅看曲线复现动作，观察能否互相解释。","limit":"这是传感与可视化，不应写成AI识别全身动作；软件版本与支持传感器需按官网兼容清单。","links":[{"label":"官方MatchGraph机制","url":"https://www.pasco.com/downloads/matchgraph"},{"label":"高中图像匹配实验原页","url":"https://www.pasco.com/resources/lab-experiments/1037"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"SF27","name":"Vernier","entity":"Vernier Science Education","group":"SD06","products":[{"name":"Go Direct Sound Sensor（GDX-SND）","url":"https://www.vernier.com/manuals/GDX-SND"},{"name":"Graphical Analysis配套使用说明","url":"https://www.vernier.com/manuals/GDX-SND"}],"stage":"主要用于中学／高中声学；小学可简化为声音强弱探索","mode":"声音传感＋波形与声级可视化","status":"非AI交互对照","fact":"声音传感器经USB／蓝牙与软件连接，可观察波形、频率、振幅和声级；手册列有测声速、隔声与室内声学等活动。","loop":["发声／改变声源或材料","传感器采样并计算声学量","波形、频率与分贝等图表","学生调整条件并对照测量"],"analysis":"它把“听起来高／响”的主观经验连接到可测量的频率／振幅，研究重点是学生能否区分这两个变量，而不只是看到漂亮波形。","affordance":"H1与表征映射：显示当前通道、单位和采样状态；手册中的连接LED是硬件状态示标，但不能替代软件数据状态。","control":"H5／H9：未连接、量程不合适与真实小信号应不同提示；是否可保存两次波形对比需按软件体验。","task":"同一音高分别轻声／大声，再换高低音，要求学生根据波形解释什么变了、什么没变。","limit":"声学测量不是音乐情绪理解；连接平台与数据通道按手册核对。","links":[{"label":"官方声音传感器与软件手册","url":"https://www.vernier.com/manuals/GDX-SND"}],"tier":"核心27","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX01","name":"优必选／UGOT","entity":"深圳市优必选科技股份有限公司","group":"SD05","products":[{"name":"UGOT多形态AI教育机器人","url":"https://www.ubtrobot.com/cn/ai-education/products/ugot"},{"name":"uKit AI","url":"https://ucode.ubtrobot.com/#/community/product-ukit"}],"stage":"中小学AI与编程项目；按课程及套件选择","mode":"可编程感知—判断—行动","status":"较早名单补核","fact":"官网教育产品含UGOT、uKit和Yanshee；UGOT以多形态搭建和AI机器人项目为学习载体。","loop":["学生搭建／编程并配置任务","摄像头等感知模块及程序决策","机器人行动与程序结果","学生修改程序与机械结构"],"analysis":"应研究学生能否看到机器人为什么这样动，而非只完成一次演示；程序状态和真实动作之间的可解释对应比拟人外观更关键。","affordance":"H1：传感器读数、当前程序和电机动作应能对应；搭接结构应提供朝向／接口示标。","control":"H3：暂停运动与重新运行是关键；具体AI模型及扩展件必须按套件配置确认。","task":"改变光线或遮挡目标，让学生定位是感知、程序还是机械搭建导致任务失败。","limit":"按官方可编程平台与套件核实功能，不能把所有演示能力默认属于标准包。","links":[{"label":"官方UGOT","url":"https://www.ubtrobot.com/cn/ai-education/products/ugot"},{"label":"官方教育产品体系","url":"https://www.ubtrobot.com/cn/ai-education"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX02","name":"Makeblock","entity":"童心制物／Makeblock","group":"SD05","products":[{"name":"mBot2／mBot Neo＋CyberPi","url":"https://www.makeblock.com/pages/mbot2-coding-robot"}],"stage":"小学高年级至中学编程对照；按项目难度选择","mode":"传感器＋程序控制；AI依软件／扩展","status":"较早名单补核","fact":"mBot2以CyberPi、编程环境及传感模块开展图形化／Python学习；AI相机是官网另列的配件产品，不能默认标准包都有视觉识别。","loop":["学生编写规则／让机器人感知环境","程序读取传感数据并决策","屏幕、灯光、声音及移动","学生调试并重新运行"],"analysis":"它适合研究从积木式程序到真实环境反馈的迁移。屏幕显示读数可帮助区分逻辑错误与传感器没读到。","affordance":"H9：建议在运行时高亮正在执行的步骤与读数，减轻学生靠猜调试的负担。","control":"停止、调速与回退到最小测试程序是应验证的调试控制。","task":"把避障阈值改两次，观察学生能否预测并解释机器人停止距离的变化。","limit":"图形化编程与自动循线本身不是生成式AI；云服务和配件的可用性需单独看。","links":[{"label":"官方mBot2具体产品","url":"https://www.makeblock.com/pages/mbot2-coding-robot"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX03","name":"鸿合科技／鸿合图灵","entity":"鸿合科技股份有限公司；北京鸿合图灵智能科技有限公司为相关产品主体","group":"SD05","products":[{"name":"AI智慧屏／Lesson+","url":"https://www.honghe-tech.com/index/CompanyNews/1102.html"},{"name":"裸眼3D全息一体机T2系列","url":"https://www.honghe-tech.com/index/CompanyNews/1102.html"}],"stage":"中小学通用教室与科学／理化生；其他学段方案另列","mode":"AI课堂数据＋裸眼3D／手势交互","status":"较早名单补核","fact":"官网2026年度报告解读列AI智慧屏、Lesson+和AI课堂分析；鸿合图灵有T2系列裸眼3D产品。早期公司披露支持手势识别，具体型号的手势能力须逐款确认。","loop":["教师操作课件／学生探索3D对象","课堂音视频分析或空间交互","教学内容／数据与三维显示","教师选任务、学生操控对象"],"analysis":"应比较3D是否支持有意义的变量探索，而非仅提升视觉效果。大屏课堂分析与桌面3D交互是不同任务，不能用一份AI介绍替两类产品背书。","affordance":"空间可供性：可抓取、旋转、拆解对象应有可见提示，识别范围与视点约束会影响小组协作。","control":"H3：确认误抓、复位、视角恢复及教师结束；不默认每台T2都有同一套手势软件。","task":"用磁场或几何剖切任务，让学生在无工作人员提示时改变一个条件并复位。","limit":"官网披露是产品证据；2024手势说明与2026具体T2配置不能自动视为完全相同。","links":[{"label":"公司2026产品披露","url":"https://www.honghe-tech.com/index/CompanyNews/1102.html"},{"label":"鸿合图灵主体介绍","url":"https://www.hvturing.com/CompIntro.html"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX04","name":"东方中科达","entity":"北京东方中科达科技有限公司","group":"SD06","products":[{"name":"智慧实验操作考评系统","url":"https://www.zhongkeda.com/h-col-122.html"}],"stage":"中学理化生实验操作与考试","mode":"多视角记录／操作过程考评","status":"较早名单补核","fact":"官网列实验考题、考试组织、评分等模块，区分管理与考务角色；具体AI自动评分步骤与机位须按设备配置确认。","loop":["学生实际操作实验器材","摄像记录／考试流程与考评规则","操作记录、评分与管理数据","教师／考务复核"],"analysis":"设计重点是让过程反馈回到具体动作和证据，而非把实验操作变成只看得分。相机、桌面器材和学生身体的遮挡会直接影响证据完整性。","affordance":"H1：清楚区分准备、正式记录、提交与待复核；实验开始前的状态提示应不打断安全操作。","control":"H9：应能回看争议步骤；自动评分与人工确认的边界需要明确演示。","task":"选一个易被手遮住的操作，检查录制视角和教师复核时能否定位该步骤。","limit":"考试管理平台本身不证明AI能识别所有实验步骤，不用厂商名称替代具体评分模型证据。","links":[{"label":"官方具体系统","url":"https://www.zhongkeda.com/h-col-122.html"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX05","name":"华文众合","entity":"北京华文众合科技有限公司","group":"SD04","products":[{"name":"第9代智慧书法教室","url":"https://ceiea.com/html/202604/202604201355473479.shtml"},{"name":"软笔书法AI智能评价软件HW-AiEVAL V2.0（采购配置）","url":"https://gongyi.zfcg.henan.gov.cn/cmsweb81e27e/nas/webfile2024/zhengzhou/rootfiles/2025/07/16/f9678a78cd0b44ccaf8524dab317f41c.pdf"}],"stage":"小学至高中书法教学；不将高校采购当作中小学效果证据","mode":"笔尖跟踪＋作品视觉评价","status":"较早名单补核","fact":"教装会刊描述笔尖跟踪示范与AI评价；政府采购参数明确HW-AiEVAL V2.0，含作业收取、多字评价及同字／笔画多次练习趋势。","loop":["教师书写示范／学生提交纸上书法","笔尖跟踪或作品图像分析","细节示范、字／笔画反馈与变化曲线","教师讲评与学生有针对性地再写"],"analysis":"应区分过程指导与成品评价：写完后指出结构问题，未必能解释运笔的原因。把教师笔尖细节与学生作品反馈放在一起，才可能支持动作改进。","affordance":"H2：评价应能落到具体笔画与可执行改法；只有分数或排名时，学生仍不知道下一笔怎么做。","control":"H9：临帖风格、纸面歪斜和图像质量造成的误判应可由教师复核。","task":"对同一字改变一笔，让系统比较并给改法；再检查能否回看对应示范片段。","limit":"软件版本来自历史采购参数；不保证2026所有第9代套装都配置相同模块。","links":[{"label":"教育装备行业产品报道","url":"https://ceiea.com/html/202604/202604201355473479.shtml"},{"label":"政府采购型号与功能","url":"ht ,"checked":"2026-11-01"},{"id":"EX08","name":"MagicSchool","entity":"MagicSchool教师／学生AI工具","group":"SD04","products":[{"name":"Class Writing Feedback","url":"https://www.magicschool.ai/blog-posts/whats-new-june-2026"}],"stage":"小学；初中；高中；平台面向K–12教师；具体班级工具与访问范围由学校配置。","mode":"AI写作反馈＋教师审核","status":"较早名单补核","fact":"写作反馈接入量规、课堂作业平台和OneDrive，并提供优势、待发展部分与后续练习建议。","loop":["教师导入作文与评分规准","AI按规准生成反馈","教师可查看、选择并导出反馈","教师确认交还学生"],"analysis":"对照云痕可看出不同切入点：它从已有LMS写作任务进入，让评价规准成为AI的约束条件。关键是反馈能否回到学生可以修改的具体句段。","affordance":"H2：原文、规准和建议之间应可定位；不应让教师在多个文件中来回找依据。","control":"2026更新列规准编辑、反馈类型选择和PDF导出；教师确认是必须关注的交互环节。","task":"同一篇作文用两套规准生成反馈，检查评价重点是否对应规准，并让教师删除一条不适用建议。","limit":"流程集成与反馈生成不等于评分可靠；中国语文、课程和账号环境须另行验证。","links":[{"label":"2026-06写作反馈与学校配置更新","url":"https://www.magicschool.ai/blog-posts/whats-new-june-2026"},{"label":"使用、学生监督与隐私说明","url":"https://www.magicschool.ai/faq"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX09","name":"MatataStudio／matatalab","entity":"MatataStudio／玛塔创想产品生态","group":"SD05","products":[{"name":"Nous AI Set＋MatataCode","url":"https://matatalab.com/en/node/960"}],"stage":"小学；初中；高中；厂家课程面向儿童编程与AI学习；小学图形化、初高中文本编程为研究映射。","mode":"视觉／语音模型＋实体机器人编程","status":"较早名单补核","fact":"提供图形化及文本编程，结合扩展件与AI模型开展项目；学生可连接实体设备观察程序结果。","loop":["学生连接Nous Hub／Camera／Servo并编程","模型识别与程序决策","舵机／机器人动作与程序结果","学生调试模型输入和执行逻辑"],"analysis":"智能学习对象既是算法也是实体装置。重要的是学生能否分清识别模型给出的结果与自己编写的动作规则，避免把失败笼统归为“机器人不聪明”。","affordance":"H1：输入画面、识别类别和舵机状态应可对应显示；接口应标出方向与功能。","control":"暂停执行、查看读数和最小测试程序应成为可发现的调试入口。","task":"只改变摄像头输入而不改程序，观察学生能否解释机器人动作为什么变化。","limit":"不是所有基础积木或预设动作都涉及AI；配置、联网与相机权限需现场核对。","links":[{"label":"厂家课程及编程平台说明","url":"https://matatalab.com/en/node/960"},{"label":"iF官方设计档案","url":"https://ifdesign.com/en/winner-ranking/project/nous-ai-set/622486"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX10","name":"NeuroMaker／BrainCo","entity":"红点档案列浙江强脑科技深圳分支；课程品牌NeuroMaker","group":"SD05","products":[{"name":"NeuroMaker HAND 2.0＋BioSensor Kit","url":"https://www.neuromakerstem.com/curriculums"}],"stage":"初中；高中；厂家课程列中学与高中标准对齐；高阶项目需教师指导。","mode":"肌电／弯曲传感＋可编程机械手","status":"较早名单补核","fact":"红点档案明确结合AI、EMG传感器与个性化编程，让学生设计与测试教学假肢方案。","loop":["佩戴／使用生物信号传感器或弯曲手套","采集信号并以课程程序映射动作","机械手关节动作","学生校准、编程并比较不同方案"],"analysis":"它让身体信号变成可操控机械动作的材料，适合研究“我想动”和“机器实际动”之间的学习与调试。肌电与5个弯曲传感器手套是不同课程路径，不能混成一种无穿戴手势技术。","affordance":"自然映射：关节和手指对应关系应清楚；校准期间要让学生看见自己的信号变化。","control":"H9：区分电极接触、信号阈值与程序问题；应有安全停止与回到校准入口。","task":"两名学生轮流使用同一控制方案，比较是否需要重新校准以及能否理解校准原因。","limit":"本套件的EMG是肌电，不能写成脑电读心；教学假肢也不能等同临床装配设备。","links":[{"label":"Red Dot官方获奖页","url":"https://www.red-dot.org/project/neuromaker-hand-and-biosensor-kit-69712"},{"label":"厂家中学／高中课程","url":"https://www.neuromakerstem.com/curriculums"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX11","name":"Microsoft Education","entity":"微软教育学习加速器","group":"SD04","products":[{"name":"Reading Coach","url":"https://support.microsoft.com/en-au/education/learning-accelerators/getting-started-with-reading-coach"},{"name":"Reading Progress","url":"https://support.microsoft.com/en-us/education/learning-accelerators/getting-started-with-reading-progress-in-teams"}],"stage":"小学；初中；高中；面向需要朗读流利度练习的学习者与教师；高中可作语言学习支持，不代表所有高中生都需要基础练习。","mode":"语音识别＋个性化阅读练习","status":"较早名单补核","fact":"Reading Coach提供AI故事与针对性词语练习；Reading Progress把朗读录音、错误标记和教师复核接入作业。","loop":["学生朗读并提交录音","系统估计朗读错误／生成针对性内容","词语练习、标记与教师回听","教师复核Reading Progress的自动标记"],"analysis":"它把声音反馈定位到具体词语，再安排练习。对照单纯口语总分，更适合分析“看到哪里错—听见自己怎么读—再读一次”的反馈流程。","affordance":"H2：文本位置与录音时间应能关联；错误类别须能被学生和教师理解。","control":"Reading Progress支持教师检查自动检测结果；两产品的账户和数据可见性不能混用。","task":"用口音、停顿和自我纠正各录一次，观察系统如何标记，教师能否更正。","limit":"AI发音估计可能误判；当前语言、口音、地区与学校账号支持需验证。","links":[{"label":"Reading Coach官方入门","url":"https://support.microsoft.com/en-au/education/learning-accelerators/getting-started-with-reading-coach"},{"label":"Reading Progress与教师复核","url":"https://support.microsoft.com/en-us/education/learning-accelerators/getting-started-with-reading-progress-in-teams"},{"label":"学生数据可见性原文","url":"https://support.microsoft.com/en-us/education/learning-accelerators/learner-transparency-in-reading-coach-what-educators-can-see"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX12","name":"ClassDojo","entity":"ClassDojo家校与教师服务","group":"SD07","products":[{"name":"Sidekick教师AI助手","url":"https://ai.classdojo.com/"}],"stage":"小学；初中；高中；教师平台覆盖学校；2026新师生消息功能限13岁以上且学校启用，不能向低龄儿童照搬。","mode":"生成式教师工具与沟通草稿","status":"较早名单补核","fact":"Sidekick协助教师拟教案、材料和消息；学校端提供消息自动翻译，2026增加面向年长学生的界面与受控沟通。","loop":["教师输入教学／沟通需求","AI生成教案、材料或消息草稿","可供教师审阅的文字内容","教师修改后决定使用／发送"],"analysis":"它的交互对象主要是教师工作，不是学生能力判断。设计价值在已有家校情境中组织草稿，避免教师反复向AI交代背景。","affordance":"H1：草稿与已发送应有明显区别；H3应保留编辑与放弃，不能把生成当成发送。","control":"是否支持直接发出、保存版本和预览应看具体工具；本研究未执行发送动作。","task":"生成同一条给不同年级家长的说明，比较语气和信息是否可编辑且保留事实。","limit":"积分不能直接解释品德；消息自动翻译不证明所有语言与方言都准确。","links":[{"label":"Sidekick官方AI能力","url":"https://ai.classdojo.com/"},{"label":"2026家校与13+功能","url":"https://www.classdojo.com/teachers/"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX13","name":"Pikmykid","entity":"Pikmykid校园接送与管理","group":"SD07","products":[{"name":"Pulse AI","url":"https://www.pikmykid.com/solutions/pulse-ai"}],"stage":"小学；初中；高中；官方明确K–12；已核实小学学区使用接送应用，但不能据此推断该学区已启用Pulse AI。","mode":"自然语言查业务数据＋接送流程","status":"较早名单补核","fact":"Pulse以问答查询考勤、学生状态与放学记录；接送应用支持家长到达通知和授权接送人。","loop":["管理者查询／家长更新接送安排","查询考勤、接送与学生状态记录","回答、状态列表与提醒","人员确认接送与业务操作"],"analysis":"应研究AI回答能否回到具体记录与时间戳；“告诉我有几人坐校车”和“批准谁接走孩子”是不同权限的任务。","affordance":"H1与错误防护：用时间、数据来源和操作状态避免把过期回答当实时事实。","control":"问答不应自动等同授权变更；关键业务需可查看原记录与人工确认。","task":"更改一次模拟接送计划，再追问人数，检查回答是否引用更新后的记录。","limit":"官网没有证明AI可以替学校自主决定放人；数据汇聚也不自动等于学生心理或品行画像。","links":[{"label":"Pulse AI官方产品与问答示例","url":"https://www.pikmykid.com/solutions/pulse-ai"},{"label":"家长接送与授权说明","url":"https://pikmykid.freshdesk.com/support/solutions/articles/8000114560-pikmykid-parent-app-faq"},{"label":"小学学区实际使用说明","url":"https://www.cccsd.org/departments/information-technology/pikmykid-app"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX14","name":"BusPatrol","entity":"BusPatrol校车安全服务","group":"SD07","products":[{"name":"AVA＋停车臂摄像系统","url":"https://buspatrol.com/technology/"}],"stage":"小学；初中；高中；面向学校校车乘员与管理者；美国场景，不能照搬其执法规则。","mode":"视觉事件识别＋人工证据复核","status":"较早名单补核","fact":"校车停靠且停车臂展开时，视觉系统捕捉疑似违规超车，结合定位与视频形成待审核证据。","loop":["校车停靠／停车臂展开与车辆经过","摄像头与AVA筛选疑似事件","视频、定位与候选证据","人员复核与后续处理"],"analysis":"这是校园安全的后台智能流程，学生不是主要操作者。设计应关注审核员能否快速判断证据完整性，不把AI筛选结果直接表现成最终事实。","affordance":"H1：候选事件、待核实、已确认等状态应分清；时间与画面要保持对应。","control":"人工复核是核心，不把自动检测写成自动执法裁决。","task":"用一段视线被遮挡的候选事件检查审核界面能否定位不确定之处。","limit":"这是出行安全产品，不是课堂学习工具；不引用厂商准确率作为独立验证。","links":[{"label":"官方AI机制与交互式校车演示","url":"https://buspatrol.com/technology/"},{"label":"工作流程原文","url":"https://buspatrol.com/stop-arm-overview/"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX15","name":"itc","entity":"itc校园音视频与安全系统","group":"SD07","products":[{"name":"校园防霸凌求助系统","url":"https://www.itc-audio.cn/news-knowledge-fangbaning.html"}],"stage":"小学；初中；高中；校园公共求助与值班管理；不同年龄的求助表达、语言和可及性须分别测试。","mode":"语音关键词识别＋按键／对讲","status":"较早名单补核","fact":"系统通过求助关键词、报警按键与对讲，将预警推送到控制中心及移动端，供人员查看和处置。","loop":["学生说求助关键词或按报警键","关键词触发与告警路由","控制中心／移动端提示与对讲","工作人员确认并介入"],"analysis":"智能识别的价值是让学生在不便触达设备时仍能求助，但按键和语音必须互相补充。设计不应把报警成功只表现为后台收到通知。","affordance":"H1：学生需要知道求助已送达、是否有人接听；同时应避免公开播报暴露求助者。此为设计评价。","control":"H9：误触发与未接听应有处理流程；该系统不能识别一切欺凌或心理状态。","task":"用正常吵闹与明确求助两类录音演示，观察触发、学生反馈与人工响应链路。","limit":"关键词或冲突动作不能直接证明欺凌意图；厂商没有在该页给出独立误报、漏报研究。","links":[{"label":"官方系统组成与触发方式","url":"https://www.itc-audio.cn/news-knowledge-fangbaning.html"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX16","name":"Airthings","entity":"Airthings环境传感；UCLA Lab School为儿童学校案例","group":"SD06","products":[{"name":"Airthings IAQ传感器＋数据看板","url":"https://www.airthings.com/business/resources/ucla-teaching-environmental-awareness"}],"stage":"小学；UCLA Lab School是学前至六年级的实验小学，不是以大学生为使用者的项目。","mode":"真实环境感知＋可视化；非AI对照","status":"较早名单补核","fact":"学生读取空气质量数据，提出问题、制作海报、测试人员离开教室等假设，并向同伴解释。","loop":["学生读空气数据并改变环境条件","传感器测量CO₂等环境量","实时看板与前后曲线","学生提出解释、采取行动与分享"],"analysis":"该案例把校园日常环境变成探究材料。学生用人员离开等简单实验检验假设，学习发生在“观察—行动—再观察”的循环中。","affordance":"自然映射：把数值与开窗、人数变化等情境关联；单位和时间范围需对儿童可理解。","control":"不把CO₂数值当作个人注意力或健康诊断；本案例没有证明依赖AI。","task":"提出“人员离开后CO₂会怎样”的预测，记录曲线并讨论其他可能因素。","limit":"厂家案例不证明因果学习效果；不能将CO₂读数直接当作注意力或智力分数。","links":[{"label":"2026学校项目原文","url":"https://www.airthings.com/business/resources/ucla-teaching-environmental-awareness"},{"label":"学校官方年级／年龄说明","url":"https://www.labschool.ucla.edu/about/at-a-glance"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"},{"id":"EX17","name":"天翼云","entity":"天翼云科技有限公司及行业应用生态","group":"SD07","products":[{"name":"智慧食堂行业应用","url":"https://www.ctyun.cn/document/11096137/11099417"}],"stage":"小学；初中；高中；官网面向学校及监管部门；本页只比较中小学食堂业务，不涉及高校消费场景。","mode":"视觉异常识别＋整改业务流程","status":"较早名单补核","fact":"用AI视频识别后厨异常，并组织预警、整改和复核；验收称重、留样、食谱和营养分析接入管理。","loop":["后厨视频／验收称重等数据","识别异常并组织预警","告警、整改与复核记录","学校／食堂人员处理闭环"],"analysis":"它属于校园管理延伸，不能混成课堂教学产品。若做食育选题，可借鉴真实食谱、浪费与供餐数据；后台监管指标不宜直接变成给儿童的学习界面。","affordance":"H1：告警应可定位到时间和证据，并显示是否已处理；避免重复告警使人员忽略。","control":"整改与复核依赖人员；AI视频识别与称重台账应分开判断。","task":"追踪一条模拟异常从出现到整改完成，记录谁能确认、谁能关闭。","limit":"平台功能不证明食物质量或营养效果；手册未证明它具有面向学生的AI营养对话。","links":[{"label":"官方产品手册（2026-10-23）","url":"https://www.ctyun.cn/document/11096137/11099417"},{"label":"政府公开的学校食堂AI应用实例","url":"https://fgw.huainan.gov.cn/msgcheng/gzdt/551861736.html"}],"tier":"延伸17","cp":[],"named":false,"checked":"2026-11-01"}],"theory_links":[{"label":"可供性与示标：Don Norman原文","url":"https://jnd.org/affordances-and-design/"},{"label":"触控／手势的机会与可发现性","url":"https://jnd.org/opportunities-and-challenges-for-touch-and-gesture-based-systems/"}],"skill_reference":"design-critique"},"education_focus_20261101":{"as_of":"2026-11-01","title":"第一题·教育重点板块：门类、产品与未来趋势","thesis":"教育中的智能交互，正在把部分延迟、抽象或难表达的学习活动变成可以感知、讨论和调整的过程。值得研究的未来，是系统怎样支持人的能力形成、参与和判断，而不只交付答案、分数或作品。","taxonomy_note":"本页按主要教育目标与实际任务构建工作分类，不是官方学科目录。9类学生学习与成长方向，另列教学组织／教师发展、校园治理两类教育支持。每款产品只有一个主门类，可有少量交叉用途。","quality_note":"“素质教育”是贯穿多个方向的理念，可覆盖艺术、体育、科学、社会情绪与AI素养，不与“心理健康”等具体门类硬并列。","horizon":"2026—2030条件性推演；不是普及率预测或产品效果承诺。","evidence_note":"产品功能沿用已核来源；本页新增的是教育分类、趋势对应与第一题推演。类别和对应关系为本次分析。历史、beta、原型与非AI对照仍分别标注。","original_question":"AI带来哪些传统行业变革？产生新场景与新物种？你知道还有哪些？未来会有哪些变化（10+）？","chain":["原有活动与限制","AI新增能力","流程与分工改变","新场景","新形态","未来及条件"],"assignment_link":"第一题总纲→教育重点→具体产品→未来推演","concepts":[{"id":"C01","name":"能力增强设计","question":"AI怎样降低参与门槛，同时支持人的技能和判断继续形成？"},{"id":"C02","name":"情境感知与自适应设计","question":"系统能否根据活动条件调整服务，减少用户反复说明和设置？"},{"id":"C03","name":"生成式共创","question":"AI怎样参与探索，人又在哪里提出标准、筛选和修订？"},{"id":"C04","name":"具身交互","question":"人的身体、实体对象和实际行动怎样进入智能系统的反馈过程？"},{"id":"C05","name":"服务化与系统设计","question":"AI怎样连接产品使用前后，以及不同参与者之间原本分散的环节？"}],"original_trends":[{"id":"ET01","title":"教师智能体进入完整工作流程"},{"id":"ET02","title":"学习过程反馈成为产品核心"},{"id":"ET03","title":"多模态反馈连接身体、声音与实体材料"},{"id":"ET04","title":"校园日常成为探究与AI素养的学习空间"},{"id":"ET05","title":"个性化服务需要学生参与和可修正记录"},{"id":"ET06","title":"校园AI连接业务数据与人工处置"}],"categories":[{"id":"ED01","title":"心理健康与社会情绪支持","subdomains":["情绪表达与自我调节","关系沟通与社会情绪练习","学校心理服务与专业支持"],"band":"学生学习与成长","goal":"帮助学生表达困扰、练习应对与沟通，并连接现实支持。","include":"心理对话、绘画表达、关系情境练习、学校心理服务管理。","exclude":"不把情绪识别等同诊断；有音乐或运动不一定属于美育／体育；本类不直接命名为临床疗愈。","trends":["T02","T05","T06","T08"],"chains":["EF01","EF02"],"before":"支持常依赖预约、短时量表或一次活动，学生表达困难与后续行动可能脱节。","change":"部分产品把日常表达入口、技能练习和教师跟进相连，专业人员的工作更多包括解释与例外处理。","opportunity":"设计“我想表达什么—系统怎样理解—我能否修正—怎样找人”的完整路径。","primary_count":18,"secondary_count":0},{"id":"ED02","title":"美育与艺术表达","subdomains":["音乐技能与视唱练耳","音乐共同创作与空间表达","书法与视觉艺术练习"],"band":"学生学习与成长","goal":"发展感知、表现、创作与审美判断，不只完成一件作品。","include":"教唱、演奏纠错、音乐生成与修改、书法示范与作品评价。","exclude":"音乐放松椅的主要目标是减压，不因含音乐就归此类；自动生成作品也不等于学生已获得创造能力。","trends":["T02","T03","T07"],"chains":["EF03","EF04"],"before":"示范、独立练习和教师点评在时间上分离，创作技术门槛较高。","change":"反馈可以进入演奏动作与素材修改，学生与AI分担生成、比较和修订。","opportunity":"保留学生选择和试听对比，让“为什么这样改”成为交互的一部分。","primary_count":12,"secondary_count":3},{"id":"ED03","title":"体育健康与运动技能","subdomains":["动作学习与技术改进","日常运动与体能练习","运动参与与身体体验"],"band":"学生学习与成长","goal":"支持安全参与、运动技能理解和持续练习。","include":"视觉运动测练、篮球训练、动作反馈与日常跑步。","exclude":"计数不是完整动作教学；心理减压单车不自动等于体育课程；不由体验装置推定康复疗效。","trends":["T02","T03","T05"],"chains":["EF05"],"before":"计数、测量依赖教师，过程细节难以同时覆盖全班。","change":"动作采集与个别反馈进入练习当时，教师可以围绕共性问题和个别困难组织教学。","opportunity":"让学生知道哪里没被识别、哪里动作不达标，以及下一次如何调整。","primary_count":6,"secondary_count":2},{"id":"ED04","title":"学科理解与个性化学习","subdomains":["数学等学科概念与解题","作业练习与分层支持","自主复习与学习路径"],"band":"学生学习与成长","goal":"帮助学生理解知识、解释思路并迁移使用。","include":"智能学伴、数学自适应练习、分层提示与知识点复习。","exclude":"批阅机与扫描仪主要支持教师流程，归教学支持并可交叉关联本类；做得快或分数高不等于真正学会。","trends":["T02","T05","T08"],"chains":["EF06","EF07"],"before":"统一内容与课后批改难以及时回应学生不同的卡点。","change":"根据解题过程或复述内容调整提示和练习，教师角色包含解释模型判断与安排再教。","opportunity":"把提示设计成学生可选择的支架，并逐步撤去，检验独立完成能力。","primary_count":12,"secondary_count":7},{"id":"ED05","title":"语言、阅读与沟通能力","subdomains":["朗读与阅读流利度","外语听说与发音","写作表达与反馈"],"band":"学生学习与成长","goal":"提升理解与表达能力，把声音或文本反馈变成可执行的练习。","include":"朗读纠错、口语评测、写作反馈、扫描词义与听读工具。","exclude":"不把所有语音交互产品都归语言教育；心理对话的目标通常是支持与表达困扰。","trends":["T02","T03","T05"],"chains":["EF08"],"before":"教师难以逐个反复听读、标注与给出针对性练习。","change":"反馈可定位到词、句、音频时间点，并安排再读或修改；教师复核仍关键。","opportunity":"将原文、录音、错误标记与修改入口关联，允许口音或识别误差被纠正。","primary_count":5,"secondary_count":3},{"id":"ED06","title":"科学探究与学科现象可视化","subdomains":["声、光、力、磁等物理现象","理化生实验与操作","地理空间与模型探索"],"band":"学生学习与成长","goal":"让学生预测、操作变量、观察证据、比较解释。","include":"虚拟实验、运动／声音传感器、AR地理沙盘与3D科学对象。","exclude":"可视化不必使用AI；能看见动画不等于能做实验，大学开发的项目也不等于大学专用。","trends":["T03","T04","T02"],"chains":["EF09","EF15"],"before":"抽象现象难以直接观察，器材与条件限制可重复试验。","change":"真实动作和虚拟变量可同步变为曲线、场线或模型；AI可作为提问与证据整理的后续支持。","opportunity":"把“只改一个变量、保留对照、重新解释”的操作做清楚，而非只加讲解按钮。","primary_count":13,"secondary_count":2},{"id":"ED07","title":"AI、编程与工程创造","subdomains":["机器人感知与控制","编程、调试与工程搭建","算法素养、偏见与责任"],"band":"学生学习与成长","goal":"让学生理解系统怎样感知、判断和行动，并能搭建、修改与评价。","include":"教育机器人、可编程机械手、算法素养沙盒与AI项目课程。", "EU48","EU49","EU51","EU53","EU55","EU56"]}],"chains":[{"id":"EF01","title":"心理支持从预约入口延伸到日常表达","categories":["ED01"],"trends":["T05","T06","T08"],"concepts":["C01","C02","C05"],"before":"以预约咨询和集中测评为比较基线，部分日常困扰难以及时表达与跟进。","capability":"对话生成、结构化技能引导、记录整理和人工支持连接；不是由表情直接诊断。","industry_change":"学校服务从一次问卷／谈话，部分延伸到日常表达、专业人员复核与后续支持。","scene":"学生在阅读区或心理空间主动表达困扰，结束后选择是否联系现实中的支持人员。","form":"学生服务入口＋技能练习＋专业支持形成连续服务。现有产品展示这一组合，但不是无人心理治疗。","future":{"signal":"新华小屋、朗心对话舱、Alongside提供不同的表达与支持入口。","next":"本次推演：更多产品可能提供短时支持及适当的人工交接，关注学生能否回到日常生活与人际连接。","conditions":"明确AI身份、记录可见性、退出与专业服务分工；需独立验证参与和支持效果。"},"test":"一次活动结束后，学生能否说出自己准备采取的一项行动，并知道如何继续找人。","units":["CP01","CP02","CP03","CP04","CP05","CP06","CP07","CP09","CP10","CP11","CP12","CP13","CP14","CP15","EU01","EU02","EU03"]},{"id":"EF02","title":"社会情绪教育从说教延伸到可重复情境练习","categories":["ED01"],"trends":["T02","T05"],"concepts":["C01","C02"],"before":"规则讲解与真实同伴冲突之间存在迁移距离，学生缺少低压力重试机会。","capability":"生成或组织角色情境，回应学生表达并提供下一种尝试。","industry_change":"支持内容可从“告诉学生应该怎么做”，延伸为围绕具体说法练习与反思。","scene":"学生在冲突、拒绝或求助情境里换角色，尝试不同表达，再与教师讨论。","form":"可反复尝试的沟通练习环境；不是把某个得分当作人格或道德判断。","future":{"signal":"抱抱兔关系破冰机定位为AI沟通实训；Alongside有日常技能路径。","next":"本次推演：未来可能更重视解释表达造成的影响，以及从模拟走向真实关系的迁移。","conditions":"情境需符合年龄与文化经验，允许不同合理表达，避免用单一答案裁定社会关系。"},"test":"学生能否在不看AI提示时，用自己的话解释另一种处理方式与理由。","units":["CP06","CP08","EU02"]},{"id":"EF03","title":"音乐与书法练习从结果扩展到动作与过程","categories":["ED02"],"trends":["T02","T03","T05"],"concepts":["C01","C04","C02"],"before":"教师不能一直在旁观察指法、节奏或运笔过程，学生独练时难以定位原因。","capability":"声音评测、手部追踪、笔尖示范与作品评价，使具体动作和错误位置进入反馈。","industry_change":"示范—练习—点评的等待缩短，教师可把时间用于解释难点和音乐表现。","scene":"学生练习一个音乐短句或书法字，回看标记与示范，改变动作后再试。","form":"乐器或纸笔＋感知＋可定位反馈组成练习环境；不同产品分别关注唱奏、指法、笔画和作品。","future":{"signal":"金三惠、MakeMusic、ROLI及华文众合提供不同练习反馈；ROLI教练为beta。","next":"本次推演：反馈可能更贴近动作原因并随水平减少提示，而非持续给更多评价。","conditions":"采集和评测需可靠；反馈不能遮蔽聆听、表现力、书写风格和教师判断。"},"test":"关闭视觉提示后演奏相似片段，或临写一个相似字，检查能否解释并迁移动作。","units":["CP31","EU04","EU05","EU07","EU08","EU10","EU11","EU12","EU38","EU39"]},{"id":"EF04","title":"美育创作从一键生成走向学生可操控的共创","categories":["ED02"],"trends":["T07","T03"],"concepts":["C03","C01","C04"],"before":"创作受作曲技术与制作门槛限制；一键生成又可能让学生跳过选择与修订。","capability":"按歌词、风格和旋律线生成候选，或让动作连续控制音乐表达。","industry_change":"创作工作可在学生提出意图、AI提供候选、学生比较与修改之间重新分配。","scene":"学生为古诗词画两种旋律，试听并说明选择，再改一个局部。","form":"可操控的创作工具，而非只交付一首完整成品；“新物种”判断来自使用关系的改变。","future":{"signal":"行者支持旋律线和歌词修改，ROLI创作版用空中动作改变音乐。","next":"本次推演：局部修改、版本对比与创作过程记录可能成为教育工具更重要的功能。","conditions":"保留学生真实决定与解释；成人创意研究仅作类比，仍需儿童创作学习证据。"},"test":"学生能否解释为什么修改，而不是只选“更好听”的自动结果。","units":["EU06","EU08","EU09"]},{"id":"EF05","title":"体育从集中测评延伸到日常动作学习","categories":["ED03"],"trends":["T02","T03","T05"],"concepts":["C04","C01","C02"],"before":"手工计数与集中体测占用教学时间，许多动作细节来不及反馈给每名学生。","capability":"摄像头识别、计数和动作阶段分析，联接练习记录。","industry_change":"部分测量工作交给系统，教师组织训练、解释错误与照顾差异。","scene":"学生在常态体育课或课余运动时完成短练习，现场理解一个改进点。","form":"动作感知的练习环境；计数设备只有在反馈能指导再练时才具有更强教学意义。","future":{"signal":"一视X1图示动作分段与违规提示；讯飞有体育设备体系；HomeCourt有PE课程。","next":"本次推演：产品可能从一次成绩转向进步轨迹与个别指导，并与课堂训练安排相连。","conditions":"要能区分动作问题与识别失败，适应不同身体条件，不以排行榜代替个体进步。"},"test":"学生看到反馈后是否知道怎么改，且能在下一次动作中作出相应调整。","units":["CP14","CP16","CP17","CP18","EU13","EU16","EU58"]},{"id":"EF06","title":"纸笔教学从批改工具扩展到可复核的教学工作站","categories":["ED04","ED10"],"trends":["T01","T02","T08"],"concepts":["C05","C01","C02"],"before":"纸笔作业、批改、学情统计和再练任务分散，教师反复录入或手工汇总。","capability":"OCR、大模型批阅、留痕输出与按学情分层任务相连。","industry_change":"教师从重复标注的一部分转向复核识别、解释错误与安排再教；纸笔习惯可继续保留。","scene":"一次真实作业从进纸、复核到订正与再练，不必先把课堂全部改成在线作答。","form":"纸笔连接的教学工作站＋学生学习终端；是否构成持续服务取决于数据与人员是否真正衔接。","future":{"signal":"云痕T40／X30、学伴机和扫描采集共同展示该路径。","next":"本次推演：教师可能更需要修改结果后同步更新后续任务，而不只是更快批完一叠纸。","conditions":"保留原笔迹和评分依据；更正必须传播到报告与任务，并验证教师工作量是否真的减少。"},"test":"故意引入一处OCR错误，检查更正后学情与后续练习是否同时变化。","units":["CP19","CP20","CP21","CP22","CP24","CP32"]},{"id":"EF07","title":"学科辅导从提供答案转向支持推理与迁移","categories":["ED04"],"trends":["T02","T05"],"concepts":["C01","C02"],"before":"统一解析或直接给答案，可能让学生当场会跟随却不能独立解决新问题。","capability":"识题、分层追问、复述分析、逐技能适配与针对性练习。","industry_change":"学习支持从最后的正确率向学生当前思路移动，教师帮助解释模型未理解的过程。","scene":"学生在做题时请求少量提示、解释自己的方法，再独立尝试一个变式。","form":"与任务上下文相连的学伴和练习系统；自适应不必等同生成式对话。","future":{"signal":"赶考AI费曼、Khanmigo、MATHia、ASSISTments和Snappet分别提供不同过程支持。","next":"本次推演：能否适时少提示、逐步撤去支持，可能比回答更长更快更重要。","conditions":"识别非标准合理解法；评价须包含撤去工具后的解释与迁移，而不只看工具内成绩。"},"test":"用两种不同思路解同一道题，检查提示是否对应过程，再做一题无AI的新题。","units":["CP21","CP22","CP23","CP28","CP29","CP32","CP34","EU17","EU18","EU19","EU20","EU21","EU22"]},{"id":"EF08","title":"语言反馈从总分延伸到词句级再练","categories":["ED05"],"trends":["T02","T03","T05"],"concepts":["C01","C02"],"before":"逐个听读与改写反馈成本高，总分难以告诉学生具体怎样改。","capability":"语音转写与错误估计、文本评价、定位回听和针对性词句练习。","industry_change":"系统承担部分重复定位工作，教师复核口音、语境与表达意图，学生参与修改。","scene":"朗读一个短文后，学生点击具体词听自己的录音，再读或改写。","form":"原文、声音、标记与再练相连的表达支持；不是只显示一张评测报告。","future":{"signal":"Reading Coach／Progress、极域语音训练与写作反馈工具提供不同入口。","next":"本次推演：产品可能更强调学生解释、回听与修正，以及教师对误识别的有效复核。","conditions":"语言和口音适配、明确数据用途，并避免把识别置信度当作学生能力。"},"test":"引入停顿、口音和自我纠正，观察反馈是否可回溯且可被教师更正。","units":["CP23","CP25","CP28","CP30","CP35","EU43","EU46","EU47"]},{"id":"EF09","title":"科学教育从看演示走向操控变量与证据比较","categories":["ED06"],"trends":["T03","T04","T02"],"concepts":["C04","C01"],"before":"抽象现象、器材条件和时间限制使学生难以反复尝试与形成对照。","capability":"已实现的基础是仿真、传感与可视化；AI可进一步辅助提问、整理数据与解释候选。","industry_change":"学生从观看者变为试验者，教师组织预测、变量控制和证据讨论。","scene":"身体走动生成曲线、发声生成波形、塑造地形观察等高线，或改变虚拟磁场条件。","form":"实体行动＋可变模型＋对照证据的探究环境；即使没有AI，也可能具有很强学习价值。","future":{"signal":"PASCO、Vernier、PhET、NOBOOK、地理AR与科学实验室提供具体交互机制。","next":"本次推演：AI更合适的下一步可能是帮助形成可检验问题，提示遗漏变量，而不直接代替实验解释。","conditions":"仿真边界、传感误差和真实现象要可区分；能保留、重置与比较不同条件。"},"test":"要求学生先预测，只改变一个变量，再用图像或测量证据支持或修改自己的解释。","units":["CP27","EU14","EU23","EU26","EU27","EU28","EU29","EU30","EU31","EU36","EU37","EU40","EU41","EU52"]},{"id":"EF10","title":"AI教育从使用工具走向理解和调试系统","categories":["ED07"],"trends":["T03","T04","T05"],"concepts":["C01","C04"],"before":"观看机器人演示或复制程序，容易掩盖数据、判断和执行之间的关系。","capability":"可编程感知与控制、模型配置、信号可视化，以及算法规则的可逆试验。","industry_change":"学生参与构建与质疑系统，教师从给步骤转向组织测试与讨论影响。","scene":"改变光线、输入数据或传感阈值，观察机器人动作和分类结果怎样变化。","form":"可调试的学习系统与算法沙盒；教育目标是理解AI，而不只获得AI帮助。","future":{"signal":"UGOT、mBot2、Nous、NeuroMaker与Most Likely Machine提供不同层次的系统学习。","next":"本次推演：数据选择、误判解释、公平与责任可能更多进入编程和工程课程。","conditions":"按年龄提供真实可理解的因果链，避免仅暴露复杂参数；技术与社会影响都需讨论。"},"test":"学生能否判断一次失败来自传感、模型、规则还是机械结构，并说明如何验证。","units":["EU32","EU33","EU34","EU44","EU45","EU57"]},{"id":"EF11","title":"融合支持从统一入口转向可选择的参与方式","categories":["ED08"],"trends":["T03","T05","T08"],"concepts":["C01","C02","C05"],"before":"统一速度、听觉通道和任务安排，可能使部分学生依赖持续提醒或漏掉讨论。","capability":"语音转写、实体任务顺序、可见进度及按需要切换的输入输出方式。","industry_change":"部分支持从成人代办转向让学生自己回看、重排、表达需求和修正记录。","scene":"学生在小组讨论中回看漏听文字，或用实体任务工具重排课后活动。","form":"可选择参与通道的学习辅具与任务支持；不必把所有困难转成诊断标签。","future":{"signal":"Hera为听障课堂概念，Routio为儿童任务组织设计；成熟度与临床证据均有限。","next":"本次推演：辅助功能可能更融入普通学习活动，同时让学生决定何时启用与分享。","conditions":"设备兼容、儿童参与设计、隐私与专业适配；概念获奖不能替代有效性和可用性验证。"},"test":"学生能否不依靠成人持续操作，独立回看、调整下一步或请求一次具体帮助。","units":["CP26","CP28","EU54","EU55"]},{"id":"EF12","title":"生活教育从设施使用转向学生参与环境与选择","categories":["ED09"],"trends":["T04","T05","T08"],"concepts":["C04","C05","C01"],"before":"食堂、环境监测与课程常相互分离，学生较少参与问题定义和行动评价。","capability":"传感数据和服务触点提供学习材料；AI不是现有食育或环境探究的必要条件。","industry_change":"校园生活可围绕学生的提问、行动、比较和向同伴解释重新组织。","scene":"学生比较教室人数变化与CO₂曲线，或参与食物来源、准备与分享活动。","form":"可探究的校园环境与生活服务；需要实际参与，而不是给后台监管界面换皮。","future":{"signal":"Airthings学校案例有学生数据探究；Time To Eat为食育服务愿景。","next":"本次推演：真实校园数据可能连接跨学科项目和生活选择，但不必都由AI自动建议。","conditions":"任务须年龄适配、数据解释可靠，并有能实际做的行动与反思时间。"},"test":"学生能否提出自己的假设、做出行动，并用前后证据说明结果与不确定性。","units":["EU52","EU56"]},{"id":"EF13","title":"教师工作从分散工具转向有证据的任务协作","categories":["ED10"],"trends":["T01","T08","T02"],"concepts":["C01","C05"],"before":"备课、课堂协作与反思分别发生在不同工具，教师反复复制材料与整理数据。","capability":"内容识别转化、生成活动、语音／视频摘要、面向课堂报告的数据查询。","industry_change":"AI承担部分整理与候选生成，教师制定目标、解释证据、审阅修改并决定行动。","scene":"教师在当前板书旁转换一个几何对象，课后针对课堂报告追问证据，再调整下一课。","form":"嵌入教学情境的教师协作平台；有对话框不等于能可靠执行整个教学流程。","future":{"signal":"希沃、ClassIn、Lumio、MagicSchool与Sidekick有不同的流程入口。","next":"本次推演：保存任务上下文、关联原始材料和可回退步骤，可能比再增加一个通用聊天 改变数据与规则理解算法，不要求该工具自身必须使用AI。","evidence_role":"研究或设计概念，仅作机制与形态线索","reference_matches":[{"id":"RT11","scope":"能力培养方向；学习效果需单独检验"},{"id":"RT12","scope":"解释与复核的设计要求"}]},{"id":"EU58","name":"YogAnimals · 交互瑜伽装置","maker":"YogAnimals","owners":["EC10"],"primary":"ED03","secondary":["ED02"],"subdomain":"身体动作与体验参与","trends":["T03","T02"],"chains":["EF05"],"concepts":["C01","C02","C04"],"classification_reason":"目标是姿态动作与参与体验；动画是反馈，不能据此推定运动或健康疗效。","signal":"用MediaPipe估计身体位置和关节角度，规则匹配姿态，再由TouchDesigner生成动物与植物动画。","url":"https://designawards.core77.com/Interaction/141766/YogAnimals-an-Interactive-Yoga-Installation","stage":"实际面向博物馆儿童体验；小学课间和初中体美活动是迁移比较，非已证实学校部署。","nature":"已实现互动装置／奖项收录","status":"已实现互动装置／奖项收录","intelligence":"AI姿态估计与规则判断配合；动画是反馈，不是自动证明健康效果。","links":[{"label":"Core77官方机制、展示与视频","url":"https://designawards.core77.com/Interaction/141766/YogAnimals-an-Interactive-Yoga-Installation"}],"cp_ref":null,"mapping_note":"门类与趋势对应为本次研究分类，不是厂商认证或普及率判断。","reference_trends":["RT03","RT09","RT11"],"reference_reason":"目标是姿态动作与参与体验；动画是反馈，不能据此推定运动或健康疗效。","evidence_role":"非AI或未需AI的交互对照，不作为AI采用证据","reference_matches":[{"id":"RT03","scope":"相邻／非AI对照，不证明AI趋势已实现"},{"id":"RT09","scope":"相邻／非AI对照，不证明AI趋势已实现"},{"id":"RT11","scope":"相邻／非AI对照，不证明AI趋势已实现"}]},{"id":"EU59","name":"Google Learning Interactives · 生成式学习交互研究","maker":"Google Research","owners":["REF-GOOGLE"],"primary":"ED06","secondary":["ED10","ED04"],"subdomain":"教师目标驱动的STEM互动探索","trends":["T01","T02","T04"],"chains":["EF15"],"concepts":["C01","C03","C05"],"classification_reason":"现有公开样例以初高中STEM交互仿真为主，教师目标审核与资源生成是交叉的教学支持任务。","signal":"教师提出并审核学习目标；系统生成挑战、可操作仿真、分层提示及反馈。当前是研究试点与教师审核样例，不是既有VR的简单重命名。","url":"https://research.google/blog/the-future-of-practice-enabling-teachers-to-create-learning-interactives-with-generative-ui/","stage":"官方公开样例重点为初中、高中STEM；未外推小学全学科","nature":"研究试点／教师审核样例","status":"2026年研究公开；非全面部署承诺","intelligence":"生成式UI；学习效果待持续评估","links":[{"label":"研究机制与试点原文","url":"https://research.google/blog/the-future-of-practice-enabling-teachers-to-create-learning-interactives-with-generative-ui/"}],"cp_ref":"","mapping_note":"从引用的第一题对话补入；不是原44个企业／项目的新增查全承诺。","reference_trends":["RT04","RT06","RT07","RT11","RT12"],"reference_reason":"教师审核目标后生成可操作的学习交互，是生成式UI的直接研究例证；不是传统VR或一次生成讲解文本。","evidence_role":"研究或设计概念，仅作机制与形态线索","reference_matches":[{"id":"RT04","scope":"有限协作流程；非完整自治代理证明"},{"id":"RT06","scope":"公开机制线索"},{"id":"RT07","scope":"按目标生成交互仿真；非通用世界模型"},{"id":"RT11","scope":"能力培养方向；学习效果需单独检验"},{"id":"RT12","scope":"解释与复核的设计要求"}]}],"forms":[{"id":"EM01","title":"过程反馈型练习环境","what":"乐器、运动或解题过程与感知和反馈相连，学生据此再试。","chains":["EF03","EF05","EF07","EF08"],"concepts":["C01","C02","C04"],"boundary":"有记录或评分只是基础；需要反馈真正改变学习行动。"},{"id":"EM02","title":"纸笔连接的教学工作站","what":"采集、复核、留痕与后续任务围绕真实纸笔作业组织。","chains":["EF06"],"concepts":["C05","C01"],"boundary":"多个设备放在同一方案中，不等于数据和工作流已无缝连通。"},{"id":"EM03","title":"可操控的艺术创作工具","what":"学生提出意图、控制部分材料，AI生成候选供比较与修改。","chains":["EF04"],"concepts":["C03","C01"],"boundary":"自动交付完整作品不必然构成共创，更不自动代表创造力成长。"},{"id":"EM04","title":"与专业人员相连的日常支持服务","what":"日常入口、练习与人员跟进组成连续服务。","chains":["EF01","EF02","EF11"],"concepts":["C05","C02"],"boundary":"心理和融合支持有专业条件，产品形态创新不等于临床效果。"},{"id":"EM05","title":"可探究的真实与虚拟环境","what":"身体、材料、生活数据或教师审核的交互仿真成为可改变、可比较的学习对象。","chains":["EF09","EF10","EF12","EF15"],"concepts":["C04","C01","C05"],"boundary":"许多优秀基础交互不依赖AI；加入AI需说明它具体帮助了哪项探究。"},{"id":"EM06","title":"教师与人员协作的任务平台","what":"内容、事件、出处与后续行动围绕实际任务相连，由人负责关键判断。","chains":["EF13","EF14"],"concepts":["C05","C01"],"boundary":"一个聊天框不等于自治智能体；应逐项验证执行、权限和恢复。"}],"exceptions":[{"title":"不按公司统一归类","example":"讯飞体育方案→ED03；AI科学实验室→ED06；星光教师智能体→ED10。","why":"同一企业服务不同学习目标和使用者。","units":["EU13","EU14","EU15"]},{"title":"不按“音乐”或“运动”字样归类","example":"音乐放松椅→ED01；心理减压单车→ED01，交叉ED03。","why":"判断主用途是放松支持、艺术学习还是动作技能。","units":["CP04","CP14"]},{"title":"不按硬件外形归类","example":"心理VR→ED01；地理VR→ED06；教学仿生手→ED07。","why":"头显、机器人、机械手不是教育目标。","units":["CP03","EU41","EU45"]},{"title":"教师助教与学生学伴分开","example":"T40／X30→ED10；S30／S10→ED04。","why":"前者主要组织教师工作，后者直接支持学生学科学习。","units":["CP19","CP20","CP21","CP22"]},{"title":"“使用AI”与“学习AI”分开","example":"赶考伴学→ED04；UGOT／Nous／算法沙盒→ED07。","why":"有AI帮助不等于学生理解了数据、模型和影响。","units":["CP28","EU32","EU44","EU57"]},{"title":"学生食育与后台监管分开","example":"Time To Eat→ED09；智慧食堂异常处理→ED11。","why":"学生要参与问题、选择和反思，才属于直接教育活动。","units":["EU56","EU53"]}],"sources":[{"id":"ES01","title":"《“人工智能+教育”行动计划》","org":"教育部等五部门","year":"2026","url":"https://www.nda.gov.cn/sjj/zwgk/tzgg/0410/20260410162428109058250_pc.html","kind":"教育政策","finding":"提出中小学AI素养、智能学伴、教师协同及教育治理等方向，强调人机协同、能力培养与人文关怀。","boundary":"政策目标说明建设方向，不证明本页任何产品已普及或有效。"},{"id":"ES02","title":"OECD Digital Education Outlook 2026","org":"OECD","year":"2026","url":"https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html","kind":"教育证据综合","finding":"区分借助AI完成任务的表现与学习者真正获得的能力，强调有教学原则指导的设计和使用。","boundary":"不能把综合证据泛化为每款中小学产品的因果效果；需检验撤去AI后的理解与迁移。"},{"id":"ES03","title":"AI competency framework for students","org":"UNESCO","year":"2024；页面更新2026","url":"https://www.unesco.org/en/articles/ai-competency-framework-students","kind":"学生能力框架","finding":"围绕以人为本、AI伦理、技术应用与系统设计，支持理解、应用、创造的进阶。","boundary":"不是小学、初中、高中的官方一一对应表；本页按具体任务安排学段。"},{"id":"ES04","title":"Guidance on AI and children · Version 3.0","org":"UNICEF Innocenti","year":"版本3","url":"https://www.unicef.org/innocenti/reports/policy-guidance-ai-children","kind":"儿童AI设计与治理指南","finding":"强调儿童发展、包容、透明解释、隐私与责任，支持把儿童作为能理解并参与的使用者。","boundary":"不为具体心理识别、治疗或监测算法背书；也不意味着所有儿童适用同一交互。"},{"id":"ES05","title":"iF Design Trend Report 2026 · 公开概要","org":"iF International Forum Design","year":"2026","url":"https://ifdesign.com/en/if-magazine/newsroom/if-design-trend-report-2026-key-design-trends-and-countertrends-shaping-innovation-ai-sustainability-and-future-cities-insights-for-designers-companies-and-strategists","kind":"设计趋势公开概要","finding":"延用第一题中技术便利与技能形成、算法与人的判断等设计视角。","boundary":"原总纲依据公开概要；本轮原页访问受限，未读取收费全文。不将其当作教育效果报告。"},{"id":"ES06","title":"TechnoVision 2026","org":"Capgemini","year":"2026","url":"https://www.capgemini.com/insights/research-library/technovision-2026/","kind":"跨行业技术前瞻","finding":"讨论数字、实体与生物技术的连接，以及系统协同与人的监督。","boundary":"用于解释实体交互与系统连接的方向，不是中小学教育实证或普及率统计。"},{"id":"ES07","title":"How AI is redistributing creative work","org":"Adobe","year":"2026","url":"https://www.adobe.com/ai/research/202606/ai-is-redistributing-creative-work.html","kind":"创意工作研究","finding":"观察AI如何参与构思与后期工作，并使人的选择和判断更突出。","boundary":"研究对象主要为成人创意工作者；迁移到美育属于本次类比，不能据此认定儿童创造力获得提升。"},{"id":"ES08","title":"Where the Action Is: The Foundations of Embodied Interaction","org":"Paul Dourish／MIT Press","year":"2004平装版","url":"https://mitpress.mit.edu/9780262541787/where-the-action-is/","kind":"交互理论基础","finding":"具身交互把行动、物品、社会实践与情境放在一起理解，不以是否配有机器人作为唯一标准。","boundary":"它不证明每种身体活动都有学习收益，也不能与机器人的具身智能直接画等号。"},{"id":"ES09","title":"RT-2: New model translates vision and language into action","org":"Google DeepMind","year":"2023","url":"https://deepmind.google/blog/rt-2-new-model-translates-vision-and-language-into-action/","kind":"物理智能研究机制","finding":"以视觉、语言与动作模型控制实体机器人，展示面向任务的感知—行动闭环。","boundary":"仅用于区分实体代理行动与人的手势输入；不是中小学教育效果证据，也不是具身智能的唯一学术定义。"},{"id":"ES10","title":"The future of practice: Enabling teachers to create learning interactives with generative UI","org":"Google Research","year":"2026-09-17","url":"https://research.google/blog/the-future-of-practice-enabling-teachers-to-create-learning-interactives-with-generative-ui/","kind":"初高中学习交互研究试点","finding":"教师提出并审核学习目标，AI生成带挑战、分层提示和反馈的交互仿真；公开样例面向初高中STEM。","boundary":"是研究试点与教师审核样例，不能扩写为全面正式部署或已证明长期学习效果。"},{"id":"ES11","title":"Genie 3: A new frontier for world models","org":"Google DeepMind","year":"2025","url":"https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/","kind":"生成式环境前沿研究","finding":"探索可接受行动并持续变化的生成环境，研究公开说明现实准确性等限制。","boundary":"不能把现有VR、3D或预设物理仿真直接称为世界模型；未作为已验证的中小学教学产品列入。"},{"id":"ES12","title":"Principles of Mixed-Initiative User Interfaces","org":"Eric Horvitz／Microsoft Research","year":"1999","url":"https://www.microsoft.com/en-us/research/publication/principles-mixed-initiative-user-interfaces/","kind":"人机协作研究基础","finding":"讨论直接操作与自动化代理怎样结合，由任务和不确定性组织主动权。","boundary":"理论关联不证明当前教育助手具备完整自主执行能力。"},{"id":"ES13","title":"Four Principles of Explainable Artificial Intelligence","org":"NIST","year":"2021","url":"https://www.nist.gov/publications/four-principles-explainable-artificial-intelligence","kind":"解释与能力边界原则","finding":"解释应有依据、对接收者有意义、忠实且说明知识边界。","boundary":"分数、过程记录和好听的解释都不能单独证明判断正确；本页将其作为设计要求。"},{"id":"ES14","title":"Designing Calm Technology","org":"Mark Weiser、John Seely Brown","year":"1995","url":"https://calmtech.com/papers/designing-calm-technology","kind":"注意力与技术理论","finding":"技术信息可以在注意力边缘与中心之间转换，减少不必要的持续关注。","boundary":"“平静”不等于隐藏采集与判断；具体提示时机仍需用户研究。"},{"id":"ES15","title":"Project Astra","org":"Google DeepMind","year":"研究项目公开页","url":"https://deepmind.google/models/project-astra/","kind":"多模态助手研究机制","finding":"结合视觉、声音与现场上下文探索帮助使用者完成任务。","boundary":"作为多模态技术参照，不是本页已部署的中小学产品。"}],"count_note":"95条是产品、型号、明确模块及对照案例的研究单元，不是95款互不重复的量产AI硬件。原9家36项与原44个企业／项目均保留；Google学习交互为引用对话补入的研究样例。","scope_note":"小学至高中为研究范围；概念作品与跨情境参照不假定已经在学校部署。这里的教育门类不等同于公司的主营分类。","reference_thread":{"thread_id":"01a1819e-4e78-7a41-930d-a096c590461f","host_id":"local","title":"调研教育交互设计趋势 (2)","final_turn_id":"01a18288-a4a7-7352-a805-9f85a6b3b1d9"},"reference_method":"直接回答是什么 → 用真实案例说明 → 从交互设计角度解释变化 → 提供证据","reference_note":"本次直接沿用所引用对话最后完成回答中的12条未来趋势原名；原教育6条趋势及本页8条细分仍保留。教育门类回答学什么，12条交互趋势回答交互怎样变，二者不在同一分类层级。","evidence_roles_note":"“公开机制线索”只说明功能已被来源描述；“设计要求”说明产品需要解决的问题；“相邻／非AI对照”不作为AI采用证据。所有未来判断均为条件性推演。","reference_trends":[{"id":"RT01","number":1,"title":"情境感知交互与平静技术","english":"Context-aware Interaction / Calm Technology","education_change":"感知当前活动，再决定是否和何时介入","boundary":"能感知不代表已经“平静”；提示时机是独立的设计判断。","evidence":["ES06","ES14"],"units":["CP16","CP28","EU11","EU16","EU24","EU49","EU50","EU51","EU52","EU53"],"featured":["CP28","CP16","EU11"],"future":"提示可能依据任务阶段与主动求助出现，而不是持续打断；是否更少打扰需真实活动验证。","origin":"引用对话最终回答·第1条，保留原名"},{"id":"RT02","number":2,"title":"多模态交互与信息融合","english":"Multimodal Interaction / Multimodal Fusion","education_change":"把语言、动作与现场对象关联，帮助理解同一学习任务","boundary":"多个输入口不自动等于模型融合；内部融合实现和准确性需另查。","evidence":["ES15"],"units":["CP11","CP12","EU11","EU14"],"featured":["EU11","CP11","EU14"],"future":"“这个步骤为什么不对”可关联眼前材料、动作和解释；要设计对象确认与歧义澄清。","origin":"引用对话最终回答·第2条，保留原名"},{"id":"RT03","number":3,"title":"具身与实体交互","english":"Embodied / Tangible Interaction","education_change":"把身体动作、实体材料和空间关系纳入操作与学习反馈","boundary":"人的具身交互不等于机器具身智能；动作存在也不证明概念已学会。","evidence":["ES08","ES09"],"units":["CP06","CP14","CP16","CP17","CP18","CP31","EU09","EU10","EU11","EU13","EU16","EU30","EU31","EU32","EU33","EU34","EU38","EU40","EU44","EU45","EU58"],"featured":["EU09","CP16","EU30","EU40","EU44"],"future":"过程反馈可能更多直接围绕人的动作和材料变化发生；具身智能另需实体代理的任务闭环证据。","origin":"引用对话最终回答·第3条，保留原名"},{"id":"RT04","number":4,"title":"人—智能体协作与混合主动权","english":"Human–Agent Interaction / Mixed-initiative Interaction","education_change":"人提出目标、检查建议并接管，AI承担部分分析和步骤","boundary":"聊天框、自动批改和完整自治代理是不同程度的实现。","evidence":["ES12","ES02"],"units":["CP19","CP25","CP28","EU06","EU08","EU15","EU17","EU18","EU23","EU24","EU25","EU43","EU47","EU48","EU59"],"featured":["EU24","CP28","CP19"],"future":"教师可能委托整理与生成，保留目标、采用、评价与异常处理；不能默认AI自动接管教学。","origin":"引用对话最终回答·第4条，保留原名"},{"id":"RT05","number":5,"title":"自适应交互","english":"Adaptive Interaction","education_change":"根据学习过程、技能状态和任务难度调整支持","boundary":"即时反馈、参数变化、记住偏好和训练模型不是同一种自适应。","evidence":["ES02","ES04"],"units":["CP07","CP21","CP22","CP23","CP28","CP29","CP35","EU02","EU07","EU10","EU11","EU12","EU17","EU18","EU19","EU20","EU21","EU22","EU46"],"featured":["EU19","EU21","CP28"],"future":"帮助强度与路径可能随学习状态变化，并允许学生、教师改变；检验是否形成依赖。","origin":"引用对话最终回答·第5条，保留原名"},{"id":"RT06","number":6,"title":"生成式用户界面","english":"Generative UI","education_change":"围绕教师审核的目标生成可以操作、观察和得到提示的界面","boundary":"生成歌词、题目或文字不等于生成式UI；现有直接案例仍为研究试点。","evidence":["ES10"],"units":["EU59"],"featured":["EU59"],"future":"教师可能从目标表达进入可操作任务生成，设计需保证目标、规则、提示与审核相连。","origin":"引用对话最终回答·第6条，保留原名"},{"id":"RT07","number":7,"title":"空间交互与生成式环境","english":"Spatial Interaction / Generative Interactive Environments","education_change":"由观察固定内容，扩展到在空间或生成环境中行动与探索","boundary":"现有NOBOOK、PhET、VR与3D设备只支持空间／仿真侧；不能由此认定有生成式世界模型。","evidence":["ES11","ES10"],"units":["CP27","EU26","EU27","EU28","EU29","EU36","EU40","EU41","EU59"],"featured":["CP27","EU36","EU41","EU59"],"future":"生成环境可能用于情境探究；学科规律与安全相关训练须先验证，不能用视觉逼真替代。","origin":"引用对话最终回答·第7条，保留原名"},{"id":"RT08","number":8,"title":"跨设备与分布式交互","english":"Cross-device / Distributed Interaction","education_change":"让一项教学任务跨纸笔、屏幕、学生端与教师端延续","boundary":"设备互联不自动保证学习状态、身份、权限和修改结果连续。","evidence":["ES06","ES01"],"units":["CP19","CP20","CP21","CP22","CP23","CP24","CP25","CP26","CP32","CP33","CP36","EU08","EU14","EU35","EU37","EU38","EU47","EU48","EU54"],"featured":["CP19","CP21","CP25","CP33"],"future":"课内外、纸笔与数字任务可能更连续；检查错误更正和权限是否跨端同步。","origin":"引用对话最终回答·第8条，保留原名"},{"id":"RT09","number":9,"title":"多感官体验与反馈","english":"Multisensory Interaction / Feedback","education_change":"按任务把反馈分配给视觉、声音或其他已实现的感官通道","boundary":"输入用到声音与动作，不等于输出存在触觉反馈；不推断教育设备配有超声触觉。","evidence":["ES07","ES08"],"units":["CP06","EU04","EU05","EU09","EU10","EU11","EU12","EU54","EU58"],"featured":["EU10","EU12","EU54"],"future":"反馈可按任务和注意条件分配感官；更多感官不一定更清楚，也可能增加负担。","origin":"引用对话最终回答·第9条，保留原名"},{"id":"RT10","number":10,"title":"能力导向与包容性交互","english":"Ability-based Design / Inclusive Interaction","education_change":"让不同能力与情境下的学生有可选择的参与方式","boundary":"辅助概念、界面可达性与医疗能力恢复应分别评价。","evidence":["ES04","ES03"],"units":["CP26","EU46","EU47","EU54","EU55"],"featured":["EU54","EU55","CP26"],"future":"辅助入口可能更融入普通课堂，同时让学生选择启用和分享；需要目标群体参与验证。","origin":"引用对话最终回答·第10条，保留原名"},{"id":"RT11","number":11,"title":"技能形成与学习支持","english":"Skillization / Learning Support","education_change":"评价从完成任务扩展到独立能力、解释与迁移","boundary":"这是教育目标与评价要求，不能以AI在场时的高分证明技能形成。","evidence":["ES02","ES05"],"units":["CP16","CP17","CP18","CP21","CP22","CP23","CP27","CP28","CP29","CP31","CP35","EU04","EU05","EU06","EU07","EU08","EU09","EU10","EU11","EU12","EU13","EU14","EU16","EU17","EU18","EU19","EU20","EU21","EU22","EU26","EU27","EU28","EU29","EU30","EU31","EU32","EU33","EU34","EU36","EU37","EU38","EU39","EU40","EU41","EU43","EU44","EU45","EU46","EU47","EU52","EU54","EU55","EU56","EU57","EU58","EU59","CP08","EU02"],"featured":["EU10","EU19","EU30"],"future":"产品价值可能更多体现为提示减少后仍会做、会解释、会迁移，而非答案生成速度。","origin":"引用对话最终回答·第11条，保留原名"},{"id":"RT12","number":12,"title":"可解释交互与信任校准","english":"Explainable AI / Trust Calibration","education_change":"让教师和学生理解判断依据、发现错误并决定是否采用","boundary":"分数、报告或流畅解释不等于可信；未公开纠错功能的产品只列设计要求。","evidence":["ES13","ES04"],"units":["CP05","CP07","CP11","CP12","CP13","CP15","CP19","CP20","CP21","CP22","CP23","CP28","CP29","EU02","EU03","EU07","EU11","EU12","EU17","EU18","EU19","EU20","EU21","EU22","EU23","EU24","EU25","EU37","EU39","EU43","EU46","EU47","EU49","EU50","EU51","EU53","EU57","EU59"],"featured":["CP19","EU24","EU47"],"future":"更多学习和治理决定依赖AI时，出处、修改、接管与不确定性表达会成为核心交互。","origin":"引用对话最终回答·第12条，保留原名"}],"embodiment":{"title":"“具身”怎样对应，才不会把概念混在一起","lead":"沿用引用对话的“具身与实体交互”。人的身体参与、数字与实体连接、机器人的具身智能是可关联但不同的研究对象。","levels":[{"title":"人的具身交互／具身学习","question":"人的动作、物体操作与空间关系怎样承担表达和理解？","units":["EU09","EU10","CP16","EU30","EU40"],"judgement":"这些产品有真实动作—反馈关系，适合从具身交互分析；是否形成学习迁移仍须测试。","avoid":"不因识别到身体动作，就称设备具备具身智能。"},{"title":"数字与实体连接／空间仿真","question":"纸笔、屏幕或虚拟模型怎样连接任务？","units":["CP19","CP26","CP27","EU36","EU41"],"judgement":"纸笔采集、触屏手势、3D与VR各有依据；并不都属于动作知识学习，也未证明具备世界模型。","avoid":"不把多指触控写成隔空手势，不把VR或预设仿真写成生成环境／数字孪生。"},{"title":"具身智能的学习载体与具体任务","question":"实体代理是否感知环境、用模型／规则选择动作，再依据结果继续任务？","units":["EU32","EU33","EU34","EU44","EU45"],"judgement":"机器人和机械手可用于教授感知—决策—行动；必须查看具体课程是模型推断、固定规则还是人直接控制。","avoid":"不从“有机器人、有摄像头、有机械手”推定自主学习或通用具身智能。"}],"engineering_reference":"RT-2是视觉—语言—动作模型控制实体机器人的研究参照，用来说明物理任务闭环；不把它列为中小学教学产品，也不声称这是具身智能的唯一学术定义。","evidence":["ES08","ES09"],"research_question":"若选择具身方向，可研究：学生能否把动作、系统识别、反馈与知识解释对应起来，并在撤去提示后完成变式任务。"},"reference_chain_note":"所引用对话要求每问先给答案，再以真实案例、交互变化与证据展开。本页保留原六步变化链，并补入Google学习交互研究，具体回答资源制作、参与条件与生成环境的变化。","revision":"引用对话12条趋势逐项对应；具身边界与逐产品证据角色校准"},"student_mental_health_20261101":{"as_of":"2026-11-01","title":"学生心理健康交互设计｜设计学核心论文与获奖案例","scope":"优先研究普通中小学生的心理健康交互。其他设计核心区现有《装饰》《南京艺术学院学报（美术与设计）》《艺术设计研究》8篇，逐条区分AI原型、理论方法和学生验证；3篇国际HCI研究单列。此前《包装工程》与特殊教育资料保留在前轮分区。","evidence_note":"本轮已核公开资料中，仍未确认同时满足“国内设计学核心＋普通中小学生＋实际AI心理健康交互验证”的论文。其他设计核心区现有8篇、来自3种期刊：本次补入2篇《装饰》AI交互与智能代理文献，其中“护甲熊”有实际AI原型；均未核到普通中小学生心理健康验证。3篇中小学相关国际HCI研究继续单列，不计国内核心。","access_note":"核验日期：2026-11-01。新条目逐条标注读取范围与全文权限；未把目录摘要称为全文。旧《包装工程》12篇仍按原刊题录和摘要分析，未逐篇阅读全文。","core_note":"本轮12篇完整题录均来自《包装工程》设计栏目，是设计研究论文；期刊为北大中文核心（2023版，TB4类），不是CSSCI艺术学期刊。栏目学科定位由原刊简介核实，核心资格由高校公布的2023版完整目录交叉核实。另列《装饰》作者自述线索，未补全原刊刊期、页码前不计入12篇。","categories":[{"id":"MC01","title":"自我觉察与情绪表达","goal":"帮助学生辨认、命名和描述情绪，保留自己的解释权。","papers":["DP01","DP05","DP08","DP11","DP12"],"cases":["MA01","MA03","MA05"],"design":"用说、画、选卡或触摸提供不同表达入口；AI先复述并邀请纠正，再给建议。","test":"学生能否说清发生了什么，并指出AI理解错误的地方？","background_papers":["MP01","MP03","MP04","MP05"],"evidence_boundary":"论文配对用于比较设计机制，不是对获奖产品的效果验证。"},{"id":"MC02","title":"情绪调节与应对技能","goal":"围绕具体情境练习应对方法，观察是否能在没有设备时运用。","papers":["DP02","DP03","DP06","DP07","DP09","DP10"],"cases":["MA04","MA05","MA06"],"design":"把倾诉接到短练习、反思与现实行动；练习结束可自主退出。","test":"离开产品后，能否独立选择一种合适的应对方法？","background_papers":["MP03","MP04","MP06","MP09"],"evidence_boundary":"论文配对用于比较设计机制，不是对获奖产品的效果验证。"},{"id":"MC03","title":"社会情绪学习与同伴关系","goal":"学习表达需求、理解他人、协商与处理冲突。","papers":["DP01","DP04","DP05","DP06"],"cases":["MA02","MA03","MA04"],"design":"让AI扮演可重复练习的角色，保留多种合理回应和与真人练习的环节。","test":"面对新情境或真人同伴，表达与协商是否仍然有效？","background_papers":["MP02","MP04","MP07","MP09"],"evidence_boundary":"论文配对用于比较设计机制，不是对获奖产品的效果验证。"},{"id":"MC04","title":"融合教育与发展支持","goal":"按表达、注意和感官需求提供参与方式，不把诊断标签直接当作统一设计需求。","papers":["DP03","DP04","DP05","DP06","DP08"],"cases":["MA07","MA08"],"design":"分步提示、可预期流程、可调反馈强度和实体任务标记。","test":"用户是否理解下一步、 ssue":"6","pages":"53–61","doi":"10.19554/j.cnki.1001-3563.2026.06.006","kind":"多感官交互设计综述","scope":"特殊教育支持 · 孤独症儿童","categories":["MC01","MC02","MC04"],"ai_related":false,"ai_role":"AI未确认：研究多感官设计机制，不能据此推断存在AI情绪识别算法。","method":"系统性梳理多感官互动设计的理论基础、应用模式及效果评估，重点分析视觉、听觉、触觉对情绪识别、表达和调节的跨模态作用。","finding":"将多感官设计与情绪加工联系起来，为不同感官通道的组合提供研究框架。","design":"研究哪些信息适合通过声音、触觉、灯光呈现，以及如何让儿童调节强度、节奏和参与方式；可与多模态陪伴设备对照。","limit":"孤独症儿童支持与普通学生心理健康教育分开讨论；多感官呈现不自动等于AI多模态融合，综述结论不是某品牌的独立验证。","links":[{"label":"原刊文章页／摘要","url":"http://www.designartj.com/CN/10.19554/j.cnki.1001-3563.2026.06.006"},{"label":"DOI原链接","url":"https://doi.org/10.19554/j.cnki.1001-3563.2026.06.006"}],"access":"已读取原刊题录、作者、卷期页码与摘要；未逐篇阅读全文。","priority":true,"checked":"2026-11-01","source_key":"multisensory"},{"id":"DP04","title":"基于情绪体验的ASD儿童干预机器人造型研究","authors":["孙福旭","张丙辰","王瑞","陈秋羽","陆蕴妍"],"journal_id":"DJ01","year":2024,"volume":"45","issue":"6","pages":"74–85","doi":"10.19554/j.cnki.1001-3563.2024.06.008","kind":"干预机器人造型与情绪体验评价","scope":"特殊教育支持 · ASD儿童","categories":["MC03","MC04"],"ai_related":false,"ai_role":"AI运行机制未确认：机器人这一载体本身不构成AI证据。","method":"对机器人进行拟人化分类，结合8项HRV指标、改进PAD量表与逐步回归，建立机器人造型和情绪体验的评价关系。","finding":"在该研究条件下，不同形态对应不同情绪体验；提供了机器人形象设计的主客观联合评价路径。","design":"比较真实人形、几何形和动物等形象是否让目标儿童愿意接近，再观察表情、姿态、材质与互动的关系。","limit":"生理信号在这里用于评价设计，不是证明机器人能够读懂儿童内心；摘要没有提供可外推至全部学生的年龄和样本依据。","links":[{"label":"原刊文章页／摘要","url":"http://www.designartj.com/CN/10.19554/j.cnki.1001-3563.2024.06.008"},{"label":"DOI原链接","url":"https://doi.org/10.19554/j.cnki.1001-3563.2024.06.008"}],"access":"已读取原刊题录、作者、卷期页码与摘要；未逐篇阅读全文。","priority":true,"checked":"2026-11-01","source_key":"asd_robot"},{"id":"DP05","title":"基于情绪体验的ASD儿童干预APP角色造型研究","authors":["韦懿洋","张丙辰","孙福旭","王瑞"],"journal_id":"DJ01","year":2023,"volume":"44","issue":"8","pages":"140–152","doi":"10.19554/j.cnki.1001-3563.2023.08.014","kind":"干预APP角色设计与体验评价","scope":"特殊教育支持 · ASD儿童","categories":["MC01","MC03","MC04"],"ai_related":false,"ai_role":"非AI直接证据：摘要使用回归与体验评价，没有披露AI对话或识别模型。","method":"
